name: "Go Quality & Security"
description: "golangci-lint, go vet, gosec, gofmt checks"

inputs:
  go-version:
    description: "Go version"
    required: false
    default: "1.24"
  working-directory:
    description: "Working directory"
    required: false
    default: "."
  golangci-lint-version:
    description: "golangci-lint version"
    required: false
    default: "v1.64.8"
  lint-timeout:
    description: "Lint timeout"
    required: false
    default: "5m"

outputs:
  quality-passed:
    description: "Whether all quality checks passed"
    value: ${{ steps.summary.outputs.passed }}
  security-issues:
    description: "Number of security issues found"
    value: ${{ steps.summary.outputs.security-issues }}
  linting-status:
    description: "Linting status"
    value: ${{ steps.summary.outputs.linting-status }}

runs:
  using: "composite"
  steps:
    - name: Setup Go environment
      uses: didlawowo/workflow-ci/.github/actions/setup-go-env@main
      with:
        go-version: ${{ inputs.go-version }}
        working-directory: ${{ inputs.working-directory }}

    - name: Install golangci-lint
      shell: bash
      run: |
        # Build from source with the runner's Go toolchain. A prebuilt binary is compiled
        # against a fixed Go version and refuses to lint modules whose go.mod `go` directive
        # is newer (e.g. v1.64.8 is built with go1.24 and errors on `go 1.25.0`: "the Go
        # language version used to build golangci-lint is lower than the targeted version").
        # Building here uses the toolchain from setup-go, so it always matches the project.
        # golangci-lint v2 moved to a `/v2` module path, so pick the path by major version
        # ("latest" and v1.x resolve to the v1 module; only v2.x needs the /v2 path).
        VERSION="${{ inputs.golangci-lint-version }}"
        case "$VERSION" in
          v2*) MODULE="github.com/golangci/golangci-lint/v2/cmd/golangci-lint" ;;
          *)   MODULE="github.com/golangci/golangci-lint/cmd/golangci-lint" ;;
        esac
        go install "${MODULE}@${VERSION}"

    - name: Run golangci-lint
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if golangci-lint run --timeout=${{ inputs.lint-timeout }} --out-format=github-actions ./...; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Run go vet
      id: vet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if go vet ./...; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Check formatting
      id: fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$UNFORMATTED" ]; then
          echo "Unformatted files:"
          echo "$UNFORMATTED"
          echo "status=failed" >> "$GITHUB_OUTPUT"
        else
          echo "status=passed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Run GoSec
      id: gosec
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Don't let a gosec install/build hiccup fail the whole quality job (this step has
        # no continue-on-error). `@latest` is a moving target and can break against a new Go.
        go install github.com/securego/gosec/v2/cmd/gosec@latest || true
        if command -v gosec >/dev/null 2>&1; then
          gosec -fmt sarif -out gosec-results.sarif ./... || true
          gosec -fmt text ./... || true
        else
          echo "gosec not available, skipping security scan"
        fi

    # Upload SARIF retiré : Code Scanning nécessite GHAS (indispo sur repos privés
    # perso) → l'upload échouait toujours. gosec tourne et gate la qualité ci-dessous.

    - name: Analyze results
      id: summary
      shell: bash
      run: |
        QUALITY_PASSED=true
        LINTING_STATUS="passed"
        SECURITY_ISSUES=0

        if [ "${{ steps.lint.outputs.status }}" != "passed" ]; then
          QUALITY_PASSED=false
          LINTING_STATUS="failed"
        fi
        if [ "${{ steps.vet.outputs.status }}" != "passed" ]; then
          QUALITY_PASSED=false
        fi
        if [ "${{ steps.fmt.outputs.status }}" != "passed" ]; then
          QUALITY_PASSED=false
        fi

        SARIF="${{ inputs.working-directory }}/gosec-results.sarif"
        if [ -f "$SARIF" ]; then
          SECURITY_ISSUES=$(jq '.runs[0].results | length' "$SARIF" 2>/dev/null || echo 0)
        fi

        {
          echo "passed=${QUALITY_PASSED}"
          echo "security-issues=${SECURITY_ISSUES}"
          echo "linting-status=${LINTING_STATUS}"
        } >> "$GITHUB_OUTPUT"
