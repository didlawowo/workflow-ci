name: Go Quality & Security
description: Blocking local lint/vet/format/GoSec evidence; optional non-blocking SARIF publication
inputs:
  go-version:
    description: Go version
    default: '1.24'
  working-directory:
    description: Working directory
    default: '.'
  golangci-lint-version:
    description: Exact release or auto (v1.64.8 for legacy config, v2.13.2 for version 2 config)
    default: auto
  lint-timeout:
    description: Lint timeout
    default: 5m
  gosec-version:
    description: Pinned GoSec release
    default: v2.29.0
  upload-sarif:
    description: Opt-in Code Scanning publication; caller must grant security-events write
    default: 'false'
outputs:
  quality-passed:
    description: Whether all local quality and security checks passed
    value: ${{ steps.summary.outputs.passed }}
  security-issues:
    description: Local SARIF findings, or -1 if the scanner did not produce valid evidence
    value: ${{ steps.summary.outputs.security-issues }}
  linting-status:
    description: Linting status
    value: ${{ steps.summary.outputs.linting-status }}
runs:
  using: composite
  steps:
    - name: Setup Go environment
      id: setup
      uses: $/.github/actions/setup-go-env
      with:
        go-version: ${{ inputs.go-version }}
        working-directory: ${{ inputs.working-directory }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
    - name: Resolve compatible golangci-lint
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT_VERSION: ${{ inputs.golangci-lint-version }}
      run: bash "$GITHUB_ACTION_PATH/quality.sh" resolve
    - name: Cache golangci-lint binary
      id: cache-golangci
      uses: actions/cache@v4
      with:
        path: ${{ steps.version.outputs.bin }}
        key: golangci-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.go-version }}-${{ steps.version.outputs.version }}
    - name: Install golangci-lint
      if: steps.cache-golangci.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        GOBIN: ${{ steps.version.outputs.bin }}
      run: |
        set -euo pipefail
        case "$VERSION" in
          v2*) MODULE=github.com/golangci/golangci-lint/v2/cmd/golangci-lint ;;
          *) MODULE=github.com/golangci/golangci-lint/cmd/golangci-lint ;;
        esac
        mkdir -p "$GOBIN"
        GOTOOLCHAIN=auto go install "$MODULE@$VERSION"
    - name: Run golangci-lint
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT_VERSION: ${{ steps.version.outputs.version }}
        LINT_BIN: ${{ steps.version.outputs.bin }}
        LINT_TIMEOUT: ${{ inputs.lint-timeout }}
      run: bash "$GITHUB_ACTION_PATH/quality.sh" lint
      continue-on-error: true
    - name: Run go vet
      id: vet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/quality.sh" vet
      continue-on-error: true
    - name: Check formatting
      id: fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/quality.sh" fmt
      continue-on-error: true
    - name: Run GoSec
      id: gosec
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GOSEC_VERSION: ${{ inputs.gosec-version }}
      run: bash "$GITHUB_ACTION_PATH/quality.sh" gosec
      continue-on-error: true
    - name: Analyze local results
      id: summary
      if: always()
      shell: bash
      env:
        LINT_STATUS: ${{ steps.lint.outputs.status }}
        VET_STATUS: ${{ steps.vet.outputs.status }}
        FMT_STATUS: ${{ steps.fmt.outputs.status }}
        GOSEC_STATUS: ${{ steps.gosec.outputs.status }}
        GOSEC_ISSUES: ${{ steps.gosec.outputs.issues }}
      run: bash "$GITHUB_ACTION_PATH/quality.sh" summary
    - name: Retain local GoSec evidence
      if: always() && hashFiles(format('{0}/gosec-results.sarif', inputs.working-directory)) != ''
      uses: actions/upload-artifact@v6
      continue-on-error: true
      with:
        name: gosec-results-${{ github.job }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory)) }}
        path: ${{ inputs.working-directory }}/gosec-results.sarif
        retention-days: 7
        if-no-files-found: error
    - name: Upload GoSec SARIF
      if: always() && inputs.upload-sarif == 'true' && (steps.gosec.outputs.status == 'passed' || steps.gosec.outputs.status == 'findings')
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.working-directory }}/gosec-results.sarif
        category: gosec
