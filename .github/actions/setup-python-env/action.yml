name: "Setup Python Environment"
description: "Setup Python with uv and install dependencies"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  install-dev:
    description: "Install dev dependencies"
    required: false
    default: "true"
  working-directory:
    description: "Project directory containing pyproject.toml"
    required: false
    default: "."

outputs:
  python-version:
    description: "Python version installed"
    value: ${{ steps.setup.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - name: Resolve writable uv cache
      id: uv-cache
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../.ci/nfs-cache.sh"
        require_nfs_cache UV_CACHE_DIR
        python_index_fallback_if_unreachable
        echo "path=$UV_CACHE_DIR" >> "$GITHUB_OUTPUT"
        echo "UV_CACHE_DIR=$UV_CACHE_DIR" >> "$GITHUB_ENV"

    - name: Detect preinstalled uv
      id: uv-runtime
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled uv: $(uv --version)"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install uv
      if: steps.uv-runtime.outputs.preinstalled != 'true'
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: "latest"
        enable-cache: false
        cache-local-path: ${{ steps.uv-cache.outputs.path }}
        prune-cache: false

    - name: Set up Python
      id: setup
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        echo "python-version=${{ inputs.python-version }}" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        DEV_MODES=""
        if [ "${{ inputs.install-dev }}" = "true" ]; then
          DEV_MODES="$(
            uv run --no-project --python "${{ inputs.python-version }}" python - <<'PY'
        import pathlib
        import tomllib

        data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
        modes = []
        if "dev" in data.get("project", {}).get("optional-dependencies", {}):
            modes.append("extra")
        if "dev" in data.get("dependency-groups", {}):
            modes.append("group")
        print(" ".join(modes))
        PY
          )"
        fi

        SYNC_ARGS=()
        case " ${DEV_MODES} " in
          *" extra "*) SYNC_ARGS+=(--extra dev) ;;
        esac
        case " ${DEV_MODES} " in
          *" group "*) SYNC_ARGS+=(--group dev) ;;
        esac

        CONTRACT="$GITHUB_ACTION_PATH/../../../.ci/mutation_contract.py"
        LOCKED_REGISTRY="$(uv run --no-project --python "${{ inputs.python-version }}" python "$CONTRACT" locked-internal-registry)"
        USE_LOCK_EXPORT_FALLBACK=false
        if [[ -n "$LOCKED_REGISTRY" ]] &&
           ! curl -fsS --connect-timeout 2 --max-time 3 "${LOCKED_REGISTRY%/}/pip/" >/dev/null 2>&1; then
          USE_LOCK_EXPORT_FALLBACK=true
          echo "::warning::Locked Python registry is unreachable ($LOCKED_REGISTRY); preserving locked versions and downloading them from PyPI."
        fi

        if [[ "$USE_LOCK_EXPORT_FALLBACK" == true ]]; then
          REQUIREMENTS_FILE="$(mktemp)"
          CLEAN_REQUIREMENTS_FILE="$(mktemp)"
          uv export --frozen --no-emit-project --no-hashes "${SYNC_ARGS[@]}" --output-file "$REQUIREMENTS_FILE"
          sed -E '/^--(index-url|extra-index-url|find-links)([ =]|$)/d' "$REQUIREMENTS_FILE" > "$CLEAN_REQUIREMENTS_FILE"
          if grep -Fq ".svc.cluster.local" "$CLEAN_REQUIREMENTS_FILE"; then
            echo "::error::Frozen dependency export still contains an internal registry URL."
            exit 1
          fi

          PROJECT_ENV="${UV_PROJECT_ENVIRONMENT:-.venv}"
          if [[ "$PROJECT_ENV" != /* ]]; then
            PROJECT_ENV="$PWD/$PROJECT_ENV"
          fi
          if [[ ! -x "$PROJECT_ENV/bin/python" ]]; then
            uv venv "$PROJECT_ENV" --python "${{ inputs.python-version }}"
          fi
          PIP_INDEX_URL="https://pypi.org/simple" UV_DEFAULT_INDEX="https://pypi.org/simple" \
            uv pip install --python "$PROJECT_ENV/bin/python" -r "$CLEAN_REQUIREMENTS_FILE"
          PIP_INDEX_URL="https://pypi.org/simple" UV_DEFAULT_INDEX="https://pypi.org/simple" \
            uv pip install --python "$PROJECT_ENV/bin/python" --no-deps -e .
          rm -f "$REQUIREMENTS_FILE" "$CLEAN_REQUIREMENTS_FILE"
        else
          uv sync "${SYNC_ARGS[@]}"
        fi
