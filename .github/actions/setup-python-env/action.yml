name: "Setup Python Environment"
description: "Setup Python with uv and install dependencies"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  install-dev:
    description: "Install dev dependencies"
    required: false
    default: "true"
  working-directory:
    description: "Project directory containing pyproject.toml"
    required: false
    default: "."

outputs:
  python-version:
    description: "Python version installed"
    value: ${{ steps.setup.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - name: Detect preinstalled uv
      id: uv-runtime
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled uv: $(uv --version)"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install uv
      if: steps.uv-runtime.outputs.preinstalled != 'true'
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: "0.13.7"
        enable-cache: false
        prune-cache: false

    - name: Set up Python
      id: setup
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        echo "python-version=${{ inputs.python-version }}" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED_PYTHON: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        SELECTION="$("$GITHUB_ACTION_PATH/sync-python-args.sh" "$REQUESTED_PYTHON")"
        PYTHON_ARGS=()
        [ -z "$SELECTION" ] || mapfile -t PYTHON_ARGS <<<"$SELECTION"
        if [ "${{ inputs.install-dev }}" != "true" ]; then
          uv sync "${PYTHON_ARGS[@]}"
          exit 0
        fi

        DEV_MODES="$(
          uv run --no-project --python "${{ inputs.python-version }}" python - <<'PY'
        import pathlib
        import tomllib

        data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
        modes = []
        if "dev" in data.get("project", {}).get("optional-dependencies", {}):
            modes.append("extra")
        if "dev" in data.get("dependency-groups", {}):
            modes.append("group")
        print(" ".join(modes))
        PY
        )"

        SYNC_ARGS=()
        case " ${DEV_MODES} " in
          *" extra "*) SYNC_ARGS+=(--extra dev) ;;
        esac
        case " ${DEV_MODES} " in
          *" group "*) SYNC_ARGS+=(--group dev) ;;
        esac
        uv sync "${PYTHON_ARGS[@]}" "${SYNC_ARGS[@]}"
