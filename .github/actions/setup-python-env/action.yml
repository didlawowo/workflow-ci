name: "Setup Python Environment"
description: "Setup Python with uv and install dependencies"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  install-dev:
    description: "Install dev dependencies"
    required: false
    default: "true"
  working-directory:
    description: "Project directory containing pyproject.toml"
    required: false
    default: "."

outputs:
  python-version:
    description: "Python version installed"
    value: ${{ steps.setup.outputs.python-version }}

runs:
  using: "composite"
  steps:
    # ARC fournit UV_CACHE_DIR sur son volume persistant : conserver ce chemin
    # sans restauration/sauvegarde GitHub ni purge du cache partagé.
    # Sans chemin fourni, setup-uv choisit un répertoire adapté au runner et
    # utilise le cache GitHub. Ne pas imposer /home/runner sur un runner hébergé.
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: ${{ env.UV_CACHE_DIR == '' }}
        cache-local-path: ${{ env.UV_CACHE_DIR }}
        prune-cache: ${{ env.UV_CACHE_DIR == '' }}

    - name: Set up Python
      id: setup
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        echo "python-version=${{ inputs.python-version }}" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.install-dev }}" != "true" ]; then
          uv sync
          exit 0
        fi

        DEV_MODES="$(
          uv run --no-project --python "${{ inputs.python-version }}" python - <<'PY'
        import pathlib
        import tomllib

        data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
        modes = []
        if "dev" in data.get("project", {}).get("optional-dependencies", {}):
            modes.append("extra")
        if "dev" in data.get("dependency-groups", {}):
            modes.append("group")
        print(" ".join(modes))
        PY
        )"

        SYNC_ARGS=()
        case " ${DEV_MODES} " in
          *" extra "*) SYNC_ARGS+=(--extra dev) ;;
        esac
        case " ${DEV_MODES} " in
          *" group "*) SYNC_ARGS+=(--group dev) ;;
        esac
        uv sync "${SYNC_ARGS[@]}"
