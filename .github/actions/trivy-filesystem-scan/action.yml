name: "Trivy Filesystem Security Scan"
description: "Filesystem security scanning with Trivy (vuln, misconfig, licenses); secrets are handled by TruffleHog"

inputs:
  scan-path:
    description: "Path to scan"
    required: false
    default: "."
  severity:
    description: "Vulnerability severity levels"
    required: false
    default: "CRITICAL,HIGH,MEDIUM"
  scanners:
    description: "Compatibility input; Trivy secret scanning is disabled because TruffleHog owns secret detection"
    required: false
    default: "vuln,misconfig,license"
  fail-on-critical:
    description: "Fail workflow on critical vulnerabilities"
    required: false
    default: "false"
  ignore-unfixed:
    description: "Ignore unfixed vulnerabilities"
    required: false
    default: "true"

outputs:
  vulnerabilities-found:
    description: "Number of vulnerabilities found"
    value: ${{ steps.analysis.outputs.vuln-count }}
  secrets-found:
    description: "Deprecated compatibility output; Trivy secret scanning is disabled"
    value: ${{ steps.analysis.outputs.secret-count }}
  misconfigurations-found:
    description: "Number of misconfigurations found"
    value: ${{ steps.analysis.outputs.misconfig-count }}
  scan-status:
    description: "Overall scan status"
    value: ${{ steps.analysis.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Detect preinstalled Trivy
      id: trivy-runtime
      shell: bash
      run: |
        set -euo pipefail
        if command -v trivy >/dev/null 2>&1 && trivy --version 2>&1 | grep -q 'Version: 0.70.0'; then
          echo "skip-setup=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled Trivy: $(command -v trivy)"
        else
          echo "skip-setup=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve Trivy cache
      id: trivy-cache
      shell: bash
      run: |
        set -euo pipefail
        LOCAL_CACHE="${RUNNER_TEMP:-$GITHUB_WORKSPACE}/trivy-cache"
        rm -rf "$LOCAL_CACHE"
        mkdir -p "$LOCAL_CACHE"

        SHARED_DB="${TRIVY_SHARED_DB_DIR:-}"
        if [[ -n "$SHARED_DB" && -s "$SHARED_DB/db/trivy.db" && -s "$SHARED_DB/db/metadata.json" ]]; then
          ln -s "$SHARED_DB/db" "$LOCAL_CACHE/db"
          echo "shared-db=true" >> "$GITHUB_OUTPUT"
          echo "action-cache=false" >> "$GITHUB_OUTPUT"
          echo "Using read-only shared Trivy vulnerability DB: $SHARED_DB/db"
        else
          echo "shared-db=false" >> "$GITHUB_OUTPUT"
          echo "action-cache=true" >> "$GITHUB_OUTPUT"
          echo "Shared Trivy DB unavailable; using local DB cache"
        fi
        echo "path=$LOCAL_CACHE" >> "$GITHUB_OUTPUT"
    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SKIP_VERSION_CHECK: "true"
        TRIVY_CACHE_BACKEND: "memory"
        TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-cache.outputs.shared-db == 'true' && 'true' || 'false' }}
      with:
        version: "v0.70.0"
        skip-setup-trivy: ${{ steps.trivy-runtime.outputs.skip-setup || 'false' }}
        timeout: "15m"
        cache: ${{ steps.trivy-cache.outputs.action-cache }}
        cache-dir: ${{ steps.trivy-cache.outputs.path }}
        scan-type: "fs"
        scan-ref: ${{ inputs.scan-path }}
        format: "sarif"
        output: "trivy-fs-vulnerabilities.sarif"
        severity: ${{ inputs.severity }}
        scanners: "vuln"
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        exit-code: 0
      continue-on-error: true

    - name: Run Trivy misconfiguration scan
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SKIP_VERSION_CHECK: "true"
        TRIVY_CACHE_BACKEND: "memory"
        TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-cache.outputs.shared-db == 'true' && 'true' || 'false' }}
      with:
        version: "v0.70.0"
        skip-setup-trivy: ${{ steps.trivy-runtime.outputs.skip-setup || 'false' }}
        timeout: "15m"
        cache: ${{ steps.trivy-cache.outputs.action-cache }}
        cache-dir: ${{ steps.trivy-cache.outputs.path }}
        scan-type: "fs"
        scan-ref: ${{ inputs.scan-path }}
        format: "sarif"
        output: "trivy-fs-misconfig.sarif"
        scanners: "misconfig"
        severity: ${{ inputs.severity }}
        exit-code: 0
      continue-on-error: true

    - name: Run Trivy license scan
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SKIP_VERSION_CHECK: "true"
        TRIVY_CACHE_BACKEND: "memory"
        TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-cache.outputs.shared-db == 'true' && 'true' || 'false' }}
      with:
        version: "v0.70.0"
        skip-setup-trivy: ${{ steps.trivy-runtime.outputs.skip-setup || 'false' }}
        timeout: "15m"
        cache: ${{ steps.trivy-cache.outputs.action-cache }}
        cache-dir: ${{ steps.trivy-cache.outputs.path }}
        scan-type: "fs"
        scan-ref: ${{ inputs.scan-path }}
        format: "sarif"
        output: "trivy-fs-licenses.sarif"
        scanners: "license"
        exit-code: 0
      continue-on-error: true

    - name: Upload vulnerability results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: "trivy-fs-vulnerabilities.sarif"
        category: "trivy-fs-vulnerabilities"
      continue-on-error: true

    - name: Upload misconfiguration results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: "trivy-fs-misconfig.sarif"
        category: "trivy-fs-misconfig"
      continue-on-error: true

    - name: Upload license results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: "trivy-fs-licenses.sarif"
        category: "trivy-fs-licenses"
      continue-on-error: true

    - name: Check for critical issues
      if: inputs.fail-on-critical == 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SKIP_VERSION_CHECK: "true"
        TRIVY_CACHE_BACKEND: "memory"
        TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-cache.outputs.shared-db == 'true' && 'true' || 'false' }}
      with:
        version: "v0.70.0"
        skip-setup-trivy: ${{ steps.trivy-runtime.outputs.skip-setup || 'false' }}
        timeout: "15m"
        cache: ${{ steps.trivy-cache.outputs.action-cache }}
        cache-dir: ${{ steps.trivy-cache.outputs.path }}
        scan-type: "fs"
        scan-ref: ${{ inputs.scan-path }}
        format: "table"
        severity: "CRITICAL"
        scanners: "vuln"
        exit-code: 1
        ignore-unfixed: false

    - name: Analyze scan results
      id: analysis
      shell: bash
      run: |
        VULN_COUNT=0
        SECRET_COUNT=0
        MISCONFIG_COUNT=0
        STATUS="success"

        if [ -f trivy-fs-vulnerabilities.sarif ]; then
          VULN_COUNT=$(jq '.runs[0].results | length' trivy-fs-vulnerabilities.sarif 2>/dev/null || echo 0)
        fi
        # Secret scanning is intentionally owned by TruffleHog.
        SECRET_COUNT=0
        if [ -f trivy-fs-misconfig.sarif ]; then
          MISCONFIG_COUNT=$(jq '.runs[0].results | length' trivy-fs-misconfig.sarif 2>/dev/null || echo 0)
        fi

        if [ "$VULN_COUNT" -gt 0 ] || [ "$SECRET_COUNT" -gt 0 ] || [ "$MISCONFIG_COUNT" -gt 0 ]; then
          STATUS="issues-found"
        fi

        {
          echo "vuln-count=${VULN_COUNT}"
          echo "secret-count=${SECRET_COUNT}"
          echo "misconfig-count=${MISCONFIG_COUNT}"
          echo "status=${STATUS}"
        } >> "$GITHUB_OUTPUT"

    - name: Upload scan artifacts
      uses: actions/upload-artifact@v6
      continue-on-error: true
      if: always()
      with:
        name: trivy-filesystem-results
        path: trivy-fs-*.sarif
        retention-days: 30