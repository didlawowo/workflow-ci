name: "Run Go Tests"
description: "Execute Go tests with coverage reporting"

inputs:
  go-version:
    description: "Go version"
    required: false
    default: "1.24"
  coverage-threshold:
    description: "Minimum coverage percentage"
    required: false
    default: "15"
  working-directory:
    description: "Working directory (where go.mod is)"
    required: false
    default: "."
  test-args:
    description: "Additional go test arguments"
    required: false
    default: ""
  upload-coverage:
    description: "Upload coverage to Codecov"
    required: false
    default: "true"
  codecov-token:
    description: "Codecov token"
    required: false
    default: ""
  fail-on-coverage:
    description: "Fail if coverage below threshold"
    required: false
    default: "false"

outputs:
  coverage-percentage:
    description: "Coverage percentage achieved"
    value: ${{ steps.coverage.outputs.percentage }}
  tests-passed:
    description: "Whether all tests passed"
    value: ${{ steps.tests.outputs.passed }}
  test-count:
    description: "Number of tests executed"
    value: ${{ steps.tests.outputs.count }}
  tests-failed:
    description: "Number of failed tests"
    value: ${{ steps.tests.outputs.failed }}
  tests-skipped:
    description: "Number of skipped tests"
    value: ${{ steps.tests.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - name: Setup Go environment
      uses: $/.github/actions/setup-go-env
      with:
        go-version: ${{ inputs.go-version }}
        working-directory: ${{ inputs.working-directory }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - name: Run Go tests with coverage
      id: tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        go test -v -race -coverprofile=coverage.out -covermode=atomic ${{ inputs.test-args }} ./... 2>&1 | tee test-output.txt
        STATUS=${PIPESTATUS[0]}
        set -e

        TOTAL=$(grep -Ec '^[[:space:]]*--- (PASS|FAIL|SKIP):' test-output.txt || true)
        FAILED=$(grep -Ec '^[[:space:]]*--- FAIL:' test-output.txt || true)
        SKIPPED=$(grep -Ec '^[[:space:]]*--- SKIP:' test-output.txt || true)
        echo "count=${TOTAL:-0}" >> "$GITHUB_OUTPUT"
        echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
        echo "skipped=${SKIPPED:-0}" >> "$GITHUB_OUTPUT"
        echo "exit-code=$STATUS" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" -eq 0 ] && [ "${FAILED:-0}" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        printf '%s\n' "$STATUS" > test-exit-code

    - name: Extract coverage
      id: coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f coverage.out ]; then
          PCT=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "percentage=${PCT}" >> "$GITHUB_OUTPUT"
        else
          echo "percentage=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Check coverage threshold
      if: inputs.fail-on-coverage == 'true'
      shell: bash
      run: |
        PCT="${{ steps.coverage.outputs.percentage }}"
        THRESHOLD="${{ inputs.coverage-threshold }}"
        PASS=$(awk "BEGIN {print ($PCT >= $THRESHOLD) ? 1 : 0}")
        if [ "$PASS" -ne 1 ]; then
          echo "Coverage ${PCT}% is below threshold ${THRESHOLD}%"
          exit 1
        fi

    - name: Detect preinstalled Codecov CLI
      id: codecov-runtime
      if: inputs.upload-coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v codecov >/dev/null 2>&1 && codecov --version 2>&1 | grep -q '11.3.1'; then
          echo "binary=$(command -v codecov)" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled Codecov CLI: $(command -v codecov)"
        else
          echo "binary=" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload coverage to Codecov
      if: inputs.upload-coverage == 'true'
      uses: codecov/codecov-action@v5
      with:
        binary: ${{ steps.codecov-runtime.outputs.binary }}
        files: ${{ inputs.working-directory }}/coverage.out
        flags: unittests
        token: ${{ inputs.codecov-token }}
        fail_ci_if_error: false

    - name: Upload test artifacts
      uses: actions/upload-artifact@v6
      continue-on-error: true
      if: always()
      with:
        name: go-test-results
        path: |
          ${{ inputs.working-directory }}/coverage.out
          ${{ inputs.working-directory }}/test-output.txt
        retention-days: 7

    - name: Fail on test failure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        STATUS=$(cat test-exit-code 2>/dev/null || echo 1)
        if [ "$STATUS" -ne 0 ] || [ "${{ steps.tests.outputs.passed }}" != "true" ]; then
          echo "::error::Go tests failed (exit=$STATUS, failed=${{ steps.tests.outputs.failed }})."
          exit 1
        fi