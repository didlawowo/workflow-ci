name: "PR Quality Report"
description: "Aggregate trusted CI evidence into JSON, step summary and a sticky PR comment"

inputs:
  junit-glob:
    description: "Glob for JUnit XML files"
    required: false
    default: "coverage-reports/*report*.xml"
  coverage-glob:
    description: "Glob for Cobertura XML"
    required: false
    default: "coverage-reports/coverage.xml"
  mutation-report:
    description: "Machine-generated mutation JSON (for example mutmut-cicd-stats.json)"
    required: false
    default: ""
  coverage-percentage:
    description: "Trusted coverage percentage fallback when Cobertura XML is unavailable"
    required: false
    default: ""
  tests-total:
    description: "Trusted test count fallback when JUnit is unavailable"
    required: false
    default: ""
  tests-failed:
    description: "Trusted failed-test count fallback"
    required: false
    default: ""
  tests-skipped:
    description: "Trusted skipped-test count fallback"
    required: false
    default: ""
  test-status:
    description: "Trusted test command outcome fallback (success/failure)"
    required: false
    default: ""
  base-sha:
    description: "Base commit SHA"
    required: false
    default: ""
  head-sha:
    description: "Head commit SHA"
    required: false
    default: ""
  github-token:
    description: "Token used for history lookup and sticky PR comment"
    required: false
    default: ""
  comment:
    description: "Post/update the sticky PR comment"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup uv for quality reporter
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: false

    - name: Build quality evidence
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QUALITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        QUALITY_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail
        SCRIPT="$GITHUB_ACTION_PATH/../../../quality_report.py"
        ARGS=(
          --junit "${{ inputs.junit-glob }}"
          --coverage "${{ inputs.coverage-glob }}"
          --base "${{ inputs.base-sha }}"
          --head "${{ inputs.head-sha }}"
        )
        if [[ -n "${{ inputs.mutation-report }}" ]]; then
          ARGS+=(--mutation "${{ inputs.mutation-report }}")
        fi
        if [[ -n "${{ inputs.coverage-percentage }}" ]]; then
          ARGS+=(--coverage-percentage "${{ inputs.coverage-percentage }}")
        fi
        if [[ -n "${{ inputs.tests-total }}" ]]; then
          ARGS+=(--tests-total "${{ inputs.tests-total }}")
        fi
        if [[ -n "${{ inputs.tests-failed }}" ]]; then
          ARGS+=(--tests-failed "${{ inputs.tests-failed }}")
        fi
        if [[ -n "${{ inputs.tests-skipped }}" ]]; then
          ARGS+=(--tests-skipped "${{ inputs.tests-skipped }}")
        fi
        if [[ -n "${{ inputs.test-status }}" ]]; then
          ARGS+=(--test-status "${{ inputs.test-status }}")
        fi
        if [[ "${{ inputs.comment }}" == "true" ]]; then
          ARGS+=(--comment)
        fi
        uv run --no-project --python 3.12 python "$SCRIPT" "${ARGS[@]}"

    - name: Upload quality evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quality-evidence-${{ github.job }}-${{ github.run_id }}
        path: .quality/
        retention-days: 14
        include-hidden-files: true
