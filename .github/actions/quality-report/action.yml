name: "PR Quality Report"
description: "Aggregate trusted CI evidence into JSON, step summary and a sticky PR comment"

inputs:
  junit-glob:
    description: "Glob for JUnit XML files"
    required: false
    default: "coverage-reports/*report*.xml"
  coverage-glob:
    description: "Glob for Cobertura XML"
    required: false
    default: "coverage-reports/coverage.xml"
  mutation-report:
    description: "Machine-generated mutation JSON (for example mutmut-cicd-stats.json)"
    required: false
    default: ""
  coverage-percentage:
    description: "Trusted coverage percentage fallback when Cobertura XML is unavailable"
    required: false
    default: ""
  base-coverage-percentage:
    description: "Trusted coverage percentage measured on main/base"
    required: false
    default: ""
  changed-lines-coverage:
    description: "Trusted coverage percentage for changed/new lines"
    required: false
    default: ""
  coverage-threshold:
    description: "Coverage threshold enforced by the test action"
    required: false
    default: ""
  quality-status:
    description: "Trusted aggregate quality/lint outcome"
    required: false
    default: ""
  security-issues:
    description: "Trusted count of security issues"
    required: false
    default: ""
  mutation-result:
    description: "Trusted mutation workflow result; empty preserves standalone compatibility"
    required: false
    default: ""
  security-scan-errors:
    description: "Scanner execution errors, separate from actual security findings"
    required: false
    default: "0"
  mutation-required:
    description: "Whether mutation evidence is mandatory for this PR"
    required: false
    default: "false"
  tests-total:
    description: "Trusted test count fallback when JUnit is unavailable"
    required: false
    default: ""
  tests-failed:
    description: "Trusted failed-test count fallback"
    required: false
    default: ""
  tests-skipped:
    description: "Trusted skipped-test count fallback"
    required: false
    default: ""
  test-status:
    description: "Trusted test command outcome fallback (success/failure)"
    required: false
    default: ""
  sonar-required:
    description: "Whether SonarQube evidence is mandatory for this repository"
    required: false
    default: "false"
  sonar-status:
    description: "Trusted SonarQube scan outcome (success/failure/disabled)"
    required: false
    default: "disabled"
  sonar-project-url:
    description: "Trusted SonarQube project dashboard URL"
    required: false
    default: ""
  base-sha:
    description: "Base commit SHA"
    required: false
    default: ""
  head-sha:
    description: "Head commit SHA"
    required: false
    default: ""
  github-token:
    description: "Token used for history lookup and sticky PR comment"
    required: false
    default: ""
  comment:
    description: "Post/update the sticky PR comment"
    required: false
    default: "true"
  artifact-suffix:
    description: "Optional suffix used to keep parallel quality evidence artifacts unique"
    required: false
    default: "default"

runs:
  using: "composite"
  steps:
    - name: Detect preinstalled uv for quality reporter
      id: uv-runtime
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled uv: $(uv --version)"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install uv for quality reporter
      if: steps.uv-runtime.outputs.preinstalled != 'true'
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: "latest"
        enable-cache: false

    - name: Provision quality reporter Python
      shell: bash
      run: uv python install 3.12

    - name: Build quality evidence
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QUALITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        QUALITY_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail
        SCRIPT="$GITHUB_ACTION_PATH/../../../quality_report.py"
        ARGS=(
          --junit "${{ inputs.junit-glob }}"
          --coverage "${{ inputs.coverage-glob }}"
          --base "${{ inputs.base-sha }}"
          --head "${{ inputs.head-sha }}"
          --output-json "$GITHUB_WORKSPACE/.quality/quality-report.json"
          --output-markdown "$GITHUB_WORKSPACE/.quality/quality-report.md"
        )
        if [[ -n "${{ inputs.mutation-report }}" ]]; then
          ARGS+=(--mutation "${{ inputs.mutation-report }}")
        fi
        if [[ -n "${{ inputs.coverage-percentage }}" ]]; then
          ARGS+=(--coverage-percentage "${{ inputs.coverage-percentage }}")
        fi
        if [[ -n "${{ inputs.base-coverage-percentage }}" ]]; then
          ARGS+=(--base-coverage-percentage "${{ inputs.base-coverage-percentage }}")
        fi
        if [[ -n "${{ inputs.changed-lines-coverage }}" ]]; then
          ARGS+=(--changed-lines-coverage "${{ inputs.changed-lines-coverage }}")
        fi
        if [[ -n "${{ inputs.coverage-threshold }}" ]]; then
          ARGS+=(--coverage-threshold "${{ inputs.coverage-threshold }}")
        fi
        if [[ -n "${{ inputs.quality-status }}" ]]; then
          ARGS+=(--quality-status "${{ inputs.quality-status }}")
        fi
        if [[ -n "${{ inputs.security-issues }}" ]]; then
          ARGS+=(--security-issues "${{ inputs.security-issues }}")
        fi
        ARGS+=(--mutation-required "${{ inputs.mutation-required }}")
        if [[ -n "${{ inputs.security-scan-errors }}" ]]; then
          ARGS+=(--security-scan-errors "${{ inputs.security-scan-errors }}")
        fi
        if [[ -n "${{ inputs.mutation-result }}" ]]; then
          ARGS+=(--mutation-result "${{ inputs.mutation-result }}")
        fi
        if [[ -n "${{ inputs.tests-total }}" ]]; then
          ARGS+=(--tests-total "${{ inputs.tests-total }}")
        fi
        if [[ -n "${{ inputs.tests-failed }}" ]]; then
          ARGS+=(--tests-failed "${{ inputs.tests-failed }}")
        fi
        if [[ -n "${{ inputs.tests-skipped }}" ]]; then
          ARGS+=(--tests-skipped "${{ inputs.tests-skipped }}")
        fi
        if [[ -n "${{ inputs.test-status }}" ]]; then
          ARGS+=(--test-status "${{ inputs.test-status }}")
        fi
        ARGS+=(--sonar-required "${{ inputs.sonar-required }}")
        if [[ -n "${{ inputs.sonar-status }}" ]]; then
          ARGS+=(--sonar-status "${{ inputs.sonar-status }}")
        fi
        if [[ -n "${{ inputs.sonar-project-url }}" ]]; then
          ARGS+=(--sonar-url "${{ inputs.sonar-project-url }}")
        fi
        if [[ "${{ inputs.comment }}" == "true" ]]; then
          ARGS+=(--comment)
        fi
        uv run --no-project --python 3.12 python "$SCRIPT" "${ARGS[@]}"

    - name: Upload quality evidence
      if: always()
      uses: actions/upload-artifact@v6
      continue-on-error: true
      with:
        name: quality-evidence-${{ github.job }}-${{ github.run_id }}-${{ inputs.artifact-suffix }}
        path: .quality/
        include-hidden-files: true
        retention-days: 14
