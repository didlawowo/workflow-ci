name: "Setup Go Environment"
description: "Setup Go with caching"

inputs:
  go-version:
    description: "Go version to install"
    required: false
    default: "1.24"
  cache-dependency-path:
    description: "Path to go.sum for cache key"
    required: false
    default: "go.sum"
  working-directory:
    description: "Working directory for go commands"
    required: false
    default: "."

outputs:
  go-version:
    description: "Go version installed"
    value: ${{ steps.setup.outputs.go-version }}
  cache-hit:
    description: "Whether the cache was hit"
    value: ${{ steps.module-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup Go
      id: setup
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        # setup-go archives both GOMODCACHE and GOCACHE. On ephemeral ARC pods
        # that produced ~458 MiB restores per job, mostly compiled objects that
        # are cheap to rebuild on the native worker. Cache only the compressed
        # module downloads below: they avoid network fetches while staying much
        # smaller than the combined setup-go archive.
        cache: false

    - name: Resolve Go module download cache
      id: cache-path
      shell: bash
      run: echo "download=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"

    - name: Restore Go module downloads
      id: module-cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.cache-path.outputs.download }}
        key: go-mod-download-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.go-version }}-${{ hashFiles(inputs.cache-dependency-path) }}

    - name: Download dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download

    - name: Verify installation
      shell: bash
      run: echo "go-version=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"
