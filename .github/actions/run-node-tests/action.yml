name: "Run Node.js Tests"
description: "Execute Node.js tests with optional Playwright and coverage"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22"
  package-manager:
    description: "Package manager (npm, pnpm, yarn)"
    required: false
    default: "npm"
  test-script:
    description: "npm script to run tests"
    required: false
    default: "test"
  upload-coverage:
    description: "Upload coverage to Codecov"
    required: false
    default: "true"
  codecov-token:
    description: "Codecov token"
    required: false
    default: ""
  playwright:
    description: "Install Playwright browsers"
    required: false
    default: "false"
  playwright-browsers:
    description: "Playwright browsers to install"
    required: false
    default: "chromium"
  working-directory:
    description: "Project directory containing package.json and the lockfile"
    required: false
    default: "."

outputs:
  tests-passed:
    description: "Whether all tests passed"
    value: ${{ steps.tests.outputs.passed }}
  coverage-percentage:
    description: "Coverage percentage when coverage/coverage-summary.json exists"
    value: ${{ steps.coverage.outputs.percentage }}
  test-count:
    description: "Number of tests when a supported JUnit report exists"
    value: ${{ steps.evidence.outputs.count }}
  tests-failed:
    description: "Number of failed tests, or 1 when the command failed and no JUnit exists"
    value: ${{ steps.evidence.outputs.failed }}
  tests-skipped:
    description: "Number of skipped tests when a supported JUnit report exists"
    value: ${{ steps.evidence.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js environment
      if: inputs.working-directory == '.'
      uses: $/.github/actions/setup-node-env
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}

    - name: Install pnpm for nested project
      if: inputs.working-directory != '.' && inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Resolve nested lockfile
      if: inputs.working-directory != '.'
      id: nested-lockfile
      shell: bash
      run: |
        case "${{ inputs.package-manager }}" in
          npm) LOCKFILE="package-lock.json" ;;
          pnpm) LOCKFILE="pnpm-lock.yaml" ;;
          yarn) LOCKFILE="yarn.lock" ;;
          *) echo "::error::Unsupported package manager: ${{ inputs.package-manager }}"; exit 1 ;;
        esac
        echo "path=${{ inputs.working-directory }}/$LOCKFILE" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js for nested project
      if: inputs.working-directory != '.'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        cache-dependency-path: ${{ steps.nested-lockfile.outputs.path }}

    - name: Install nested project dependencies
      if: inputs.working-directory != '.'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        case "${{ inputs.package-manager }}" in
          npm) npm ci ;;
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) yarn install --frozen-lockfile ;;
        esac

    - name: Install Playwright browsers
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps ${{ inputs.playwright-browsers }}

    - name: Run tests
      id: tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        mkdir -p coverage-reports
        set +e
        ${{ inputs.package-manager }} run ${{ inputs.test-script }}
        STATUS=$?
        set -e
        echo "exit-code=$STATUS" >> "$GITHUB_OUTPUT"
        if [[ "$STATUS" -eq 0 ]]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract Node test evidence
      id: evidence
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_EXIT_CODE: ${{ steps.tests.outputs.exit-code }}
      run: |
        set -euo pipefail
        REPORT=""
        for candidate in           coverage-reports/junit.xml           coverage-reports/junit-report.xml           coverage-reports/test-report.xml           junit.xml           junit-report.xml           test-results/junit.xml; do
          if [[ -f "$candidate" ]]; then
            REPORT="$candidate"
            break
          fi
        done

        if [[ -n "$REPORT" ]]; then
          ATTRS="$(grep -m1 -Eo '<testsuite(s)?[^>]*>' "$REPORT" || true)"
          TOTAL="$(printf '%s' "$ATTRS" | grep -Eo 'tests="[0-9]+"' | head -1 | grep -Eo '[0-9]+' || true)"
          FAILURES="$(printf '%s' "$ATTRS" | grep -Eo 'failures="[0-9]+"' | head -1 | grep -Eo '[0-9]+' || true)"
          ERRORS="$(printf '%s' "$ATTRS" | grep -Eo 'errors="[0-9]+"' | head -1 | grep -Eo '[0-9]+' || true)"
          SKIPPED="$(printf '%s' "$ATTRS" | grep -Eo '(skipped|disabled)="[0-9]+"' | head -1 | grep -Eo '[0-9]+' || true)"
          TOTAL="${TOTAL:-}"
          FAILURES="${FAILURES:-0}"
          ERRORS="${ERRORS:-0}"
          SKIPPED="${SKIPPED:-0}"
          FAILED=$((FAILURES + ERRORS))
          echo "count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
        else
          echo "count=" >> "$GITHUB_OUTPUT"
          if [[ "${TEST_EXIT_CODE:-1}" -eq 0 ]]; then
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
          echo "skipped=" >> "$GITHUB_OUTPUT"
          echo "report=" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract Node coverage evidence
      id: coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [[ -f coverage/coverage-summary.json ]]; then
          PCT="$(node -e 'const c=require("./coverage/coverage-summary.json"); const p=c?.total?.lines?.pct; if (typeof p === "number") process.stdout.write(String(p));')"
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
        else
          echo "percentage=" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect preinstalled Codecov CLI
      id: codecov-runtime
      if: inputs.upload-coverage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v codecov >/dev/null 2>&1 && codecov --version 2>&1 | grep -q '11.3.1'; then
          echo "binary=$(command -v codecov)" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled Codecov CLI: $(command -v codecov)"
        else
          echo "binary=" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload coverage to Codecov
      if: inputs.upload-coverage == 'true'
      uses: codecov/codecov-action@v5
      with:
        binary: ${{ steps.codecov-runtime.outputs.binary }}
        flags: unittests
        token: ${{ inputs.codecov-token }}
        fail_ci_if_error: false

    - name: Upload test artifacts
      uses: actions/upload-artifact@v6
      continue-on-error: true
      if: always()
      with:
        name: node-test-results
        path: |
          ${{ inputs.working-directory }}/coverage/
          ${{ inputs.working-directory }}/coverage-reports/
          ${{ inputs.working-directory }}/test-results/
          ${{ inputs.working-directory }}/playwright-report/
        retention-days: 7

    - name: Fail on test failure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        STATUS="${{ steps.tests.outputs.exit-code }}"
        if [[ "${STATUS:-1}" -ne 0 ]] || [[ "${{ steps.tests.outputs.passed }}" != "true" ]]; then
          echo "::error::Node tests failed (exit=${STATUS:-unknown})."
          exit 1
        fi
