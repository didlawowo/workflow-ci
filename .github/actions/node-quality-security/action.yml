name: "Node.js Quality & Security"
description: "ESLint linting, package-manager audit, formatting checks"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22"
  package-manager:
    description: "Package manager (npm, pnpm, yarn)"
    required: false
    default: "npm"
  lint-script:
    description: "npm script for linting"
    required: false
    default: "lint"
  format-check-script:
    description: "npm script for format checking (leave empty to skip)"
    required: false
    default: ""
  run-audit:
    description: "Run the selected package manager's dependency audit"
    required: false
    default: "true"
  audit-level:
    description: "Audit severity level (low, moderate, high, critical)"
    required: false
    default: "high"
  working-directory:
    description: "Project directory containing package.json and the lockfile"
    required: false
    default: "."

outputs:
  quality-passed:
    description: "Whether all quality checks passed"
    value: ${{ steps.summary.outputs.passed }}
  security-issues:
    description: "Number of security issues found"
    value: ${{ steps.summary.outputs.security-issues }}
  security-scan-errors:
    description: "Dependency audit execution errors (unreadable report); never counted as security issues"
    value: ${{ steps.summary.outputs.security-scan-errors }}
  linting-status:
    description: "Linting status"
    value: ${{ steps.summary.outputs.linting-status }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js environment
      uses: $/.github/actions/setup-node-env
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}
        working-directory: ${{ inputs.working-directory }}

    - name: Run linting
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        SCRIPT="${{ inputs.lint-script }}"
        if ! node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)' "$SCRIPT"; then
          echo "::notice::No package.json script named '$SCRIPT'; lint gate skipped for this repository."
          echo "status=skipped" >> "$GITHUB_OUTPUT"
        elif ${{ inputs.package-manager }} run "$SCRIPT"; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Check formatting
      id: format
      if: inputs.format-check-script != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ${{ inputs.package-manager }} run ${{ inputs.format-check-script }}; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Run dependency audit
      id: audit
      if: inputs.run-audit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        PM="${{ inputs.package-manager }}"
        LEVEL="${{ inputs.audit-level }}"
        ERR_FILE="$(mktemp)"
        trap 'rm -f "$ERR_FILE"' EXIT
        # A vulnerability is counted only from a readable audit report. An
        # unreadable or inconsistent report is a scanner execution error: it is
        # retried once, then reported as such and still fails the quality gate.
        report_error() {
          echo "status=error" >> "$GITHUB_OUTPUT"
          echo "vuln-count=0" >> "$GITHUB_OUTPUT"
          echo "scan-errors=1" >> "$GITHUB_OUTPUT"
          echo "::error::Dependency audit could not be read: $1. This is a scanner execution error, not a vulnerability finding; the quality gate still fails."
          exit 0
        }
        case "$LEVEL" in
          info|low|moderate|high|critical) ;;
          *) report_error "unsupported audit-level '$LEVEL'" ;;
        esac

        run_audit() {
          case "$PM" in
            npm)
              AUDIT_OUTPUT="$(npm audit --audit-level="$LEVEL" --json 2>"$ERR_FILE")"
              AUDIT_STATUS=$?
              ;;
            pnpm)
              AUDIT_OUTPUT="$(pnpm audit --audit-level="$LEVEL" --json 2>"$ERR_FILE")"
              AUDIT_STATUS=$?
              ;;
            yarn)
              YARN_MAJOR="$(yarn --version | cut -d. -f1)"
              if [ "${YARN_MAJOR:-1}" -ge 2 ]; then
                AUDIT_OUTPUT="$(yarn npm audit --severity "$LEVEL" --json 2>"$ERR_FILE")"
              else
                AUDIT_OUTPUT="$(yarn audit --level "$LEVEL" --json 2>"$ERR_FILE")"
              fi
              AUDIT_STATUS=$?
              ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 2
              ;;
          esac
        }

        # Sets VULN_COUNT on a readable report; otherwise sets UNREADABLE.
        read_audit() {
          VULN_COUNT=""
          UNREADABLE=""
          local parsed
          parsed="$(printf '%s\n' "$AUDIT_OUTPUT" | jq -s --arg level "$LEVEL" '
            def ranks: {info: 0, low: 1, moderate: 2, high: 3, critical: 4};
            if length == 1 and (.[0].metadata?.vulnerabilities?.total // null) != null then
              .[0].metadata.vulnerabilities |
              if (keys | sort) != (["total"] + (ranks | keys) | sort) then
                error("Incomplete audit severity breakdown")
              elif all(.[]; type == "number" and . >= 0 and floor == .) | not then
                error("Invalid audit vulnerability count")
              elif ([to_entries[] | select(.key != "total") | .value] | add) != .total then
                error("Inconsistent audit vulnerability total")
              else
                [to_entries[] | select(.key != "total") |
                  select(ranks[.key] >= ranks[$level]) | .value] | add // 0
              end
            elif length == 1 and (.[0].data?.vulnerabilities // null) != null then
              .[0].data.vulnerabilities
            elif any(.[]; .type? == "auditAdvisory" or .type? == "auditSummary") then
              [ .[] | select(.type? == "auditAdvisory") ] | length
            else
              error("Unrecognized audit response")
            end
          ' 2>&1)"
          local jq_status=$?
          if [ "$jq_status" -ne 0 ] || ! [[ "$parsed" =~ ^[0-9]+$ ]]; then
            UNREADABLE="exit=$AUDIT_STATUS, $(printf '%s' "$parsed" | tail -n 1 | cut -c1-200)"
          elif [ "$AUDIT_STATUS" -ne 0 ] && [ "$parsed" -eq 0 ]; then
            # Never convert a failing audit without a readable finding into a clean bill.
            UNREADABLE="exit=$AUDIT_STATUS with no finding in a readable report"
          else
            VULN_COUNT="$parsed"
          fi
        }

        run_audit
        read_audit
        if [ -n "$UNREADABLE" ]; then
          echo "::warning::Dependency audit output unreadable ($UNREADABLE); retrying once."
          tail -n 20 "$ERR_FILE"
          run_audit
          read_audit
        fi
        if [ -n "$UNREADABLE" ]; then
          tail -n 20 "$ERR_FILE"
          report_error "$UNREADABLE after 2 attempts"
        fi
        set -e

        if [ "$VULN_COUNT" -gt 0 ]; then
          echo "status=findings" >> "$GITHUB_OUTPUT"
        else
          echo "status=passed" >> "$GITHUB_OUTPUT"
        fi
        echo "vuln-count=$VULN_COUNT" >> "$GITHUB_OUTPUT"
        echo "scan-errors=0" >> "$GITHUB_OUTPUT"

        case "$PM" in
          npm) npm audit --audit-level="$LEVEL" || true ;;
          pnpm) pnpm audit --audit-level="$LEVEL" || true ;;
          yarn)
            if [ "${YARN_MAJOR:-1}" -ge 2 ]; then
              yarn npm audit --severity "$LEVEL" || true
            else
              yarn audit --level "$LEVEL" || true
            fi
            ;;
        esac
      continue-on-error: true

    - name: Analyze results
      id: summary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        QUALITY_PASSED=true
        LINTING_STATUS="passed"
        SECURITY_ISSUES="${{ steps.audit.outputs.vuln-count || '0' }}"
        SECURITY_SCAN_ERRORS=0
        if [ "${{ inputs.run-audit }}" = "true" ]; then
          case "${{ steps.audit.outputs.status }}" in
            passed|findings) ;;
            *)
              # Unreadable audit or crashed audit step: a scanner execution
              # error, never a finding and never a pass.
              QUALITY_PASSED=false
              SECURITY_SCAN_ERRORS=1
              ;;
          esac
        fi

        if [ "${{ steps.lint.outputs.status }}" = "failed" ]; then
          QUALITY_PASSED=false
          LINTING_STATUS="failed"
        fi
        if [ "${{ steps.format.outputs.status }}" = "failed" ]; then
          QUALITY_PASSED=false
        fi

        {
          echo "passed=${QUALITY_PASSED}"
          echo "security-issues=${SECURITY_ISSUES}"
          echo "security-scan-errors=${SECURITY_SCAN_ERRORS}"
          echo "linting-status=${LINTING_STATUS}"
        } >> "$GITHUB_OUTPUT"
