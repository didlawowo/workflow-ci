name: "Node.js Quality & Security"
description: "ESLint linting, package-manager audit, formatting checks"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22"
  package-manager:
    description: "Package manager (npm, pnpm, yarn)"
    required: false
    default: "npm"
  lint-script:
    description: "npm script for linting"
    required: false
    default: "lint"
  format-check-script:
    description: "npm script for format checking (leave empty to skip)"
    required: false
    default: ""
  run-audit:
    description: "Run the selected package manager's dependency audit"
    required: false
    default: "true"
  audit-level:
    description: "Audit severity level (low, moderate, high, critical)"
    required: false
    default: "high"
  working-directory:
    description: "Project directory containing package.json and the lockfile"
    required: false
    default: "."

outputs:
  quality-passed:
    description: "Whether all quality checks passed"
    value: ${{ steps.summary.outputs.passed }}
  security-issues:
    description: "Number of security issues found"
    value: ${{ steps.summary.outputs.security-issues }}
  linting-status:
    description: "Linting status"
    value: ${{ steps.summary.outputs.linting-status }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js environment
      uses: $/.github/actions/setup-node-env
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}
        working-directory: ${{ inputs.working-directory }}

    - name: Run linting
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        SCRIPT="${{ inputs.lint-script }}"
        if ! node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)' "$SCRIPT"; then
          echo "::notice::No package.json script named '$SCRIPT'; lint gate skipped for this repository."
          echo "status=skipped" >> "$GITHUB_OUTPUT"
        elif ${{ inputs.package-manager }} run "$SCRIPT"; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Check formatting
      id: format
      if: inputs.format-check-script != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ${{ inputs.package-manager }} run ${{ inputs.format-check-script }}; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Run dependency audit
      id: audit
      if: inputs.run-audit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        PM="${{ inputs.package-manager }}"
        LEVEL="${{ inputs.audit-level }}"
        case "$PM" in
          npm)
            AUDIT_OUTPUT="$(npm audit --audit-level="$LEVEL" --json 2>/dev/null)"
            AUDIT_STATUS=$?
            ;;
          pnpm)
            AUDIT_OUTPUT="$(pnpm audit --audit-level="$LEVEL" --json 2>/dev/null)"
            AUDIT_STATUS=$?
            ;;
          yarn)
            YARN_MAJOR="$(yarn --version | cut -d. -f1)"
            if [ "${YARN_MAJOR:-1}" -ge 2 ]; then
              AUDIT_OUTPUT="$(yarn npm audit --severity "$LEVEL" --json 2>/dev/null)"
            else
              AUDIT_OUTPUT="$(yarn audit --level "$LEVEL" --json 2>/dev/null)"
            fi
            AUDIT_STATUS=$?
            ;;
          *)
            echo "::error::Unsupported package manager: $PM"
            exit 2
            ;;
        esac
        set -e

        VULN_COUNT="$(printf '%s\n' "$AUDIT_OUTPUT" | jq -s --arg level "$LEVEL" '
          def ranks: {info: 0, low: 1, moderate: 2, high: 3, critical: 4};
          if (ranks | has($level)) | not then error("Unknown audit severity") else . end |
          if length == 1 and (.[0].metadata?.vulnerabilities?.total // null) != null then
            .[0].metadata.vulnerabilities |
            if (keys | sort) != (["total"] + (ranks | keys) | sort) then
              error("Incomplete audit severity breakdown")
            elif all(.[]; type == "number" and . >= 0 and floor == .) | not then
              error("Invalid audit vulnerability count")
            elif ([to_entries[] | select(.key != "total") | .value] | add) != .total then
              error("Inconsistent audit vulnerability total")
            else
              [to_entries[] | select(.key != "total") |
                select(ranks[.key] >= ranks[$level]) | .value] | add // 0
            end
          elif length == 1 and (.[0].data?.vulnerabilities // null) != null then
            .[0].data.vulnerabilities
          elif any(.[]; .type? == "auditAdvisory" or .type? == "auditSummary") then
            [ .[] | select(.type? == "auditAdvisory") ] | length
          else
            error("Unrecognized audit response")
          end
        ' 2>/dev/null || echo 1)"

        if [ "$AUDIT_STATUS" -ne 0 ] && [ "${VULN_COUNT:-0}" -eq 0 ]; then
          # Never convert an unparseable failing audit into a false clean bill.
          VULN_COUNT=1
        fi
        echo "vuln-count=${VULN_COUNT:-0}" >> "$GITHUB_OUTPUT"

        case "$PM" in
          npm) npm audit --audit-level="$LEVEL" || true ;;
          pnpm) pnpm audit --audit-level="$LEVEL" || true ;;
          yarn)
            if [ "${YARN_MAJOR:-1}" -ge 2 ]; then
              yarn npm audit --severity "$LEVEL" || true
            else
              yarn audit --level "$LEVEL" || true
            fi
            ;;
        esac
      continue-on-error: true

    - name: Analyze results
      id: summary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        QUALITY_PASSED=true
        LINTING_STATUS="passed"
        SECURITY_ISSUES="${{ steps.audit.outputs.vuln-count || '0' }}"

        if [ "${{ steps.lint.outputs.status }}" = "failed" ]; then
          QUALITY_PASSED=false
          LINTING_STATUS="failed"
        fi
        if [ "${{ steps.format.outputs.status }}" = "failed" ]; then
          QUALITY_PASSED=false
        fi

        {
          echo "passed=${QUALITY_PASSED}"
          echo "security-issues=${SECURITY_ISSUES}"
          echo "linting-status=${LINTING_STATUS}"
        } >> "$GITHUB_OUTPUT"
