name: "Docker Build & Push"
description: "Build, scan, and optionally push Docker image with security scanning"

inputs:
  image-name:
    description: "Docker image name (e.g., username/myapp)"
    required: true
  image-tag:
    description: "Docker image tag"
    required: true
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  dockerfile-target:
    description: "Dockerfile target stage (e.g., api, frontend). Leave empty for single-stage."
    required: false
    default: ""
  context:
    description: "Docker build context path"
    required: false
    default: "."
  registry:
    description: "Docker registry"
    required: false
    default: "docker.io"
  registry-username:
    description: "Docker registry username"
    required: false
  registry-password:
    description: "Docker registry password"
    required: false
  registry-plain-http:
    description: |
      Set to 'true' when `registry` is reachable over plain HTTP only — typically
      the in-cluster Service of the OCI registry, e.g.
      registry: oci-storage.oci-storage.svc.cluster.local together with
      image-name: oci-storage.oci-storage.svc.cluster.local/<image>. Pushing to
      the Service directly removes every proxy from the push path (no body
      limit, no buffering, no proxy timeout) and no longer depends on
      Cloudflare, external-dns, LB-IPAM or the ingress (oci-storage#99).
      Effects: credentials are written to ~/.docker/config.json without going
      through the Docker daemon (a `docker login` against an HTTP registry
      fails unless the daemon lists it as insecure), the QEMU/docker-container
      builder gets `[registry."<registry>"] http = true`, Trivy runs with
      TRIVY_INSECURE=true and Cosign with --allow-http-registry.
      With native-multiarch=true the remote buildkitd nodes must carry the same
      `http = true` entry in their buildkitd.toml (already the case for
      buildkitd-amd64/arm64, see continuous-delivery buildkitd-remote.yaml).
      Default 'false' keeps the current behaviour (TLS registry, docker login).
    required: false
    default: "false"
  platforms:
    description: "Target platforms for build"
    required: false
    default: "linux/amd64,linux/arm64"
  push:
    description: "Push image to registry"
    required: false
    default: "false"
  scan:
    description: "Run Trivy security scan"
    required: false
    default: "true"
  upload-sarif:
    description: "Publish validated Trivy SARIF to GitHub Code Scanning (disabled by default)"
    required: false
    default: "false"
  scan-severity:
    description: "Trivy scan severity levels"
    required: false
    default: "CRITICAL,HIGH,MEDIUM"
  sign:
    description: "Sign image with Cosign (keyless)"
    required: false
    default: "false"
  sbom:
    description: "Generate SBOM"
    required: false
    default: "false"
  provenance:
    description: "Generate provenance attestation"
    required: false
    default: "false"
  cache-scope:
    description: "GitHub Actions cache scope"
    required: false
    default: "docker"
  labels:
    description: "Additional OCI labels (multiline)"
    required: false
    default: ""
  add-latest-tag:
    description: "Also tag as latest"
    required: false
    default: "false"
  build-args:
    description: "Docker build arguments (multiline KEY=VALUE)"
    required: false
    default: ""
  qemu-image:
    description: |
      Image used by docker/setup-qemu-action to install binfmt handlers.
      Default points to the didlawowo oci-storage mirror to avoid Docker Hub
      anonymous rate limit on the cluster's egress IP (the upstream is
      tonistiigi/binfmt:latest on Docker Hub). Override to skip the mirror.
    required: false
    default: "oci-storage.dc-tech.work/mirror-binfmt:latest"
  dockerhub-username:
    description: |
      Docker Hub username. When passed together with dockerhub-token, the
      composite logs in to docker.io BEFORE buildx so that base images
      referenced by Dockerfile FROM directives (e.g. python:3.12, oven/bun:1)
      are pulled authenticated. Required to bypass the 100/6h-per-IP
      anonymous rate limit, which is reached fast when many repos share the
      cluster's egress IP.
    required: false
    default: ""
  dockerhub-token:
    description: "Docker Hub PAT (public_repo read scope is enough)."
    required: false
    default: ""
  native-multiarch:
    description: |
      Build each platform on NATIVE hardware via remote BuildKit nodes instead of
      QEMU emulation. When 'true', skips setup-qemu/setup-buildx and creates a buildx
      builder with two remote nodes (amd64 + arm64) — arm64 builds run on native arm64
      hardware (no QEMU). Requires the buildkitd-amd64/buildkitd-arm64 services to be
      reachable (see continuous-delivery: infrastructure-crds/rke2-infra/buildkitd-remote.yaml).
      Default 'false' keeps the QEMU path (rollback-safe).
    required: false
    default: "false"
  buildkit-amd64-endpoint:
    description: "Remote BuildKit endpoint for linux/amd64 (native-multiarch=true)."
    required: false
    default: "tcp://buildkitd-amd64.arc-system.svc.cluster.local:1234"
  buildkit-arm64-endpoint:
    description: "Remote BuildKit endpoint for linux/arm64 (native-multiarch=true)."
    required: false
    default: "tcp://buildkitd-arm64.arc-system.svc.cluster.local:1234"

outputs:
  digest:
    description: "Built image digest"
    value: ${{ steps.build.outputs.digest || steps.build-retry.outputs.digest }}
  image-full-name:
    description: "Full image name with tag"
    value: ${{ steps.meta.outputs.full-name }}
  vulnerabilities-found:
    description: "Number of vulnerabilities found"
    value: ${{ steps.scan-results.outputs.vuln-count }}

runs:
  using: "composite"
  steps:
    # Authenticate to Docker Hub BEFORE buildx so that base images pulled by
    # Dockerfile FROM directives (python:*, oven/bun:*, node:*, etc.) use the
    # account quota instead of the anonymous 100/6h-per-IP limit. The cluster
    # runners share an egress IP, so anonymous quota is exhausted quickly.
    #
    # Best-effort on purpose. This login raises a pull quota, it is not a
    # requirement for the build: everything after it — buildx, the login to the
    # real target registry, build/push, sign, scan — is independent of it.
    # Without continue-on-error a Docker Hub hiccup (throttled auth from the
    # shared egress IP, expired PAT) fails the step, skips every later step by
    # cascade, and takes down image publishing for every repo consuming this
    # action. Degrading to anonymous pulls may hit the rate limit; hard-failing
    # guarantees no image at all. The warning keeps it visible in the summary.
    - name: Login to Docker Hub (authenticated base image pulls)
      if: inputs.dockerhub-username != '' && inputs.dockerhub-token != ''
      uses: docker/login-action@v4
      continue-on-error: true
      id: dockerhub-login
      with:
        registry: docker.io
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Warn when Docker Hub login failed
      if: steps.dockerhub-login.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Docker Hub login failed::Falling back to anonymous pulls for base images. \
        Builds continue but may hit the 100/6h-per-IP anonymous rate limit shared by the cluster runners. \
        Check DOCKERHUB_USERNAME/DOCKERHUB_TOKEN if this persists."

    # setup-qemu-action runs `docker run <image> --install all` to install
    # binfmt handlers. By default that image is tonistiigi/binfmt:latest on
    # Docker Hub, where anonymous pulls are rate-limited per IP. We point it
    # at the oci-storage mirror to avoid even depending on Docker Hub for
    # QEMU setup. Authenticated Docker Hub login (above) is a separate
    # defense covering FROM directives in user Dockerfiles.
    # QEMU + docker-container Buildx: the emulated multi-arch path. Skipped when
    # native-multiarch=true (remote BuildKit nodes handle each arch natively).
    - name: Detect whether QEMU is required
      id: execution-mode
      if: inputs.native-multiarch != 'true'
      shell: bash
      env:
        REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        PUSH_IMAGE: ${{ inputs.push }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) native_platform="linux/amd64" ;;
          aarch64|arm64) native_platform="linux/arm64" ;;
          *) native_platform="" ;;
        esac

        needs_qemu=false
        qemu_preinstalled=true
        if [ "$PUSH_IMAGE" = "true" ]; then
          IFS=',' read -ra targets <<< "$REQUESTED_PLATFORMS"
          for target in "${targets[@]}"; do
            target="$(echo "$target" | xargs)"
            [ -n "$target" ] || continue
            if [ -z "$native_platform" ] || [ "$target" != "$native_platform" ]; then
              needs_qemu=true
              case "$target" in
                linux/arm64) handler="qemu-aarch64" ;;
                linux/amd64) handler="qemu-x86_64" ;;
                linux/arm/*) handler="qemu-arm" ;;
                *) handler="" ;;
              esac
              handler_path="/proc/sys/fs/binfmt_misc/$handler"
              if [ -z "$handler" ] || [ ! -r "$handler_path" ] \
                 || ! grep -qx 'enabled' "$handler_path" \
                 || ! grep -Eq '^flags:.*F' "$handler_path"; then
                qemu_preinstalled=false
              fi
            fi
          done
        fi
        if [ "$needs_qemu" != "true" ]; then
          qemu_preinstalled=false
        fi
        echo "native-platform=$native_platform" >> "$GITHUB_OUTPUT"
        echo "needs-qemu=$needs_qemu" >> "$GITHUB_OUTPUT"
        echo "qemu-preinstalled=$qemu_preinstalled" >> "$GITHUB_OUTPUT"
        if [ "$qemu_preinstalled" = "true" ]; then
          echo "QEMU binfmt handlers already registered on the runner node; setup image pull is unnecessary."
        fi

    - name: Set up QEMU
      if: inputs.native-multiarch != 'true' && steps.execution-mode.outputs.needs-qemu == 'true' && steps.execution-mode.outputs.qemu-preinstalled != 'true'
      uses: docker/setup-qemu-action@v4
      with:
        image: ${{ inputs.qemu-image }}

    # Plain-HTTP registry: BuildKit refuses to push/pull over HTTP unless the
    # host is declared with `http = true`. Written to a file so it can be fed to
    # setup-buildx-action (docker-container driver). The remote nodes used by
    # native-multiarch=true carry the same entry server-side.
    - name: Prepare BuildKit config for plain-HTTP registry
      id: plain-http
      if: inputs.registry-plain-http == 'true'
      shell: bash
      run: |
        CONFIG="${RUNNER_TEMP}/buildkitd-plain-http.toml"
        printf '[registry."%s"]\n  http = true\n' "${{ inputs.registry }}" > "$CONFIG"
        echo "config-file=${CONFIG}" >> "$GITHUB_OUTPUT"
        cat "$CONFIG"

    - name: Set up Docker Buildx
      if: inputs.native-multiarch != 'true'
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=moby/buildkit:buildx-stable-1
        buildkitd-config: ${{ inputs.registry-plain-http == 'true' && steps.plain-http.outputs.config-file || '' }}

    # Native multi-arch: one remote BuildKit node per arch (no QEMU). buildx routes
    # linux/amd64 -> amd64 node, linux/arm64 -> arm64 node (native hardware).
    - name: Set up native multi-arch Buildx (remote BuildKit)
      if: inputs.native-multiarch == 'true'
      shell: bash
      env:
        REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        BUILDKIT_AMD64_ENDPOINT: ${{ inputs.buildkit-amd64-endpoint }}
        BUILDKIT_ARM64_ENDPOINT: ${{ inputs.buildkit-arm64-endpoint }}
      run: |
        set -euo pipefail
        created=false
        IFS=',' read -ra targets <<< "$REQUESTED_PLATFORMS"
        for target in "${targets[@]}"; do
          target="$(echo "$target" | xargs)"
          case "$target" in
            linux/amd64)
              if [ "$created" = "false" ]; then
                docker buildx create --name native --driver remote \
                  --node native-amd64 --platform linux/amd64 "$BUILDKIT_AMD64_ENDPOINT"
                created=true
              else
                docker buildx create --append --name native \
                  --node native-amd64 --platform linux/amd64 "$BUILDKIT_AMD64_ENDPOINT"
              fi
              ;;
            linux/arm64)
              if [ "$created" = "false" ]; then
                docker buildx create --name native --driver remote \
                  --node native-arm64 --platform linux/arm64 "$BUILDKIT_ARM64_ENDPOINT"
                created=true
              else
                docker buildx create --append --name native \
                  --node native-arm64 --platform linux/arm64 "$BUILDKIT_ARM64_ENDPOINT"
              fi
              ;;
            "")
              ;;
            *)
              echo "::error title=Unsupported remote BuildKit platform::native-multiarch supports linux/amd64 and linux/arm64, got '$target'"
              exit 1
              ;;
          esac
        done
        if [ "$created" != "true" ]; then
          echo "::error title=Missing remote BuildKit platform::No supported target found in '$REQUESTED_PLATFORMS'"
          exit 1
        fi
        docker buildx use native
        docker buildx inspect --bootstrap native

    # Log in whenever creds are provided (not only when pushing) so the registry
    # build cache (cache-from/cache-to type=registry) can authenticate on CI
    # builds too. Logging in never pushes anything — push is gated by the build
    # step's `push:` input below.
    - name: Login to Docker Registry
      if: inputs.registry-username != '' && inputs.registry-password != '' && inputs.registry-plain-http != 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    # Plain-HTTP registry: `docker login` validates credentials through the
    # Docker daemon, which insists on TLS unless the host is in its
    # insecure-registries list. Buildx (both drivers), Trivy and Cosign only
    # need the auth entry in ~/.docker/config.json, so write it directly and
    # merge with whatever docker/login-action (Docker Hub) already stored.
    - name: Store registry credentials (plain HTTP, no daemon login)
      if: inputs.registry-username != '' && inputs.registry-password != '' && inputs.registry-plain-http == 'true'
      shell: bash
      env:
        PLAIN_HTTP_REGISTRY: ${{ inputs.registry }}
        PLAIN_HTTP_USERNAME: ${{ inputs.registry-username }}
        PLAIN_HTTP_PASSWORD: ${{ inputs.registry-password }}
      run: |
        set -euo pipefail
        CONFIG_DIR="${DOCKER_CONFIG:-$HOME/.docker}"
        CONFIG="${CONFIG_DIR}/config.json"
        mkdir -p "$CONFIG_DIR"
        [ -s "$CONFIG" ] || echo '{}' > "$CONFIG"
        AUTH="$(printf '%s:%s' "$PLAIN_HTTP_USERNAME" "$PLAIN_HTTP_PASSWORD" | base64 | tr -d '\n')"
        TMP="$(mktemp)"
        jq --arg reg "$PLAIN_HTTP_REGISTRY" --arg auth "$AUTH" '.auths[$reg] = {auth: $auth}' "$CONFIG" > "$TMP"
        mv "$TMP" "$CONFIG"
        chmod 600 "$CONFIG"
        echo "Stored credentials for ${PLAIN_HTTP_REGISTRY} in ${CONFIG} (plain HTTP, daemon login skipped)"

    - name: Prepare image metadata
      id: meta
      shell: bash
      run: |
        FULL_NAME="${{ inputs.image-name }}:${{ inputs.image-tag }}"
        echo "full-name=${FULL_NAME}" >> "$GITHUB_OUTPUT"

        TAGS="${{ inputs.image-name }}:${{ inputs.image-tag }}"
        if [ "${{ inputs.add-latest-tag }}" = "true" ]; then
          TAGS="${TAGS},${{ inputs.image-name }}:latest"
        fi
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

        # Target name for file naming (use tag if no target)
        TARGET="${{ inputs.dockerfile-target }}"
        if [ -z "$TARGET" ]; then
          TARGET="image"
        fi
        echo "target-name=${TARGET}" >> "$GITHUB_OUTPUT"
        echo "sarif-file=trivy-${TARGET}-results.sarif" >> "$GITHUB_OUTPUT"

        # Unique artifact name per image: allows using this action several
        # times in the same run (e.g. main + MCP images) without a 409
        # "artifact with this name already exists" conflict.
        SLUG="$(echo "${{ inputs.image-name }}" | tr '/:' '--')"
        echo "artifact-name=docker-scan-${SLUG}-${TARGET}" >> "$GITHUB_OUTPUT"

    - name: Detect preinstalled Cosign
      id: cosign-runtime
      if: inputs.sign == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v cosign >/dev/null 2>&1 && cosign version 2>&1 | grep -q 'v3.0.6'; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled Cosign: $(command -v cosign)"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Cosign when absent
      if: inputs.sign == 'true' && steps.cosign-runtime.outputs.preinstalled != 'true'
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: "v3.0.6"

    - name: Build and push Docker image
      id: build
      continue-on-error: ${{ inputs.native-multiarch == 'true' }}
      uses: docker/build-push-action@v7
      with:
        # Use the native remote builder when enabled; otherwise the default
        # (docker-container) builder from setup-buildx-action above.
        builder: ${{ inputs.native-multiarch == 'true' && 'native' || '' }}
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.dockerfile-target || '' }}
        platforms: ${{ inputs.push == 'true' && inputs.platforms || '' }}
        push: ${{ inputs.push }}
        load: ${{ inputs.push != 'true' }}
        # Plain-HTTP registry + push + native-multiarch ONLY: `registry.insecure=true`
        # on the image export. With a multi-node (remote) builder the manifest-list
        # merge runs on the CLIENT side (buildx build.go, `insecurePush`), which
        # ignores the daemon's insecure-registries list, and the remote driver
        # rejects any buildkitd config file — so this attribute is the only way to
        # make that merge step use HTTP. Without it: "merging manifest list … dial
        # tcp <svc-ip>:443: no route to host".
        # NOT applied to the docker-container driver: there the buildkitd.toml
        # `http = true` entry (steps.plain-http) already makes the push plain-HTTP.
        # Adding `registry.insecure=true` on top REPLACES that host config inside
        # BuildKit (util/push/push.go → Insecure+PlainHTTP → util/resolver
        # `httpFallback`): https is tried first and only falls back to http on a
        # TLS error, ECONNREFUSED or timeout — never on EHOSTUNREACH, which is what
        # a ClusterIP Service without a 443 port returns. Result: "Head https://
        # <svc>/v2/…: dial tcp <svc-ip>:443: no route to host" (solar-monitoring
        # v0.34.2, 2026-09-02). buildx folds `push: true` into this image output.
        outputs: ${{ inputs.push == 'true' && inputs.registry-plain-http == 'true' && inputs.native-multiarch == 'true' && 'type=image,push=true,registry.insecure=true' || '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        # Registry cache on the in-cluster OCI registry instead of type=gha,
        # which round-trips through GitHub's cache API from self-hosted runners.
        # Stored as a dedicated `buildcache-<scope>` tag on the image repo.
        # cache-to only on push (release builds): that's when write creds are
        # present and when the expensive multi-arch layers are produced; CI
        # builds read from that cache (cache-from is non-fatal on a miss).
        # image-manifest+oci-mediatypes = compatibility with plain OCI registries.
        # ignore-error=true = a cache EXPORT failure must NOT fail the build
        # (otherwise a registry that rejects the cache manifest would break every
        # release). Worst case = no cache, never a red build.
        cache-from: type=registry,ref=${{ inputs.image-name }}:buildcache-${{ inputs.cache-scope }}
        cache-to: ${{ inputs.push == 'true' && format('type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true,ref={0}:buildcache-{1}', inputs.image-name, inputs.cache-scope) || '' }}
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance == 'true' && 'mode=max' || 'false' }}

    - name: Retry native remote BuildKit once
      id: build-retry
      if: inputs.native-multiarch == 'true' && steps.build.outcome == 'failure'
      uses: docker/build-push-action@v7
      with:
        builder: native
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.dockerfile-target || '' }}
        platforms: ${{ inputs.push == 'true' && inputs.platforms || '' }}
        push: ${{ inputs.push }}
        load: ${{ inputs.push != 'true' }}
        outputs: ${{ inputs.push == 'true' && inputs.registry-plain-http == 'true' && 'type=image,push=true,registry.insecure=true' || '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=registry,ref=${{ inputs.image-name }}:buildcache-${{ inputs.cache-scope }}
        cache-to: ${{ inputs.push == 'true' && format('type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true,ref={0}:buildcache-{1}', inputs.image-name, inputs.cache-scope) || '' }}
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance == 'true' && 'mode=max' || 'false' }}

    - name: Enforce native Docker build result
      if: failure() && inputs.native-multiarch == 'true' && steps.build.outcome == 'failure' && steps.build-retry.outcome != 'success'
      shell: bash
      run: |
        echo "::error::Remote BuildKit build failed twice; refusing to hide a persistent build failure."
        exit 1

    - name: Sign image with Cosign
      if: inputs.sign == 'true' && inputs.push == 'true'
      shell: bash
      run: cosign sign --yes ${{ inputs.registry-plain-http == 'true' && '--allow-http-registry' || '' }} "${{ inputs.image-name }}@${{ steps.build.outputs.digest || steps.build-retry.outputs.digest }}"

    - name: Verify signature
      if: inputs.sign == 'true' && inputs.push == 'true'
      shell: bash
      run: |
        cosign verify ${{ inputs.registry-plain-http == 'true' && '--allow-http-registry' || '' }} \
          --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          "${{ inputs.image-name }}@${{ steps.build.outputs.digest || steps.build-retry.outputs.digest }}"

    # Prefer the Trivy binary baked into the ARC runner. GitHub-hosted runners
    # keep the upstream setup-trivy fallback for portability.
    - name: Detect preinstalled Trivy
      id: trivy-runtime
      if: inputs.scan == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v trivy >/dev/null 2>&1 && trivy --version 2>&1 | grep -q 'Version: 0.70.0'; then
          echo "skip-setup=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled Trivy: $(command -v trivy)"
        else
          echo "skip-setup=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve Trivy cache
      id: trivy-cache
      if: inputs.scan == 'true'
      shell: bash
      run: |
        set -euo pipefail
        LOCAL_CACHE="${RUNNER_TEMP:-$GITHUB_WORKSPACE}/trivy-cache"
        rm -rf "$LOCAL_CACHE"
        mkdir -p "$LOCAL_CACHE"

        SHARED_DB="${TRIVY_SHARED_DB_DIR:-}"
        if [[ -n "$SHARED_DB" && -s "$SHARED_DB/db/trivy.db" && -s "$SHARED_DB/db/metadata.json" ]]; then
          ln -s "$SHARED_DB/db" "$LOCAL_CACHE/db"
          echo "shared-db=true" >> "$GITHUB_OUTPUT"
          echo "action-cache=false" >> "$GITHUB_OUTPUT"
          echo "Using read-only shared Trivy vulnerability DB: $SHARED_DB/db"
        else
          echo "shared-db=false" >> "$GITHUB_OUTPUT"
          echo "action-cache=true" >> "$GITHUB_OUTPUT"
          echo "Shared Trivy DB unavailable; using local DB cache"
        fi
        echo "path=$LOCAL_CACHE" >> "$GITHUB_OUTPUT"
    - name: Prepare Trivy report
      if: inputs.scan == 'true'
      shell: bash
      env:
        SARIF_FILE: ${{ steps.meta.outputs.sarif-file }}
      run: |
        set -euo pipefail
        # A failed scan must never reuse a report from an earlier invocation.
        rm -f -- "$SARIF_FILE"

    - name: Run Trivy vulnerability scanner
      id: trivy
      if: inputs.scan == 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        # Plain-HTTP registry (registry-plain-http=true): allow non-TLS pulls.
        TRIVY_INSECURE: ${{ inputs.registry-plain-http == 'true' && 'true' || 'false' }}
        TRIVY_SKIP_VERSION_CHECK: "true"
        TRIVY_CACHE_BACKEND: "memory"
        TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-cache.outputs.shared-db == 'true' && 'true' || 'false' }}
      with:
        version: "v0.70.0"
        skip-setup-trivy: ${{ steps.trivy-runtime.outputs.skip-setup || 'false' }}
        cache: ${{ steps.trivy-cache.outputs.action-cache }}
        cache-dir: ${{ steps.trivy-cache.outputs.path }}
        timeout: "15m"
        scanners: "vuln"
        image-ref: ${{ steps.meta.outputs.full-name }}
        format: "sarif"
        output: ${{ steps.meta.outputs.sarif-file }}
        severity: ${{ inputs.scan-severity }}

    - name: Analyze scan results
      id: scan-results
      if: inputs.scan == 'true'
      shell: bash
      env:
        SARIF_FILE: ${{ steps.meta.outputs.sarif-file }}
      run: |
        set -euo pipefail
        if [ ! -s "$SARIF_FILE" ]; then
          echo "::error title=Missing Trivy report::The scan did not produce a non-empty SARIF report. No vulnerability count can be reported."
          exit 1
        fi
        # Validate the counting contract before interpreting an empty result as
        # zero findings. Full SARIF schema validation remains the uploader's job.
        if ! VULN_COUNT="$(jq -er -s '
          if length != 1 then error("expected one SARIF document") else .[0] end
          | if type != "object" or .version != "2.1.0"
            then error("expected SARIF 2.1.0") else . end
          | if (.runs | type) != "array" or (.runs | length) == 0
            then error("missing SARIF runs") else . end
          | if all(.runs[];
              type == "object"
              and (.tool.driver.name | type) == "string"
              and (.tool.driver.name | length) > 0
              and (.results | type) == "array"
              and all(.results[]; type == "object")
              and (if has("invocations") then
                (.invocations | type) == "array"
                and all(.invocations[]; .executionSuccessful == true)
              else true end))
            then [.runs[].results | length] | add
            else error("incomplete or failed SARIF analysis") end
        ' "$SARIF_FILE")"; then
          echo "::error title=Invalid Trivy report::Cannot validate/count the SARIF results. No vulnerability count can be reported."
          exit 1
        fi
        echo "vuln-count=${VULN_COUNT}" >> "$GITHUB_OUTPUT"

    # Code Scanning publication is best-effort. The Trivy execution and local
    # SARIF validation above remain hard gates; GitHub Code Scanning availability
    # or token permissions must not turn an otherwise valid security scan red.
    # Callers should still grant contents:read, actions:read and
    # security-events:write so publication succeeds whenever GitHub supports it.
    - name: Build Trivy Markdown summary
      id: trivy-summary
      if: inputs.scan == 'true'
      shell: bash
      env:
        SARIF_FILE: ${{ steps.meta.outputs.sarif-file }}
        IMAGE_NAME: ${{ steps.meta.outputs.full-name }}
      run: |
        set -euo pipefail
        SUMMARY_FILE="${RUNNER_TEMP}/trivy-${{ steps.meta.outputs.target-name }}-summary.md"
        TOTAL="${{ steps.scan-results.outputs.vuln-count }}"

        jq -r --arg image "$IMAGE_NAME" --arg total "$TOTAL" '
          def results: [.runs[].results[]?];
          def count_level($level): [results[] | select((.level // "warning") == $level)] | length;
          def icon($level):
            if $level == "error" then "🔴"
            elif $level == "warning" then "🟠"
            elif $level == "note" then "🟡"
            else "⚪" end;
          "<!-- workflow-ci:trivy-report:" + $image + " -->\n" +
          "## 🛡️ Trivy image scan\n\n" +
          "**Image:** `" + $image + "`  \n" +
          "**Findings:** " + $total + "\n\n" +
          "| SARIF level | Count |\n|---|---:|\n" +
          "| 🔴 error | " + (count_level("error")|tostring) + " |\n" +
          "| 🟠 warning | " + (count_level("warning")|tostring) + " |\n" +
          "| 🟡 note | " + (count_level("note")|tostring) + " |\n\n" +
          (if (results|length) == 0 then
             "✅ No Trivy findings in the configured severity scope.\n"
           else
             "### Top findings\n\n| Rule | Level | Finding |\n|---|---|---|\n" +
             ([results[:20][] |
               "| `" + (.ruleId // "unknown") + "` | " +
               icon(.level // "warning") + " " + (.level // "warning") + " | " +
               ((.message.text // "No description") | gsub("[\r\n|]"; " ")) + " |"
             ] | join("\n")) +
             (if (results|length) > 20 then
                "\n\n_Showing 20 of " + ((results|length)|tostring) + " findings. See the SARIF artifact for the full report._\n"
              else "\n" end)
           end)
        ' "$SARIF_FILE" > "$SUMMARY_FILE"

        cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        echo "file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

    - name: Publish Trivy summary on pull request
      id: trivy-pr-comment
      if: inputs.scan == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        TRIVY_SUMMARY_FILE: ${{ steps.trivy-summary.outputs.file }}
        TRIVY_COMMENT_MARKER: '<!-- workflow-ci:trivy-report:${{ steps.meta.outputs.full-name }} -->'
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.TRIVY_SUMMARY_FILE, 'utf8');
          const marker = process.env.TRIVY_COMMENT_MARKER;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100
          });
          const existing = comments.find(comment =>
            comment.user?.type === 'Bot' && comment.body?.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body
            });
          }

    - name: Warn when PR scan comment failed
      if: inputs.scan == 'true' && github.event_name == 'pull_request' && steps.trivy-pr-comment.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Trivy PR comment failed::The scan summary is available in the workflow summary and SARIF artifact, but the PR comment could not be created or updated. Grant pull-requests: write if PR comments are desired."

    - name: Upload Trivy scan results
      id: upload-sarif
      if: inputs.scan == 'true' && inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.meta.outputs.sarif-file }}
        category: trivy-${{ steps.meta.outputs.target-name }}-scan

    - name: Warn when SARIF publication failed
      if: inputs.scan == 'true' && inputs.upload-sarif == 'true' && steps.upload-sarif.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Code Scanning upload failed::Trivy completed and the SARIF report was validated, but GitHub Code Scanning publication failed. The raw SARIF artifact is still archived; check actions:read/security-events:write permissions and repository Code Scanning eligibility."

    # Keep diagnostics after a scanner, validation or Code Scanning failure.
    # This does not neutralize the earlier failure and must not run if no scan
    # was attempted (e.g. the Docker build failed or scanning was disabled).
    - name: Upload scan artifacts
      if: ${{ !cancelled() && inputs.scan == 'true' && (steps.trivy.outcome == 'success' || steps.trivy.outcome == 'failure') }}
      uses: actions/upload-artifact@v6
      continue-on-error: true
      with:
        name: ${{ steps.meta.outputs.artifact-name }}
        path: ${{ steps.meta.outputs.sarif-file }}
        retention-days: 7
        if-no-files-found: error
