name: "Docker Build & Push"
description: "Build, scan, and optionally push Docker image with security scanning"

inputs:
  image-name:
    description: "Docker image name (e.g., username/myapp)"
    required: true
  image-tag:
    description: "Docker image tag"
    required: true
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  dockerfile-target:
    description: "Dockerfile target stage (e.g., api, frontend). Leave empty for single-stage."
    required: false
    default: ""
  context:
    description: "Docker build context path"
    required: false
    default: "."
  registry:
    description: "Docker registry"
    required: false
    default: "docker.io"
  registry-username:
    description: "Docker registry username"
    required: false
  registry-password:
    description: "Docker registry password"
    required: false
  platforms:
    description: "Target platforms for build"
    required: false
    default: "linux/amd64,linux/arm64"
  push:
    description: "Push image to registry"
    required: false
    default: "false"
  scan:
    description: "Run Trivy security scan"
    required: false
    default: "true"
  scan-severity:
    description: "Trivy scan severity levels"
    required: false
    default: "CRITICAL,HIGH,MEDIUM"
  sign:
    description: "Sign image with Cosign (keyless)"
    required: false
    default: "false"
  sbom:
    description: "Generate SBOM"
    required: false
    default: "false"
  provenance:
    description: "Generate provenance attestation"
    required: false
    default: "false"
  cache-scope:
    description: "GitHub Actions cache scope"
    required: false
    default: "docker"
  labels:
    description: "Additional OCI labels (multiline)"
    required: false
    default: ""
  add-latest-tag:
    description: "Also tag as latest"
    required: false
    default: "false"
  build-args:
    description: "Docker build arguments (multiline KEY=VALUE)"
    required: false
    default: ""
  qemu-image:
    description: |
      Image used by docker/setup-qemu-action to install binfmt handlers.
      Default points to the didlawowo oci-storage mirror to avoid Docker Hub
      anonymous rate limit on the cluster's egress IP (the upstream is
      tonistiigi/binfmt:latest on Docker Hub). Override to skip the mirror.
    required: false
    default: "oci-storage.dc-tech.work/mirror-binfmt:latest"
  dockerhub-username:
    description: |
      Docker Hub username. When passed together with dockerhub-token, the
      composite logs in to docker.io BEFORE buildx so that base images
      referenced by Dockerfile FROM directives (e.g. python:3.12, oven/bun:1)
      are pulled authenticated. Required to bypass the 100/6h-per-IP
      anonymous rate limit, which is reached fast when many repos share the
      cluster's egress IP.
    required: false
    default: ""
  dockerhub-token:
    description: "Docker Hub PAT (public_repo read scope is enough)."
    required: false
    default: ""
  native-multiarch:
    description: |
      Build each platform on NATIVE hardware via remote BuildKit nodes instead of
      QEMU emulation. When 'true', skips setup-qemu/setup-buildx and creates a buildx
      builder with two remote nodes (amd64 + arm64) — arm64 builds run on native arm64
      hardware (no QEMU). Requires the buildkitd-amd64/buildkitd-arm64 services to be
      reachable (see continuous-delivery: infrastructure-crds/rke2-infra/buildkitd-remote.yaml).
      Default 'false' keeps the QEMU path (rollback-safe).
    required: false
    default: "false"
  buildkit-amd64-endpoint:
    description: "Remote BuildKit endpoint for linux/amd64 (native-multiarch=true)."
    required: false
    default: "tcp://buildkitd-amd64.arc-system.svc.cluster.local:1234"
  buildkit-arm64-endpoint:
    description: "Remote BuildKit endpoint for linux/arm64 (native-multiarch=true)."
    required: false
    default: "tcp://buildkitd-arm64.arc-system.svc.cluster.local:1234"

outputs:
  digest:
    description: "Built image digest"
    value: ${{ steps.build.outputs.digest }}
  image-full-name:
    description: "Full image name with tag"
    value: ${{ steps.meta.outputs.full-name }}
  vulnerabilities-found:
    description: "Number of vulnerabilities found"
    value: ${{ steps.scan-results.outputs.vuln-count }}

runs:
  using: "composite"
  steps:
    # Authenticate to Docker Hub BEFORE buildx so that base images pulled by
    # Dockerfile FROM directives (python:*, oven/bun:*, node:*, etc.) use the
    # account quota instead of the anonymous 100/6h-per-IP limit. The cluster
    # runners share an egress IP, so anonymous quota is exhausted quickly.
    #
    # Best-effort on purpose. This login raises a pull quota, it is not a
    # requirement for the build: everything after it — buildx, the login to the
    # real target registry, build/push, sign, scan — is independent of it.
    # Without continue-on-error a Docker Hub hiccup (throttled auth from the
    # shared egress IP, expired PAT) fails the step, skips every later step by
    # cascade, and takes down image publishing for every repo consuming this
    # action. Degrading to anonymous pulls may hit the rate limit; hard-failing
    # guarantees no image at all. The warning keeps it visible in the summary.
    - name: Login to Docker Hub (authenticated base image pulls)
      if: inputs.dockerhub-username != '' && inputs.dockerhub-token != ''
      uses: docker/login-action@v3
      continue-on-error: true
      id: dockerhub-login
      with:
        registry: docker.io
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Warn when Docker Hub login failed
      if: steps.dockerhub-login.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Docker Hub login failed::Falling back to anonymous pulls for base images. \
        Builds continue but may hit the 100/6h-per-IP anonymous rate limit shared by the cluster runners. \
        Check DOCKERHUB_USERNAME/DOCKERHUB_TOKEN if this persists."

    # setup-qemu-action runs `docker run <image> --install all` to install
    # binfmt handlers. By default that image is tonistiigi/binfmt:latest on
    # Docker Hub, where anonymous pulls are rate-limited per IP. We point it
    # at the oci-storage mirror to avoid even depending on Docker Hub for
    # QEMU setup. Authenticated Docker Hub login (above) is a separate
    # defense covering FROM directives in user Dockerfiles.
    # QEMU + docker-container Buildx: the emulated multi-arch path. Skipped when
    # native-multiarch=true (remote BuildKit nodes handle each arch natively).
    - name: Set up QEMU
      if: inputs.native-multiarch != 'true'
      uses: docker/setup-qemu-action@v3
      with:
        image: ${{ inputs.qemu-image }}

    - name: Set up Docker Buildx
      if: inputs.native-multiarch != 'true'
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=moby/buildkit:buildx-stable-1

    # Native multi-arch: one remote BuildKit node per arch (no QEMU). buildx routes
    # linux/amd64 -> amd64 node, linux/arm64 -> arm64 node (native hardware).
    - name: Set up native multi-arch Buildx (remote BuildKit)
      if: inputs.native-multiarch == 'true'
      shell: bash
      run: |
        docker buildx create --name native --driver remote \
          --node native-amd64 --platform linux/amd64 "${{ inputs.buildkit-amd64-endpoint }}"
        docker buildx create --append --name native \
          --node native-arm64 --platform linux/arm64 "${{ inputs.buildkit-arm64-endpoint }}"
        docker buildx use native
        docker buildx inspect --bootstrap native

    # Log in whenever creds are provided (not only when pushing) so the registry
    # build cache (cache-from/cache-to type=registry) can authenticate on CI
    # builds too. Logging in never pushes anything — push is gated by the build
    # step's `push:` input below.
    - name: Login to Docker Registry
      if: inputs.registry-username != '' && inputs.registry-password != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Prepare image metadata
      id: meta
      shell: bash
      run: |
        FULL_NAME="${{ inputs.image-name }}:${{ inputs.image-tag }}"
        echo "full-name=${FULL_NAME}" >> "$GITHUB_OUTPUT"

        TAGS="${{ inputs.image-name }}:${{ inputs.image-tag }}"
        if [ "${{ inputs.add-latest-tag }}" = "true" ]; then
          TAGS="${TAGS},${{ inputs.image-name }}:latest"
        fi
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

        # Target name for file naming (use tag if no target)
        TARGET="${{ inputs.dockerfile-target }}"
        if [ -z "$TARGET" ]; then
          TARGET="image"
        fi
        echo "target-name=${TARGET}" >> "$GITHUB_OUTPUT"
        echo "sarif-file=trivy-${TARGET}-results.sarif" >> "$GITHUB_OUTPUT"

        # Unique artifact name per image: allows using this action several
        # times in the same run (e.g. main + MCP images) without a 409
        # "artifact with this name already exists" conflict.
        SLUG="$(echo "${{ inputs.image-name }}" | tr '/:' '--')"
        echo "artifact-name=docker-scan-${SLUG}-${TARGET}" >> "$GITHUB_OUTPUT"

    - name: Install Cosign
      if: inputs.sign == 'true'
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: "v2.2.4"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        # Use the native remote builder when enabled; otherwise the default
        # (docker-container) builder from setup-buildx-action above.
        builder: ${{ inputs.native-multiarch == 'true' && 'native' || '' }}
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.dockerfile-target || '' }}
        platforms: ${{ inputs.push == 'true' && inputs.platforms || '' }}
        push: ${{ inputs.push }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        # Registry cache on the in-cluster OCI registry instead of type=gha,
        # which round-trips through GitHub's cache API from self-hosted runners.
        # Stored as a dedicated `buildcache-<scope>` tag on the image repo.
        # cache-to only on push (release builds): that's when write creds are
        # present and when the expensive multi-arch layers are produced; CI
        # builds read from that cache (cache-from is non-fatal on a miss).
        # image-manifest+oci-mediatypes = compatibility with plain OCI registries.
        # ignore-error=true = a cache EXPORT failure must NOT fail the build
        # (otherwise a registry that rejects the cache manifest would break every
        # release). Worst case = no cache, never a red build.
        cache-from: type=registry,ref=${{ inputs.image-name }}:buildcache-${{ inputs.cache-scope }}
        cache-to: ${{ inputs.push == 'true' && format('type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true,ref={0}:buildcache-{1}', inputs.image-name, inputs.cache-scope) || '' }}
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance == 'true' && 'mode=max' || 'false' }}

    - name: Sign image with Cosign
      if: inputs.sign == 'true' && inputs.push == 'true'
      shell: bash
      run: cosign sign --yes "${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

    - name: Verify signature
      if: inputs.sign == 'true' && inputs.push == 'true'
      shell: bash
      run: |
        cosign verify \
          --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          "${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

    # Cache Trivy's vuln DB across runs. Without this every scan re-pulls the DB
    # from ghcr.io/aquasecurity/trivy-db — slow and rate-limited on the cluster's
    # shared egress IP. Keyed by day; Trivy only refreshes the DB when it's stale.
    - name: Trivy DB cache key (date)
      id: trivy-cache-key
      if: inputs.scan == 'true'
      shell: bash
      run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Cache Trivy vulnerability DB
      if: inputs.scan == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.trivy-cache
        key: trivy-db-${{ steps.trivy-cache-key.outputs.date }}
        restore-keys: |
          trivy-db-

    - name: Run Trivy vulnerability scanner
      if: inputs.scan == 'true'
      uses: aquasecurity/trivy-action@master
      env:
        TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
      with:
        image-ref: ${{ steps.meta.outputs.full-name }}
        format: "sarif"
        output: ${{ steps.meta.outputs.sarif-file }}
        severity: ${{ inputs.scan-severity }}

    - name: Upload Trivy scan results
      if: inputs.scan == 'true'
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: ${{ steps.meta.outputs.sarif-file }}
        category: trivy-${{ steps.meta.outputs.target-name }}-scan

    - name: Analyze scan results
      id: scan-results
      if: inputs.scan == 'true'
      shell: bash
      run: |
        SARIF_FILE="${{ steps.meta.outputs.sarif-file }}"
        if [ -f "$SARIF_FILE" ]; then
          VULN_COUNT=$(jq '.runs[0].results | length' "$SARIF_FILE" 2>/dev/null || echo 0)
          echo "vuln-count=${VULN_COUNT}" >> "$GITHUB_OUTPUT"
        else
          echo "vuln-count=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload scan artifacts
      if: inputs.scan == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.meta.outputs.artifact-name }}
        path: ${{ steps.meta.outputs.sarif-file }}
        retention-days: 7