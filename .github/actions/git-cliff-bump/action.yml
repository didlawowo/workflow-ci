name: git-cliff-bump
description: >
  Compute the next semantic version from conventional commits and write the
  CHANGELOG. Exposes the bumped version and a "released" flag (false when
  no releasable commits since the last tag).

inputs:
  config:
    description: Path to cliff.toml. Falls back to bundled defaults if empty.
    required: false
    default: ""
  tag-prefix:
    description: Tag prefix (e.g. "v", "", "chart-v").
    required: false
    default: "v"

outputs:
  version:
    description: Bumped version including the prefix (e.g. v1.4.0). Empty if nothing to release.
    value: ${{ steps.decide.outputs.version }}
  released:
    description: '"true" if a release should be cut, "false" otherwise.'
    value: ${{ steps.decide.outputs.released }}

runs:
  using: composite
  steps:
    - name: Keep workflow-ci checkout out of caller release commits
      shell: bash
      run: |
        set -euo pipefail
        # release.yml checks this repository out inside the caller workspace as
        # .workflow-ci so the composite action can be referenced locally. Without
        # an ignore rule, the later `git add -A` can stage that nested checkout as
        # a gitlink (mode 160000), leaving a broken pseudo-submodule behind.
        #
        # Scope the rule to that exact release-workflow layout so invoking this
        # action directly from workflow-ci itself does not hide unrelated paths.
        case "$GITHUB_ACTION_PATH" in
          "$GITHUB_WORKSPACE/.workflow-ci/"*)
            GIT_DIR="$(git rev-parse --git-dir)"
            mkdir -p "$GIT_DIR/info"
            touch "$GIT_DIR/info/exclude"
            grep -qxF '/.workflow-ci/' "$GIT_DIR/info/exclude" || \
              printf '%s\n' '/.workflow-ci/' >> "$GIT_DIR/info/exclude"
            ;;
        esac

    - name: Resolve cliff config
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.config }}" ] && [ -f "${{ inputs.config }}" ]; then
          echo "path=${{ inputs.config }}" >> "$GITHUB_OUTPUT"
          echo "bundled=false" >> "$GITHUB_OUTPUT"
        else
          # Pull the bundled default from the workflow-ci repo where this action lives.
          # GITHUB_ACTION_PATH points to the checked-out action directory.
          echo "path=${GITHUB_ACTION_PATH}/../../../templates/common/cliff.toml" >> "$GITHUB_OUTPUT"
          echo "bundled=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure bounded git-cliff download retries
      id: download-config
      shell: bash
      run: |
        set -euo pipefail
        curl_home="$(mktemp -d "$RUNNER_TEMP/git-cliff-curl.XXXXXX")"
        # Scope curl defaults to the upstream action only. Retry HTTP reads,
        # never the version/changelog/release steps themselves.
        printf '%s\n' \
          'retry = 3' \
          'retry-delay = 2' \
          'retry-max-time = 120' \
          'connect-timeout = 15' \
          'max-time = 60' > "$curl_home/.curlrc"
        printf 'curl-home=%s\n' "$curl_home" >> "$GITHUB_OUTPUT"

    - name: Detect releasable conventional commits
      id: release-scope
      shell: bash
      run: |
        set -euo pipefail

        # A caller-provided cliff config may intentionally define a different
        # release policy. In that case, leave the decision entirely to git-cliff.
        if [ "${{ steps.cfg.outputs.bundled }}" != "true" ]; then
          echo "releasable=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Custom cliff config: deferring release policy to git-cliff."
          exit 0
        fi

        last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        if [ -n "$last" ]; then
          range="$last..HEAD"
        else
          range="HEAD"
        fi

        git log --format='%B%x1e' "$range" > /tmp/release-commit-messages.txt
        releasable="$(
          python3 "${GITHUB_ACTION_PATH}/../../scripts/release_commit_gate.py"             < /tmp/release-commit-messages.txt
        )"
        echo "releasable=$releasable" >> "$GITHUB_OUTPUT"

        if [ "$releasable" = "true" ]; then
          echo "::notice::At least one commit since ${last:-repository start} is releasable."
        else
          echo "::notice::Only non-releasing commits since ${last:-repository start}; skip semantic release."
        fi

    - name: Compute next version
      if: steps.release-scope.outputs.releasable == 'true'
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ steps.cfg.outputs.path }}
        args: --bumped-version
      env:
        CURL_HOME: ${{ steps.download-config.outputs.curl-home }}
        OUTPUT: /tmp/next-version.txt

    - name: Decide if release is needed
      id: decide
      shell: bash
      run: |
        set -euo pipefail
        if [ -f /tmp/next-version.txt ]; then
          NEXT="$(tr -d '[:space:]' < /tmp/next-version.txt)"
        else
          NEXT=""
        fi
        LAST="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
        echo "next=$NEXT last=$LAST"
        if [ -z "$NEXT" ] || [ "$NEXT" = "$LAST" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
        else
          # Normalise tag prefix
          PREFIX="${{ inputs.tag-prefix }}"
          VERSION="${NEXT#v}"
          [ -n "$PREFIX" ] && VERSION="${PREFIX}${VERSION}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect existing CHANGELOG
      if: steps.decide.outputs.released == 'true'
      id: changelog
      shell: bash
      run: |
        if [ -f CHANGELOG.md ]; then
          echo "mode=prepend" >> "$GITHUB_OUTPUT"
        else
          echo "mode=create" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepend new section to existing CHANGELOG
      if: steps.decide.outputs.released == 'true' && steps.changelog.outputs.mode == 'prepend'
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ steps.cfg.outputs.path }}
        args: --tag ${{ steps.decide.outputs.version }} --unreleased --prepend CHANGELOG.md
      env:
        CURL_HOME: ${{ steps.download-config.outputs.curl-home }}

    - name: Create CHANGELOG from full history (first run)
      if: steps.decide.outputs.released == 'true' && steps.changelog.outputs.mode == 'create'
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ steps.cfg.outputs.path }}
        args: --tag ${{ steps.decide.outputs.version }} --output CHANGELOG.md
      env:
        CURL_HOME: ${{ steps.download-config.outputs.curl-home }}

    - name: Extract release notes
      if: steps.decide.outputs.released == 'true'
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ steps.cfg.outputs.path }}
        args: --tag ${{ steps.decide.outputs.version }} --unreleased --strip header
      env:
        CURL_HOME: ${{ steps.download-config.outputs.curl-home }}
        OUTPUT: /tmp/release-notes.md
