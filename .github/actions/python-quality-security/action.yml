name: "Python Quality & Security"
description: "Ruff linting, Bandit security, TruffleHog secrets, Safety deps"

inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.12"
  run-bandit:
    description: "Run Bandit security scan"
    required: false
    default: "true"
  run-mypy:
    description: "Run MyPy type checking"
    required: false
    default: "false"
  run-trufflehog:
    description: "Run TruffleHog secret detection"
    required: false
    default: "true"
  bandit-skip-rules:
    description: "Bandit rules to skip (comma-separated)"
    required: false
    default: "B104,B311"
  bandit-paths:
    description: "Paths for Bandit to scan"
    required: false
    default: "src/"
  working-directory:
    description: "Project directory containing pyproject.toml"
    required: false
    default: "."

outputs:
  quality-passed:
    description: "Whether all quality checks passed"
    value: ${{ steps.summary.outputs.passed }}
  security-issues:
    description: "Number of security issues found"
    value: ${{ steps.summary.outputs.security-issues }}
  security-scan-errors:
    description: "Scanner execution errors; not secret findings"
    value: ${{ steps.summary.outputs.security-scan-errors }}
  linting-status:
    description: "Linting status"
    value: ${{ steps.summary.outputs.linting-status }}

runs:
  using: "composite"
  steps:
    - name: Setup Python environment
      uses: $/.github/actions/setup-python-env
      with:
        python-version: ${{ inputs.python-version }}
        install-dev: "true"
        working-directory: ${{ inputs.working-directory }}

    - name: Run Ruff linting
      id: ruff-lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if uvx --from ruff==0.16.8 ruff check . --output-format=github; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Check code formatting
      id: ruff-format
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if uvx --from ruff==0.16.8 ruff format --check .; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Run MyPy
      id: mypy
      if: inputs.run-mypy == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if uv run mypy . --junit-xml=mypy-report.xml; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Run Bandit
      id: bandit
      if: inputs.run-bandit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        uvx --from bandit==1.9.4 bandit -r ${{ inputs.bandit-paths }} -ll -f json -o bandit-report.json --skip ${{ inputs.bandit-skip-rules }}
        STATUS=$?
        uvx --from bandit==1.9.4 bandit -r ${{ inputs.bandit-paths }} -ll --skip ${{ inputs.bandit-skip-rules }} || true
        set -e
        echo "status=$([[ "$STATUS" -eq 0 ]] && echo passed || echo failed)" >> "$GITHUB_OUTPUT"
      continue-on-error: true

    - name: TruffleHog secret detection
      id: trufflehog
      if: inputs.run-trufflehog == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/trufflehog.sh"
      continue-on-error: true

    - name: Safety dependency check
      id: safety
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if uvx --from safety==3.8.1 safety check --output json > safety-report.json; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi
      continue-on-error: true

    - name: Analyze results
      id: summary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SECURITY_ISSUES=0
        SECURITY_SCAN_ERRORS=0
        QUALITY_PASSED=true
        LINTING_STATUS="passed"

        if [ "${{ steps.ruff-lint.outputs.status }}" != "passed" ]; then
          QUALITY_PASSED=false
          LINTING_STATUS="failed"
        fi
        if [ "${{ steps.ruff-format.outputs.status }}" != "passed" ]; then
          QUALITY_PASSED=false
        fi
        if [ -f bandit-report.json ]; then
          BANDIT_ISSUES=$(jq '.results | length' bandit-report.json 2>/dev/null || echo 0)
          SECURITY_ISSUES=$((SECURITY_ISSUES + BANDIT_ISSUES))
        fi

        if [ "${{ inputs.run-bandit }}" = "true" ] && [ "${{ steps.bandit.outputs.status }}" = "failed" ] && [ "${BANDIT_ISSUES:-0}" -eq 0 ]; then
          QUALITY_PASSED=false
        fi
        if [ "${{ inputs.run-mypy }}" = "true" ] && [ "${{ steps.mypy.outputs.status }}" != "passed" ]; then
          QUALITY_PASSED=false
        fi
        if [ "${{ inputs.run-trufflehog }}" = "true" ]; then
          SECRET_FINDINGS="${{ steps.trufflehog.outputs.findings }}"
          if [[ "$SECRET_FINDINGS" =~ ^[0-9]+$ ]]; then
            SECURITY_ISSUES=$((SECURITY_ISSUES + SECRET_FINDINGS))
          fi
          case "${{ steps.trufflehog.outputs.status }}" in
            success)
              if [[ "${{ steps.trufflehog.outcome }}" != success || "$SECRET_FINDINGS" != 0 ]]; then
                QUALITY_PASSED=false
                SECURITY_SCAN_ERRORS=$((SECURITY_SCAN_ERRORS + 1))
              fi
              ;;
            findings)
              QUALITY_PASSED=false
              if [[ ! "$SECRET_FINDINGS" =~ ^[0-9]+$ || "$SECRET_FINDINGS" == 0 ]]; then
                SECURITY_SCAN_ERRORS=$((SECURITY_SCAN_ERRORS + 1))
              fi
              ;;
            *)
              QUALITY_PASSED=false
              SECURITY_SCAN_ERRORS=$((SECURITY_SCAN_ERRORS + 1))
              ;;
          esac
        fi
        if [ "${{ steps.safety.outputs.status }}" != "passed" ]; then
          SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
        fi

        {
          echo "passed=${QUALITY_PASSED}"
          echo "security-issues=${SECURITY_ISSUES}"
          echo "security-scan-errors=${SECURITY_SCAN_ERRORS}"
          echo "linting-status=${LINTING_STATUS}"
        } >> "$GITHUB_OUTPUT"

    - name: Upload reports
      uses: actions/upload-artifact@v6
      continue-on-error: true
      if: always()
      with:
        name: python-quality-reports
        path: |
          ${{ inputs.working-directory }}/mypy-report.xml
          ${{ inputs.working-directory }}/bandit-report.json
          ${{ inputs.working-directory }}/safety-report.json
        retention-days: 7
