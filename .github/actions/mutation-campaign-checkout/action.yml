name: Mutation campaign checkouts
description: Exact and separate central, protected-base and candidate checkouts
inputs:
  workflow-repository:
    required: true
    description: Called central workflow repository
  workflow-sha:
    required: true
    description: Exact called central workflow commit
runs:
  using: composite
  steps:
    - name: Fetch central implementation
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.workflow-repository }}
        ref: ${{ inputs.workflow-sha }}
        path: .workflow-ci
        persist-credentials: false
    - name: Verify central identity before executing its helpers
      shell: bash
      env:
        WORKFLOW_SHA: ${{ inputs.workflow-sha }}
      run: |
        set -euo pipefail
        test "$(git -C .workflow-ci rev-parse HEAD)" = "$WORKFLOW_SHA"
    - name: Checkout protected base without submodule traversal
      shell: bash
      env:
        CHECKOUT_REPOSITORY: ${{ github.repository }}
        CHECKOUT_REF: ${{ github.event.pull_request.base.sha }}
        CHECKOUT_TOKEN: ${{ github.token }}
        CHECKOUT_BASE_REF: ""
        CHECKOUT_HEAD_REF: ""
      run: |
        set -euo pipefail
        HELPER="$GITHUB_WORKSPACE/.workflow-ci/.github/actions/checkout-source/checkout.sh"
        GITHUB_WORKSPACE="$GITHUB_WORKSPACE/.policy" bash "$HELPER"
    - name: Checkout candidate without submodule traversal
      shell: bash
      env:
        CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
        CHECKOUT_TOKEN: ${{ github.token }}
        CHECKOUT_BASE_REF: ""
        CHECKOUT_HEAD_REF: ""
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        HELPER="$GITHUB_WORKSPACE/.workflow-ci/.github/actions/checkout-source/checkout.sh"
        GITHUB_WORKSPACE="$GITHUB_WORKSPACE/pr" bash "$HELPER"
        git -C pr fetch --no-tags "$GITHUB_WORKSPACE/.policy" "$BASE_SHA"
