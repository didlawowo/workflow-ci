name: Trusted quality evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  evidence:
    uses: didlawowo/workflow-ci/.github/workflows/quality-evidence.yml@main
    with:
      repo-type: python
