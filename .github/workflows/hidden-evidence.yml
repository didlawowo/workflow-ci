name: Hidden functional evidence

on:
  workflow_call:
    inputs:
      evaluator:
        description: "Registered evaluator id, for example ioniq-control/calibration"
        required: true
        type: string
      runner:
        description: "Exact trusted runner label"
        required: true
        type: string
    outputs:
      required:
        description: "Whether changed paths required this evaluator"
        value: ${{ jobs.hidden-evidence.outputs.required }}
      status:
        description: "pass, fail, error or skipped"
        value: ${{ jobs.hidden-evidence.outputs.status }}
      seed-id:
        description: "Opaque id for the randomized evaluator world"
        value: ${{ jobs.hidden-evidence.outputs.seed-id }}
      report-b64:
        description: "Compact trusted report, base64 encoded"
        value: ${{ jobs.hidden-evidence.outputs.report-b64 }}

concurrency:
  group: hidden-evidence-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.evaluator }}
  cancel-in-progress: true

jobs:
  hidden-evidence:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
      status: ${{ steps.collect.outputs.status }}
      seed-id: ${{ steps.collect.outputs.seed-id }}
      report-b64: ${{ steps.collect.outputs.report-b64 }}
    steps:
      - name: Require pull request context
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request" || {
            echo '::error::Hidden evaluators currently require pull_request context.'
            exit 1
          }
          test -n "${{ github.event.pull_request.base.sha }}"
          test -n "${{ github.event.pull_request.head.sha }}"

      - name: Checkout trusted workflow-ci evaluator
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflow-ci-hidden
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact protected base
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate revision
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted, base and candidate identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .workflow-ci-hidden rev-parse HEAD)" = "$(git -C .workflow-ci-hidden rev-parse '${{ job.workflow_sha }}^{commit}')"
          test "$(git -C base rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git -C candidate rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Resolve central evaluator scope
        id: scope
        shell: bash
        env:
          EVALUATOR: ${{ inputs.evaluator }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED="${RUNNER_TEMP:-/tmp}/hidden-changed-${GITHUB_RUN_ID}.txt"
          SCOPE="${RUNNER_TEMP:-/tmp}/hidden-scope-${GITHUB_RUN_ID}.json"
          python3 - "$CHANGED" <<'PY'
          import subprocess
          import sys

          def tracked(root: str) -> dict[str, tuple[str, str]]:
              raw = subprocess.check_output(
                  ["git", "-C", root, "ls-files", "-s", "-z"],
                  text=False,
              )
              result: dict[str, tuple[str, str]] = {}
              for entry in raw.decode("utf-8", errors="surrogateescape").split("\0"):
                  if not entry:
                      continue
                  metadata, path = entry.split("\t", 1)
                  mode, blob, stage = metadata.split()
                  if stage == "0":
                      result[path] = (mode, blob)
              return result

          base = tracked("base")
          candidate = tracked("candidate")
          changed = sorted(
              path
              for path in set(base) | set(candidate)
              if base.get(path) != candidate.get(path)
          )
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              for path in changed:
                  handle.write(path + "\n")
          PY
          python3 .workflow-ci-hidden/hidden-evaluators/run.py scope \
            --evaluator "$EVALUATOR" \
            --repository "$REPOSITORY" \
            --changed-files "$CHANGED" > "$SCOPE"
          cat "$SCOPE"
          python3 - "$SCOPE" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          print('required=' + ('true' if value.get('required') else 'false'))
          print('matched-count=' + str(len(value.get('matched') or [])))
          PY

      - name: Run central hidden evaluator
        id: execute
        if: steps.scope.outputs.required == 'true'
        continue-on-error: true
        shell: bash
        env:
          EVALUATOR: ${{ inputs.evaluator }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP:-/tmp}/hidden-evidence"
          mkdir -p "$OUT"
          python3 .workflow-ci-hidden/hidden-evaluators/run.py run \
            --evaluator "$EVALUATOR" \
            --repository "$REPOSITORY" \
            --candidate candidate \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --report "$OUT/report.json" \
            --replay "$OUT/replay.json"

      - name: Collect trusted hidden result
        id: collect
        if: always()
        shell: bash
        env:
          REQUIRED: ${{ steps.scope.outputs.required }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP:-/tmp}/hidden-evidence"
          REPORT="$OUT/report.json"
          if [[ "$REQUIRED" != "true" ]]; then
            echo 'status=skipped' >> "$GITHUB_OUTPUT"
            echo 'seed-id=none' >> "$GITHUB_OUTPUT"
            echo 'report-b64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -s "$REPORT" ]]; then
            echo 'status=error' >> "$GITHUB_OUTPUT"
            echo 'seed-id=missing-report' >> "$GITHUB_OUTPUT"
            echo 'report-b64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$REPORT" >> "$GITHUB_OUTPUT" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          raw = path.read_bytes()
          value = json.loads(raw)
          print('status=' + str(value.get('status') or 'error'))
          print('seed-id=' + str(value.get('seed_id') or 'missing'))
          print('report-b64=' + base64.b64encode(raw).decode('ascii'))
          PY

      - name: Hidden evaluator summary
        if: always()
        shell: bash
        env:
          REQUIRED: ${{ steps.scope.outputs.required }}
          STATUS: ${{ steps.collect.outputs.status }}
          SEED_ID: ${{ steps.collect.outputs.seed-id }}
          MATCHED: ${{ steps.scope.outputs.matched-count }}
        run: |
          {
            echo '## Hidden functional evidence'
            echo ''
            echo "- evaluator: \`${{ inputs.evaluator }}\`"
            echo "- required: **${REQUIRED:-unknown}** (${MATCHED:-0} matching path(s))"
            echo "- status: **${STATUS:-error}**"
            echo "- seed id: \`${SEED_ID:-missing}\`"
            if [[ -s "${RUNNER_TEMP:-/tmp}/hidden-evidence/report.json" ]]; then
              echo ''
              echo '| Check | Status |'
              echo '|---|---|'
              python3 - "${RUNNER_TEMP:-/tmp}/hidden-evidence/report.json" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          for check in value.get('checks') or []:
              name = str(check.get('name', '')).replace('|', '\\|')
              status = str(check.get('status', 'error')).replace('|', '\\|')
              print(f'| {name} | {status} |')
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted replay capsule
        if: always() && steps.scope.outputs.required == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: hidden-replay-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hidden-evidence/replay.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce hidden verdict
        if: always()
        shell: bash
        env:
          REQUIRED: ${{ steps.scope.outputs.required }}
          STATUS: ${{ steps.collect.outputs.status }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRED" != "true" ]]; then
            exit 0
          fi
          if [[ "$STATUS" != "pass" ]]; then
            echo "::error::Hidden evaluator ${{ inputs.evaluator }} returned ${STATUS:-error}."
            exit 1
          fi
