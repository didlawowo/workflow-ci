name: Validate self-hosted mutation routing

on:
  push:
    branches: [maintenance/self-hosted-mutation-fix]
    paths: [.github/workflows/maintenance-self-hosted-mutation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: arc-runner-workflow-ci
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0eeaf349db4ef745185d8c600fb309ffd13d9a95
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: Run pinned reviewed preparation and regression commands
        run: |
          uv run --no-project --python 3.12 --with PyYAML==6.0.3 python - <<'PY'
          import subprocess
          import yaml

          # This exact revision contains the preparation and tests already reviewed
          # and executed in run 35756026354. Never execute a moving branch here.
          revision = '0eeaf349db4ef745185d8c600fb309ffd13d9a95'
          filename = '.github/workflows/maintenance-self-hosted-mutation.yml'
          text = subprocess.check_output(['git', 'show', revision + ':' + filename], text=True)
          workflow = yaml.safe_load(text)
          steps = {step.get('name'): step for step in workflow['jobs']['validate']['steps']}
          for name in (
              'Prepare minimal runner correction',
              'Verify only routing changed in workflow semantics',
              'Execute routing and existing workflow contract tests',
          ):
              print('EXECUTING: ' + name, flush=True)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', steps[name]['run']], check=True)
          PY
      - name: Export tested content objects without changing branches or tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          paths = [
              '.github/workflows/mutation-policy.yml',
              '.github/workflows/mutation-issue-policy.yml',
              'tests/test_quality_workflow_contract.py',
              'tests/test_mutation_self_hosted_routing.py',
              'docs/mutation-runners.md',
          ]
          blobs = []
          for path in paths:
              request = urllib.request.Request(
                  'https://api.github.com/repos/didlawowo/workflow-ci/git/blobs',
                  data=json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'}).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              blobs.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          print('BASE_COMMIT=80c309a684659ea7bdb09c89a356cf7488f4a0b5')
          print('TESTED_BLOBS=' + json.dumps(blobs))
          PY
