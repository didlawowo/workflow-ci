name: Validate self-hosted mutation routing

on:
  push:
    branches: [maintenance/self-hosted-mutation-fix]
    paths: [.github/workflows/maintenance-self-hosted-mutation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0eeaf349db4ef745185d8c600fb309ffd13d9a95
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: Run pinned reviewed preparation and regression commands
        run: |
          uv run --no-project --python 3.12 --with PyYAML==6.0.3 python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          import yaml

          revision = '0eeaf349db4ef745185d8c600fb309ffd13d9a95'
          filename = '.github/workflows/maintenance-self-hosted-mutation.yml'
          text = subprocess.check_output(['git', 'show', revision + ':' + filename], text=True)
          workflow = yaml.safe_load(text)
          steps = {step.get('name'): step for step in workflow['jobs']['validate']['steps']}
          for name in (
              'Prepare minimal runner correction',
              'Verify only routing changed in workflow semantics',
              'Execute routing and existing workflow contract tests',
          ):
              print('EXECUTING: ' + name, flush=True)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', steps[name]['run']], check=True)
              if name == 'Prepare minimal runner correction':
                  # Use the actual ARC scale-set name when RUNNER is unset.
                  expression = "format('arc-runner-{0}', github.event.repository.name)"
                  for changed in (
                      '.github/workflows/mutation-policy.yml',
                      '.github/workflows/mutation-issue-policy.yml',
                      'tests/test_quality_workflow_contract.py',
                      'tests/test_mutation_self_hosted_routing.py',
                  ):
                      path = Path(changed)
                      updated = path.read_text().replace("|| 'self-hosted'", '|| ' + expression)
                      if changed.endswith('test_mutation_self_hosted_routing.py'):
                          for prefix in (
                              'vars.UNTRUSTED_RUNNER || vars.RUNNER || ',
                              'inputs.trusted-runner || vars.RUNNER || ',
                              'inputs.runner || vars.RUNNER || ',
                          ):
                              old = '            "' + prefix + expression + '",'
                              new = (
                                  '            (\n'
                                  '                "' + prefix + '"\n'
                                  '                "' + expression + '"\n'
                                  '            ),'
                              )
                              assert old in updated, prefix
                              updated = updated.replace(old, new)
                      path.write_text(updated)
                  new_test = Path('tests/test_mutation_self_hosted_routing.py')
                  before_ast = ast.dump(ast.parse(new_test.read_text()), include_attributes=False)
                  subprocess.run([
                      'uvx', '--from', 'ruff==0.16.8', 'ruff', 'format', str(new_test)
                  ], check=True)
                  assert ast.dump(ast.parse(new_test.read_text()), include_attributes=False) == before_ast
                  doc = Path('docs/mutation-runners.md')
                  doc.write_text(doc.read_text().replace(
                      'then `self-hosted`', 'then the conventional `arc-runner-<repository>` scale set'
                  ).replace(
                      'For an ARC installation, `RUNNER` must name the actual scale set, for\n'
                      'example `arc-runner-photo-analyser`; no extra variable or GitHub Manager\n'
                      'deployment is required when `RUNNER` is already configured.',
                      'The default follows the existing ARC naming convention, for example\n'
                      '`arc-runner-photo-analyser`. An existing `RUNNER` takes precedence;\n'
                      'set it for a nonstandard scale-set name. No extra variable or GitHub\n'
                      'Manager deployment is required for the existing conventional runners.'
                  ))
          PY
      - name: Export tested content objects without changing branches or tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          paths = [
              '.github/workflows/mutation-policy.yml',
              '.github/workflows/mutation-issue-policy.yml',
              'tests/test_quality_workflow_contract.py',
              'tests/test_mutation_self_hosted_routing.py',
              'docs/mutation-runners.md',
          ]
          blobs = []
          for path in paths:
              request = urllib.request.Request(
                  'https://api.github.com/repos/didlawowo/workflow-ci/git/blobs',
                  data=json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'}).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              blobs.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          print('BASE_COMMIT=80c309a684659ea7bdb09c89a356cf7488f4a0b5')
          print('TESTED_BLOBS=' + json.dumps(blobs))
          PY
