name: Central mutation delegation self-test
on:
  pull_request:
    paths:
      - '.ci/**'
      - '.forgejo/actions/mutation-policy/**'
      - 'tests/*mutation*'
      - '.github/workflows/mutation-delegation-selftest.yml'
  push:
    branches: [main]
    paths:
      - '.ci/**'
      - '.forgejo/actions/mutation-policy/**'
      - 'tests/*mutation*'
      - '.github/workflows/mutation-delegation-selftest.yml'
permissions:
  contents: read
concurrency:
  group: mutation-delegation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python-central-runner:
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate runner cache
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" == phoenix-* ]]; then
            export WORKFLOW_CACHE_PROFILE=local
            export WORKFLOW_LOCAL_ROOT="$RUNNER_TEMP"
          fi
          source ".ci/nfs-cache.sh"
          require_runner_cache UV_CACHE_DIR
          python_index_fallback_if_unreachable
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
          prune-cache: false
      - name: Real dependency-bearing consumer without a local mutation script
        run: bash tests/run_central_mutation_smoke.sh
      - name: Real Forgejo adapter sandbox without a live forge dependency
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(id -u)" == "0" ]]; then
            uv run --no-project --python 3.12 python tests/run_forgejo_mutation_smoke.py
          else
            ROOT_UV_CACHE="${RUNNER_TEMP:-/tmp}/forgejo-root-uv-cache"
            sudo rm -rf "$ROOT_UV_CACHE"
            sudo mkdir -p "$ROOT_UV_CACHE"
            sudo env \
              "PATH=$PATH" \
              "UV_CACHE_DIR=$ROOT_UV_CACHE" \
              "PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}" \
              "UV_DEFAULT_INDEX=${UV_DEFAULT_INDEX:-https://pypi.org/simple}" \
              uv run --no-project --python 3.12 python tests/run_forgejo_mutation_smoke.py
          fi
