name: Mutation testing policy

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  notify:
    if: >-
      github.event_name == 'issues' &&
      (github.event.label.name == 'complexity:high' ||
       github.event.label.name == 'priority:high')
    permissions:
      contents: read
      issues: write
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Fetch trusted policy without submodule traversal
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .policy
          git init -q .policy
          git -C .policy remote add origin "${GITHUB_SERVER_URL}/${TARGET_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$POLICY_TOKEN" | base64 | tr -d '\n')"
          git -C .policy -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git -C .policy checkout -q --detach FETCH_HEAD

      - name: Explain mandatory mutation testing
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
        run: uv run --no-project --python 3.12 python .policy/.github/scripts/mutation_policy.py notify

  mutation-run:
    if: github.event_name == 'pull_request'
    # PR code and its tests are untrusted. Keep this job read-only and, unless
    # explicitly overridden, off self-hosted/ARC runners.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ${{ vars.UNTRUSTED_RUNNER || 'ubuntu-latest' }}
    outputs:
      required: ${{ steps.policy.outputs.required }}
      labels: ${{ steps.policy.outputs.labels }}
      runner-exit-code: ${{ steps.run-mutation.outputs.exit-code }}
      evidence-available: ${{ steps.evidence.outputs.available }}
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Fetch trusted base policy without submodule traversal
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .policy
          git init -q .policy
          git -C .policy remote add origin "${GITHUB_SERVER_URL}/${TARGET_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$POLICY_TOKEN" | base64 | tr -d '\n')"
          git -C .policy -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git -C .policy checkout -q --detach FETCH_HEAD

      - name: Classify pull request from trusted policy
        id: policy
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
        run: uv run --no-project --python 3.12 python .policy/.github/scripts/mutation_policy.py classify

      - name: Fetch pull request code without submodule traversal
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf pr
          git init -q pr
          git -C pr remote add origin "${GITHUB_SERVER_URL}/${HEAD_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$POLICY_TOKEN" | base64 | tr -d '\n')"
          git -C pr -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags origin "$HEAD_SHA"
          git -C pr checkout -q --detach FETCH_HEAD
          git -C pr remote add base "${GITHUB_SERVER_URL}/${BASE_REPOSITORY}.git"
          git -C pr -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags base "$BASE_SHA"

      - name: Verify trusted mutation runner exists
        if: steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/.policy/.ci/mutation.sh"
          if [[ ! -f "$SCRIPT" ]]; then
            echo "::error::.ci/mutation.sh must already exist on the protected base branch."
            echo "::error::A pull request cannot introduce or replace its own mandatory mutation runner."
            exit 1
          fi
          if ! grep -Eiq 'mutmut[[:space:]]+run|gremlins[[:space:]]+unleash|stryker([^[:alnum:]]+[^[:space:]]+)*[[:space:]]+run|cargo[[:space:]]+mutants|pitest|infection' "$SCRIPT"; then
            echo "::error::Trusted .ci/mutation.sh does not invoke a supported real mutation engine."
            exit 1
          fi

      - name: Verify mutation configuration is unchanged
        if: steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python - "$GITHUB_WORKSPACE/.policy" "$GITHUB_WORKSPACE/pr" <<'PY'
          import configparser
          import json
          import sys
          import tomllib
          from pathlib import Path

          def mutation_config(root: Path):
              result = {}

              pyproject = root / "pyproject.toml"
              if pyproject.is_file():
                  data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
                  mutmut = data.get("tool", {}).get("mutmut")
                  if isinstance(mutmut, dict):
                      result["pyproject.toml"] = mutmut

              setup_cfg = root / "setup.cfg"
              if setup_cfg.is_file():
                  parser = configparser.ConfigParser()
                  parser.read(setup_cfg, encoding="utf-8")
                  if parser.has_section("mutmut"):
                      result["setup.cfg"] = dict(parser.items("mutmut"))

              return result

          trusted = mutation_config(Path(sys.argv[1]))
          proposed = mutation_config(Path(sys.argv[2]))

          if trusted != proposed:
              print("::error::Mutation-engine configuration differs from the protected base.")
              print("Trusted:", json.dumps(trusted, sort_keys=True))
              print("Proposed:", json.dumps(proposed, sort_keys=True))
              print(
                  "::error::Change mutation policy/configuration in a dedicated PR "
                  "before relying on it for a high-risk PR."
              )
              raise SystemExit(1)

          print("Mutation configuration matches the protected base.")
          PY

      - name: Prepare isolated Python mutation environment
        id: mutation-python
        if: steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/.policy/.ci/mutation.sh"
          if grep -Eiq 'mutmut[[:space:]]+run' "$SCRIPT"; then
            VENV="${RUNNER_TEMP:-/tmp}/mutation-venv"
            rm -rf "$VENV"
            echo "::group::mutation bootstrap (uv)"
            uv python install 3.12
            uv venv --python 3.12 --seed "$VENV"
            echo "::endgroup::"
            echo "venv=$VENV" >> "$GITHUB_OUTPUT"
          else
            echo "venv=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run trusted mutation runner against PR code
        id: run-mutation
        if: steps.policy.outputs.required == 'true'
        shell: bash
        working-directory: pr
        env:
          MUTATION_POLICY_LABELS: ${{ steps.policy.outputs.labels }}
          MUTATION_VENV: ${{ steps.mutation-python.outputs.venv }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MUTATION_PATH="$PATH"
          if [[ -n "$MUTATION_VENV" ]]; then
            MUTATION_PATH="$MUTATION_VENV/bin:$MUTATION_PATH"
          fi
          mkdir -p .quality
          echo "::notice::mutation scope base=${MUTATION_BASE_SHA} head=${MUTATION_HEAD_SHA}"
          # No forge token or inherited secrets are passed to PR code. Capture
          # the runner exit code so trusted verification can distinguish an
          # infrastructure/baseline-test failure from actual mutation survivors.
          set +e
          env -i \
            PATH="$MUTATION_PATH" \
            HOME="$HOME" \
            VIRTUAL_ENV="$MUTATION_VENV" \
            RUNNER_TEMP="${RUNNER_TEMP:-/tmp}" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            UV_CACHE_DIR="${UV_CACHE_DIR:-}" \
            CI=true \
            MUTATION_POLICY_LABELS="$MUTATION_POLICY_LABELS" \
            MUTATION_BASE_SHA="$MUTATION_BASE_SHA" \
            MUTATION_HEAD_SHA="$MUTATION_HEAD_SHA" \
            bash "$GITHUB_WORKSPACE/.policy/.ci/mutation.sh" \
            2>&1 | tee .quality/mutation-run.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "exit-code=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" -ne 0 ]]; then
            echo "::warning::Mutation runner exited with status $STATUS; trusted verification will classify the failure."
          fi

      - name: Capture mutmut diagnostics
        if: always() && steps.policy.outputs.required == 'true' && steps.mutation-python.outputs.venv != ''
        shell: bash
        working-directory: pr
        env:
          MUTATION_VENV: ${{ steps.mutation-python.outputs.venv }}
        run: |
          set -euo pipefail
          mkdir -p .quality
          if [[ -s .quality/mutmut-results.txt ]]; then
            echo "::notice::Using mutmut diagnostics emitted by trusted runner."
          elif [[ -x "$MUTATION_VENV/bin/mutmut" ]]; then
            "$MUTATION_VENV/bin/mutmut" results > .quality/mutmut-results.txt || true
          else
            echo "::warning::mutmut diagnostics unavailable; engine-native JSON remains authoritative."
          fi

      - name: Locate engine-native mutation evidence
        id: evidence
        if: always() && steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pr/mutants/mutmut-cicd-stats.json ]]; then
            echo "path=pr/mutants/mutmut-cicd-stats.json" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ -f pr/.quality/gremlins.json ]]; then
            echo "path=pr/.quality/gremlins.json" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No engine-native mutation evidence was produced."
          fi

      - name: Upload untrusted mutation evidence
        if: always() && steps.policy.outputs.required == 'true' && steps.evidence.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: |
            ${{ steps.evidence.outputs.path }}
            pr/.quality/
          retention-days: 7
          if-no-files-found: error

      - name: Mutation testing not required
        if: steps.policy.outputs.required != 'true'
        run: echo "No complexity:high or priority:high label found on the PR or linked issue."

  mutation-verify:
    name: Mutation policy gate
    if: always() && github.event_name == 'pull_request'
    needs: [mutation-run]
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    runs-on: ${{ vars.UNTRUSTED_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Fetch trusted base policy without submodule traversal
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .policy
          git init -q .policy
          git -C .policy remote add origin "${GITHUB_SERVER_URL}/${TARGET_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$POLICY_TOKEN" | base64 | tr -d '\n')"
          git -C .policy -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git -C .policy checkout -q --detach FETCH_HEAD

      - name: Re-classify pull request independently
        id: policy
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
        run: uv run --no-project --python 3.12 python .policy/.github/scripts/mutation_policy.py classify

      - name: Detect mutation bootstrap failure
        if: steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.mutation-run.result }}" != "success" ]]; then
            echo "::error title=Mutation bootstrap failure::The mutation job failed before evidence classification. Check uv/bootstrap/git fetch steps."
            exit 1
          fi

      - name: Fetch pull request for diff analysis without submodule traversal
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf pr
          git init -q pr
          git -C pr remote add origin "${GITHUB_SERVER_URL}/${HEAD_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$POLICY_TOKEN" | base64 | tr -d '\n')"
          git -C pr -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags origin "$HEAD_SHA"
          git -C pr checkout -q --detach FETCH_HEAD
          git -C pr remote add base "${GITHUB_SERVER_URL}/${BASE_REPOSITORY}.git"
          git -C pr -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags base "$BASE_SHA"

      - name: Require engine-native mutation evidence
        if: steps.policy.outputs.required == 'true' && needs.mutation-run.outputs.evidence-available != 'true'
        shell: bash
        run: |
          echo "::error title=Mutation runner/baseline-test failure::Runner exit=${{ needs.mutation-run.outputs.runner-exit-code }} and no engine-native mutation evidence was produced."
          exit 1

      - name: Download mutation evidence
        if: steps.policy.outputs.required == 'true' && needs.mutation-run.outputs.evidence-available == 'true'
        uses: actions/download-artifact@v6
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: .mutation-evidence

      - name: Validate mutation evidence for changed Python functions
        id: validate
        if: steps.policy.outputs.required == 'true' && needs.mutation-run.outputs.evidence-available == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPORT="$(find .mutation-evidence -type f -name 'mutmut-cicd-stats.json' -print -quit)"
          RESULTS="$(find .mutation-evidence -type f -name 'mutmut-results.txt' -print -quit)"

          if [[ -z "$REPORT" ]]; then
            # Non-mutmut engines still use aggregate engine-native validation.
            REPORT="$(find .mutation-evidence -type f -name '*.json' -print -quit)"
          fi
          if [[ -z "$REPORT" ]]; then
            echo "::error::No mutation evidence artifact was downloaded."
            exit 1
          fi

          uv run --no-project --python 3.12 python - "$REPORT" "$RESULTS" "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/.policy" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT" <<'PY'
          import ast
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          results_path = Path(sys.argv[2]) if sys.argv[2] else None
          repo = Path(sys.argv[3])
          policy_root = Path(sys.argv[4])
          base = sys.argv[5]
          head = sys.argv[6]
          output_path = Path(sys.argv[7])

          data = json.loads(report_path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("mutation evidence must be a JSON object")

          def value(*aliases):
              candidates = [data]
              for key in ("stats", "summary", "results", "mutations"):
                  nested = data.get(key)
                  if isinstance(nested, dict):
                      candidates.append(nested)
              for candidate in candidates:
                  for alias in aliases:
                      current = candidate.get(alias)
                      if isinstance(current, (int, float)):
                          return int(current)
              return None

          killed = value("killed", "killed_mutants", "mutants_killed")
          survived = value(
              "survived", "surviving", "survived_mutants",
              "mutants_survived", "mutants_lived",
          )
          timeouts = value("timeouts", "timeout", "timed_out") or 0
          suspicious = value("suspicious", "suspicious_mutants") or 0
          total = value("total", "total_mutants", "mutants", "mutants_total")

          if killed is None or survived is None:
              raise SystemExit("mutation evidence is missing killed/survived counters")
          if total is None:
              total = killed + survived + timeouts + suspicious
          if total <= 0:
              raise SystemExit("mutation evidence contains no measured mutants")

          # Engines without per-mutant locations keep the conservative aggregate gate.
          if not results_path or not results_path.is_file():
              if survived or timeouts or suspicious:
                  raise SystemExit(
                      f"mutation gate failed: survived={survived}, "
                      f"timeouts={timeouts}, suspicious={suspicious}"
                  )
              scoped_path = report_path
              print(f"mutation gate passed: {killed}/{total} mutants killed")
          else:
              status_re = re.compile(r"^\s*(\S+):\s+([a-z_]+)\s*$")
              statuses = {}
              for raw in results_path.read_text(encoding="utf-8").splitlines():
                  match = status_re.match(raw)
                  if match:
                      statuses[match.group(1)] = match.group(2)

              diff = subprocess.run(
                  [
                      "git", "-C", str(repo), "diff", "--unified=0", "--no-color",
                      f"{base}..{head}", "--", "*.py",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

              changed_lines = {}
              current_path = None
              for raw in diff.splitlines():
                  if raw.startswith("+++ b/"):
                      current_path = raw[6:]
                      changed_lines.setdefault(current_path, set())
                      continue
                  if not raw.startswith("@@") or current_path is None:
                      continue
                  match = re.search(r"\+(\d+)(?:,(\d+))?", raw)
                  if not match:
                      continue
                  start = int(match.group(1))
                  count = int(match.group(2) or "1")
                  changed_lines[current_path].update(range(start, start + count))

              # Reject source-level mutation suppressions in changed code.
              for raw in diff.splitlines():
                  if (
                      raw.startswith("+")
                      and not raw.startswith("+++")
                      and "pragma: no mutate" in raw
                  ):
                      raise SystemExit(
                          "mutation gate failed: changed mutation-target code adds "
                          "a '# pragma: no mutate' suppression"
                      )

              # source_paths is part of the protected policy. The PR cannot shrink
              # this scope because the mutation config is compared before execution.
              source_paths = []
              trusted_pyproject = policy_root / "pyproject.toml"
              if trusted_pyproject.is_file():
                  import tomllib
                  trusted_config = tomllib.loads(
                      trusted_pyproject.read_text(encoding="utf-8")
                  )
                  configured = (
                      trusted_config.get("tool", {})
                      .get("mutmut", {})
                      .get("source_paths", [])
                  )
                  if isinstance(configured, str):
                      source_paths = [configured]
                  elif isinstance(configured, list):
                      source_paths = [str(value) for value in configured]

              def in_trusted_source_path(relative):
                  if not source_paths:
                      return True
                  candidate = Path(relative)
                  for raw in source_paths:
                      configured = Path(raw)
                      if candidate == configured:
                          return True
                      if (
                          configured.suffix == ""
                          and candidate.is_relative_to(configured)
                      ):
                          return True
                  return False

              changed_functions = {}
              for relative, lines in changed_lines.items():
                  path = repo / relative
                  if (
                      not lines
                      or not path.is_file()
                      or path.suffix != ".py"
                      or not in_trusted_source_path(relative)
                  ):
                      continue
                  try:
                      tree = ast.parse(path.read_text(encoding="utf-8"))
                  except (SyntaxError, UnicodeDecodeError):
                      continue
                  parts = list(Path(relative).with_suffix("").parts)
                  if parts and parts[0] == "src":
                      parts = parts[1:]
                  module = ".".join(parts)
                  names = set()
                  for node in ast.walk(tree):
                      if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          continue
                      end = getattr(node, "end_lineno", node.lineno)
                      if any(node.lineno <= line <= end for line in lines):
                          names.add(node.name)
                  if names:
                      changed_functions[module] = names

              def mutant_function(mutant_id):
                  if ".x_" not in mutant_id or "__mutmut_" not in mutant_id:
                      return None, None
                  module, rest = mutant_id.split(".x_", 1)
                  name = rest.split("__mutmut_", 1)[0]
                  return module, name

              scoped = {}
              for mutant_id, status in statuses.items():
                  module, generated_name = mutant_function(mutant_id)
                  names = changed_functions.get(module or "", set())
                  if not generated_name or not names:
                      continue
                  if any(
                      generated_name == name or generated_name.endswith("__" + name)
                      for name in names
                  ):
                      scoped[mutant_id] = status

              observed_functions = {}
              for mutant_id in statuses:
                  module, generated_name = mutant_function(mutant_id)
                  if not module or not generated_name:
                      continue
                  observed_functions.setdefault(module, set()).add(generated_name)

              missing_functions = []
              for module, names in changed_functions.items():
                  generated = observed_functions.get(module, set())
                  for name in names:
                      # main() is orchestration/CLI glue and may be intentionally
                      # outside unit-level mutation scope. All other changed
                      # functions in trusted source_paths must produce mutants.
                      if name == "main":
                          continue
                      if not any(
                          item == name or item.endswith("__" + name)
                          for item in generated
                      ):
                          missing_functions.append(f"{module}.{name}")

              if missing_functions:
                  raise SystemExit(
                      "mutation gate failed: changed functions produced no mutation "
                      "evidence (not exercised or excluded): "
                      + ", ".join(sorted(missing_functions))
                  )

              scoped_killed = sum(status == "killed" for status in scoped.values())
              scoped_survived = sum(status == "survived" for status in scoped.values())
              scoped_timeout = sum(status in {"timeout", "timed_out"} for status in scoped.values())
              scoped_suspicious = sum(status == "suspicious" for status in scoped.values())
              scoped_other = [
                  mutant_id
                  for mutant_id, status in scoped.items()
                  if status not in {"killed", "survived", "timeout", "timed_out", "suspicious"}
              ]

              if scoped:
                  print(
                      "changed-function mutation scope: "
                      + ", ".join(
                          f"{module}={sorted(names)}"
                          for module, names in sorted(changed_functions.items())
                      )
                  )
                  if scoped_survived or scoped_timeout or scoped_suspicious or scoped_other:
                      survivors = [
                          mutant_id
                          for mutant_id, status in scoped.items()
                          if status != "killed"
                      ]
                      preview = "\n".join(f"  - {item}" for item in survivors[:40])
                      raise SystemExit(
                          "mutation gate failed for changed functions: "
                          f"killed={scoped_killed}, survived={scoped_survived}, "
                          f"timeouts={scoped_timeout}, suspicious={scoped_suspicious}, "
                          f"other={len(scoped_other)}\n{preview}"
                      )
                  print(
                      f"mutation gate passed for changed functions: "
                      f"{scoped_killed}/{len(scoped)} mutants killed"
                  )
              else:
                  print(
                      "::notice::No covered mutation targets were found in changed "
                      "Python functions; aggregate legacy survivors do not block this PR."
                  )

              scoped_payload = {
                  "stats": {
                      "killed": scoped_killed,
                      "survived": scoped_survived,
                      "timeouts": scoped_timeout,
                      "suspicious": scoped_suspicious,
                      "total": len(scoped),
                  },
                  "scope": {
                      "base_sha": base,
                      "head_sha": head,
                      "changed_functions": {
                          module: sorted(names)
                          for module, names in sorted(changed_functions.items())
                      },
                  },
              }
              scoped_path = Path(".mutation-evidence/scoped-mutation.json")
              scoped_path.write_text(
                  json.dumps(scoped_payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"path={scoped_path}\n")
          PY

      - name: Require successful mutation runner after evidence validation
        if: steps.policy.outputs.required == 'true' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          if [[ "${{ needs.mutation-run.outputs.runner-exit-code }}" != "0" ]]; then
            echo "::error title=Mutation runner failure::Engine evidence passed, but the trusted runner exited with status ${{ needs.mutation-run.outputs.runner-exit-code }}."
            exit 1
          fi

      - name: Upload scoped mutation evidence
        if: always() && steps.policy.outputs.required == 'true' && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: scoped-mutation-evidence-${{ github.run_id }}
          path: ${{ steps.validate.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Confirm mutation testing is not required
        if: steps.policy.outputs.required != 'true'
        run: echo "Mutation testing is not required for this pull request."
