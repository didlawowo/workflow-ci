name: Mutation testing policy

on:
  workflow_call:
    inputs:
      scope-key:
        description: "Caller-specific concurrency scope"
        required: false
        type: string
        default: "default"
      trusted-runner:
        description: "Trusted runner label for verification-only jobs"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Project directory containing the language manifest"
        required: false
        type: string
        default: "."
      mutation-shards:
        description: "Use a protected campaign planner and 2 to 16 bounded workers"
        required: false
        type: number
        default: 1
    outputs:
      required:
        description: "Whether mutation testing is mandatory for this PR"
        value: ${{ jobs.campaign.outputs.required || jobs.mutation-run.outputs.required }}
      depth:
        description: "Mutation execution depth: none, medium or high"
        value: ${{ jobs.campaign.outputs.depth || jobs.mutation-run.outputs.depth }}
      artifact-name:
        description: "Trusted scoped mutation evidence artifact"
        value: ${{ jobs.mutation-verify.outputs.artifact-name }}
      report-file:
        description: "Mutation report filename"
        value: ${{ jobs.campaign.outputs.report-file || jobs.mutation-verify.outputs.report-file }}
      report-b64:
        description: "Base64 trusted scoped mutation report"
        value: ${{ jobs.campaign.outputs.report-b64 || jobs.mutation-verify.outputs.report-b64 }}
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: mutation-policy-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.scope-key || 'default' }}
  cancel-in-progress: true
jobs:
  campaign:
    if: github.event_name == 'pull_request' && inputs.mutation-shards > 1
    uses: $/.github/workflows/mutation-campaign.yml
    with:
      runner: ${{ inputs.trusted-runner || vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
      working-directory: ${{ inputs.working-directory || '.' }}
      shards: ${{ inputs.mutation-shards }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read

  mutation-run:
    if: github.event_name == 'pull_request' && inputs.mutation-shards <= 1
    # Use a dedicated execution runner when configured; otherwise inherit
    # the repository runner. Keep PR execution read-only and isolated.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ${{ vars.UNTRUSTED_RUNNER || vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 45
    outputs:
      required: ${{ steps.policy.outputs.required }}
      labels: ${{ steps.policy.outputs.labels }}
      depth: ${{ steps.policy.outputs.depth }}
      evidence-file: ${{ steps.inline-evidence.outputs.file }}
      evidence-b64: ${{ steps.inline-evidence.outputs.evidence-b64 }}
    steps:
      - name: Validate execution configuration
        shell: bash
        env:
          SHARDS: ${{ inputs.mutation-shards }}
        run: |
          set -euo pipefail
          test "${SHARDS:-1}" = 1
      - name: Fetch central workflow implementation without submodule traversal
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/.workflow-ci"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init -q
          URL="${GITHUB_SERVER_URL}/${WORKFLOW_REPOSITORY}.git"
          git -C "$DEST" fetch --no-tags "$URL" "$WORKFLOW_SHA"
          git -C "$DEST" checkout -q --detach "$WORKFLOW_SHA"

      - name: Fetch trusted base policy without submodule traversal
        env:
          MUTATION_FETCH_REPOSITORY: ${{ github.repository }}
          MUTATION_FETCH_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/.policy"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init -q

          ASKPASS="${RUNNER_TEMP:-/tmp}/mutation-git-askpass-policy.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$MUTATION_FETCH_TOKEN" ;;
            *) printf '\n' ;;
          esac
          SH
          chmod 700 "$ASKPASS"

          URL="${GITHUB_SERVER_URL}/${MUTATION_FETCH_REPOSITORY}.git"
          fetched=false
          for attempt in 1 2 3; do
            if GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
              git -C "$DEST" fetch --no-tags "$URL" "$MUTATION_FETCH_SHA"; then
              fetched=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Trusted base fetch attempt $attempt/3 failed; retrying."
              sleep "$attempt"
            fi
          done
          if [[ "$fetched" != "true" ]]; then
            echo "::error::Mutation checkout failure: unable to fetch trusted base $MUTATION_FETCH_SHA after 3 attempts."
            exit 1
          fi
          if ! git -C "$DEST" checkout --detach "$MUTATION_FETCH_SHA"; then
            echo "::error::Mutation checkout failure: unable to materialize trusted base $MUTATION_FETCH_SHA."
            exit 1
          fi
          echo "Trusted mutation policy loaded from $MUTATION_FETCH_SHA without traversing submodules."

      - name: Install uv for policy and mutation helpers
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          prune-cache: false

      - name: Classify pull request from trusted policy
        id: policy
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
          MUTATION_EXECUTION_MODE: ${{ vars.MUTATION_EXECUTION_MODE || 'automatic' }}
        run: uv run --no-project --python 3.12 python .workflow-ci/.github/scripts/mutation_policy.py classify

      - name: Fetch pull request code without submodule traversal
        if: steps.policy.outputs.required == 'true'
        env:
          MUTATION_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MUTATION_BASE_REPOSITORY: ${{ github.repository }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/pr"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init -q

          ASKPASS="${RUNNER_TEMP:-/tmp}/mutation-git-askpass-pr.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$MUTATION_FETCH_TOKEN" ;;
            *) printf '\n' ;;
          esac
          SH
          chmod 700 "$ASKPASS"

          fetch_commit() {
            local repository="$1"
            local sha="$2"
            local label="$3"
            local url="${GITHUB_SERVER_URL}/${repository}.git"
            local attempt
            for attempt in 1 2 3; do
              if GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
                git -C "$DEST" fetch --no-tags "$url" "$sha"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "::warning::Mutation fetch for $label attempt $attempt/3 failed; retrying."
                sleep "$attempt"
              fi
            done
            echo "::error::Mutation checkout failure: unable to fetch $label commit $sha from $repository after 3 attempts."
            exit 1
          }

          fetch_commit "$MUTATION_HEAD_REPOSITORY" "$MUTATION_HEAD_SHA" "head"
          git -C "$DEST" update-ref refs/mutation/head "$MUTATION_HEAD_SHA"
          fetch_commit "$MUTATION_BASE_REPOSITORY" "$MUTATION_BASE_SHA" "base"
          git -C "$DEST" update-ref refs/mutation/base "$MUTATION_BASE_SHA"

          if ! git -C "$DEST" checkout --detach refs/mutation/head; then
            echo "::error::Mutation checkout failure: unable to materialize PR head $MUTATION_HEAD_SHA."
            exit 1
          fi

          GITLINKS=()
          while IFS= read -r -d '' entry; do
            metadata="${entry%%$'\t'*}"
            gitlink_path="${entry#*$'\t'}"
            if [[ "$metadata" == 160000\ * ]]; then
              GITLINKS+=("$gitlink_path")
            fi
          done < <(git -C "$DEST" ls-files --stage -z)
          if [[ "${#GITLINKS[@]}" -gt 0 ]]; then
            DECLARED_PATHS=""
            if [[ -f "$DEST/.gitmodules" ]]; then
              DECLARED_PATHS="$(
                git -C "$DEST" config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null \
                  | sed 's/^[^ ]* //' || true
              )"
            fi
            for gitlink in "${GITLINKS[@]}"; do
              if ! grep -Fxq -- "$gitlink" <<<"$DECLARED_PATHS"; then
                echo "::warning::Mutation checkout diagnostic: gitlink '$gitlink' has no matching .gitmodules entry; continuing because mutation checkout never traverses submodules."
              fi
            done
          fi

          echo "Mutation checkout ready for exact scope $MUTATION_BASE_SHA...$MUTATION_HEAD_SHA."

      - name: Resolve trusted mutation runner
        id: runner
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CONSUMER_REPOSITORY: ${{ github.repository }}
          CENTRAL_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          PR_ROOT="$(cd "$GITHUB_WORKSPACE/pr" && pwd -P)"
          REQUESTED_DIRECTORY="${MUTATION_WORKING_DIRECTORY:-.}"
          if [[ "$REQUESTED_DIRECTORY" == /* ]]; then
            echo "::error::Mutation working-directory must be relative to the repository root."
            exit 1
          fi
          PROJECT_ROOT="$(cd "$PR_ROOT/$REQUESTED_DIRECTORY" && pwd -P)"
          case "$PROJECT_ROOT" in
            "$PR_ROOT") PROJECT_DIRECTORY="." ;;
            "$PR_ROOT"/*) PROJECT_DIRECTORY="${PROJECT_ROOT#"$PR_ROOT"/}" ;;
            *)
              echo "::error::Mutation working-directory escapes the pull request checkout."
              exit 1
              ;;
          esac

          CUSTOM="$GITHUB_WORKSPACE/.policy/.ci/mutation.sh"
          # Self-tests must exercise the central implementation under review.
          # External consumers continue to execute only their protected runner.
          if [[ "${CONSUMER_REPOSITORY:-consumer}" != "${CENTRAL_REPOSITORY:-central}" && -f "$CUSTOM" ]]; then
            if ! grep -Eiq 'mutmut[[:space:]]+run|gremlins[[:space:]]+unleash|stryker([^[:alnum:]]+[^[:space:]]+)*[[:space:]]+run|cargo[[:space:]]+mutants|pitest|infection' "$CUSTOM"; then
              echo "::error::Protected .ci/mutation.sh does not invoke a supported real mutation engine."
              exit 1
            fi

            if grep -Eiq 'mutmut-cicd-stats\.json|mutation-no-targets\.json|\.quality/gremlins\.json' "$CUSTOM"; then
              PR_ROOT="$(cd "$GITHUB_WORKSPACE/pr" && pwd -P)"
              TRUSTED_DIR="$GITHUB_WORKSPACE/pr/.workflow-ci-trusted-runner"

              rm -rf -- "$TRUSTED_DIR"
              mkdir -m 700 -- "$TRUSTED_DIR"
              TRUSTED_REAL="$(cd "$TRUSTED_DIR" && pwd -P)"
              case "$TRUSTED_REAL" in
                "$PR_ROOT"/*) ;;
                *)
                  echo "::error::Trusted mutation runner escaped the PR worktree."
                  exit 1
                  ;;
              esac
              if [[ -L "$TRUSTED_DIR" ]]; then
                echo "::error::Trusted mutation runner directory must not be a symlink."
                exit 1
              fi

              cp -a "$GITHUB_WORKSPACE/.policy/.ci/." "$TRUSTED_DIR/"
              MATERIALIZED="$TRUSTED_DIR/mutation.sh"
              if [[ ! -f "$MATERIALIZED" || -L "$MATERIALIZED" ]]; then
                echo "::error::Trusted mutation runner materialization is not a regular protected file."
                exit 1
              fi
              cmp -s "$CUSTOM" "$MATERIALIZED" || {
                echo "::error::Trusted mutation runner changed while materializing it into the PR worktree."
                exit 1
              }

              echo "path=$MATERIALIZED" >> "$GITHUB_OUTPUT"
              echo "source=consumer-base" >> "$GITHUB_OUTPUT"
              echo "working-directory=$PROJECT_DIRECTORY" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Protected .ci/mutation.sh runs a mutation engine but publishes no supported trusted evidence; falling back to the central runner."
          fi


          CHANGED_GO=()
          while IFS= read -r -d '' path; do
            case "$path" in
              *_test.go|vendor/*|testdata/*|tests/*) ;;
              *.go) CHANGED_GO+=("$path") ;;
            esac
          done < <(
            git -C "$PR_ROOT" diff --name-only -z \
              "$MUTATION_BASE_SHA...$MUTATION_HEAD_SHA" -- '*.go'
          )

          if [[ -f "$PROJECT_ROOT/go.mod" ]]; then
            if [[ "$PROJECT_DIRECTORY" != "." ]]; then
              for path in "${CHANGED_GO[@]}"; do
                case "$path" in
                  "$PROJECT_DIRECTORY"/*) ;;
                  *)
                    echo "::error::Changed Go production file '$path' is outside mutation working-directory '$PROJECT_DIRECTORY'."
                    exit 1
                    ;;
                esac
              done
            fi
            {
              echo "path=$GITHUB_WORKSPACE/.workflow-ci/.ci/mutation-go.sh"
              echo "source=workflow-ci-go"
              echo "working-directory=$PROJECT_DIRECTORY"
            } >> "$GITHUB_OUTPUT"
          elif [[ -f "$PROJECT_ROOT/pyproject.toml" || -f "$PROJECT_ROOT/setup.cfg" ]] || { [[ ! -f "$PROJECT_ROOT/package.json" ]] && find "$PROJECT_ROOT" -type f -name '*.py' -not -path '*/.venv/*' -print -quit | grep -q .; }; then
            if [[ "${#CHANGED_GO[@]}" -gt 0 ]]; then
              echo "::error::The selected mutation working-directory '$PROJECT_DIRECTORY' has no go.mod for changed Go production files."
              exit 1
            fi
            {
              echo "path=$GITHUB_WORKSPACE/.workflow-ci/.ci/mutation.sh"
              echo "source=workflow-ci-python"
              echo "working-directory=$PROJECT_DIRECTORY"
            } >> "$GITHUB_OUTPUT"
          elif [[ -f "$PROJECT_ROOT/package.json" ]]; then
            {
              echo "path=$GITHUB_WORKSPACE/.workflow-ci/.ci/mutation-node.sh"
              echo "source=workflow-ci-node"
              echo "working-directory=$PROJECT_DIRECTORY"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::No central mutation runner is available for this repository type."
            echo "::error::Add a protected-base .ci/mutation.sh that publishes supported evidence for an unsupported language."
            exit 1
          fi

      - name: Verify mutation configuration is unchanged
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ inputs.working-directory || '.' }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python - "$GITHUB_WORKSPACE/.policy/$PROJECT_DIRECTORY" "$GITHUB_WORKSPACE/pr/$PROJECT_DIRECTORY" <<'PY'
          import configparser
          import json
          import sys
          import tomllib
          from pathlib import Path

          def mutation_config(root: Path):
              result = {}

              pyproject = root / "pyproject.toml"
              if pyproject.is_file():
                  data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
                  mutmut = data.get("tool", {}).get("mutmut")
                  if isinstance(mutmut, dict):
                      result["pyproject.toml"] = mutmut

              setup_cfg = root / "setup.cfg"
              if setup_cfg.is_file():
                  parser = configparser.ConfigParser()
                  parser.read(setup_cfg, encoding="utf-8")
                  if parser.has_section("mutmut"):
                      result["setup.cfg"] = dict(parser.items("mutmut"))

              return result

          trusted = mutation_config(Path(sys.argv[1]))
          proposed = mutation_config(Path(sys.argv[2]))

          if trusted != proposed:
              print("::error::Mutation-engine configuration differs from the protected base.")
              print("Trusted:", json.dumps(trusted, sort_keys=True))
              print("Proposed:", json.dumps(proposed, sort_keys=True))
              print(
                  "::error::Change mutation policy/configuration in a dedicated PR "
                  "before relying on it for a high-risk PR."
              )
              raise SystemExit(1)

          print("Mutation configuration matches the protected base.")
          PY

      - name: Setup Go for central Gremlins runner
        if: steps.policy.outputs.required == 'true' && steps.runner.outputs.source == 'workflow-ci-go'
        uses: actions/setup-go@v6
        with:
          go-version-file: pr/${{ steps.runner.outputs.working-directory }}/go.mod
          cache: false

      - name: Setup Node for central Stryker runner
        if: steps.policy.outputs.required == 'true' && steps.runner.outputs.source == 'workflow-ci-node'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare isolated Python mutation environment
        id: mutation-python
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          PROJECT_DIRECTORY: ${{ inputs.working-directory || '.' }}
        run: |
          set -euo pipefail
          SCRIPT="${{ steps.runner.outputs.path }}"
          if grep -Eiq 'mutmut[[:space:]]+run' "$SCRIPT"; then
            VENV="${RUNNER_TEMP:-/tmp}/mutation-venv"
            PYTHON_VERSION="${MUTATION_PYTHON_VERSION:-3.12}"
            # Keep the isolated mutmut interpreter aligned with the consumer.
            # Read only a validated Python minor; never execute PR file content.
            PROJECT_VERSION_FILE="$GITHUB_WORKSPACE/pr/$PROJECT_DIRECTORY/.python-version"
            if [[ -f "$PROJECT_VERSION_FILE" ]]; then
              IFS= read -r REQUESTED_VERSION < "$PROJECT_VERSION_FILE" || true
              case "$REQUESTED_VERSION" in
                3.12|3.13|3.14) PYTHON_VERSION="$REQUESTED_VERSION" ;;
                *)
                  echo "::error::Unsupported consumer .python-version for mutation: $REQUESTED_VERSION"
                  exit 1
                  ;;
              esac
            fi
            echo "Using Python $PYTHON_VERSION for isolated mutation execution."
            rm -rf "$VENV"
            if ! uv python install "$PYTHON_VERSION"; then
              echo "::error::Mutation bootstrap failure: uv could not provision Python $PYTHON_VERSION."
              exit 1
            fi
            if ! uv venv "$VENV" --python "$PYTHON_VERSION" --seed; then
              echo "::error::Mutation bootstrap failure: uv could not create $VENV."
              exit 1
            fi
            echo "venv=$VENV" >> "$GITHUB_OUTPUT"
          else
            echo "venv=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run trusted mutation runner against PR code
        if: steps.policy.outputs.required == 'true'
        shell: bash
        working-directory: pr
        env:
          MUTATION_POLICY_LABELS: ${{ steps.policy.outputs.labels }}
          MUTATION_DEPTH: ${{ steps.policy.outputs.depth }}
          MUTATION_VENV: ${{ steps.mutation-python.outputs.venv }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_WORKING_DIRECTORY: ${{ steps.runner.outputs.working-directory }}
        run: |
          set -euo pipefail
          MUTATION_PATH="$PATH"
          if [[ -n "$MUTATION_VENV" ]]; then
            MUTATION_PATH="$MUTATION_VENV/bin:$MUTATION_PATH"
          fi
          ISOLATED_HOME="${RUNNER_TEMP:-/tmp}/mutation-home"
          ISOLATED_ROOT="${RUNNER_TEMP:-/tmp}/mutation-scratch"
          rm -rf "$ISOLATED_HOME" "$ISOLATED_ROOT"
          mkdir -p "$ISOLATED_HOME" "$ISOLATED_ROOT"
          ISOLATED_UV_CACHE="$(mktemp -d "$ISOLATED_ROOT/uv.XXXXXX")"
          ISOLATED_GO_CACHE="$(mktemp -d "$ISOLATED_ROOT/go-build.XXXXXX")"
          ISOLATED_GO_MODCACHE="$(mktemp -d "$ISOLATED_ROOT/go-mod.XXXXXX")"
          cleanup_mutation_scratch() {
            chmod -R u+w "$ISOLATED_ROOT" 2>/dev/null || true
            rm -rf "$ISOLATED_ROOT" "$ISOLATED_HOME"
          }
          trap cleanup_mutation_scratch EXIT

          # No forge token, persistent HOME or shared dependency cache is
          # exposed to PR code; only fresh runner-local scratch namespaces are passed.
          env \
            PATH="$MUTATION_PATH" \
            HOME="$ISOLATED_HOME" \
            UV_CACHE_DIR="$ISOLATED_UV_CACHE" \
            GOCACHE="$ISOLATED_GO_CACHE" \
            GOMODCACHE="$ISOLATED_GO_MODCACHE" \
            VIRTUAL_ENV="$MUTATION_VENV" \
            CI=true \
            MUTATION_POLICY_LABELS="$MUTATION_POLICY_LABELS" \
            MUTATION_DEPTH="$MUTATION_DEPTH" \
            MUTATION_BASE_SHA="$MUTATION_BASE_SHA" \
            MUTATION_HEAD_SHA="$MUTATION_HEAD_SHA" \
            MUTATION_WORKING_DIRECTORY="$MUTATION_WORKING_DIRECTORY" \
            python3 "$GITHUB_WORKSPACE/.workflow-ci/.ci/mutation_environment.py" -- \
            bash "${{ steps.runner.outputs.path }}"
      - name: Capture mutmut diagnostics
        if: always() && steps.policy.outputs.required == 'true' && steps.mutation-python.outputs.venv != ''
        shell: bash
        working-directory: pr/${{ steps.runner.outputs.source == 'workflow-ci-python' && steps.runner.outputs.working-directory || '.' }}
        env:
          MUTATION_VENV: ${{ steps.mutation-python.outputs.venv }}
        run: |
          set -euo pipefail
          mkdir -p .quality
          if [[ -s .quality/mutmut-results.txt ]]; then
            echo "::notice::Preserving mutation diagnostics produced by the trusted runner."
          elif [[ -x "$MUTATION_VENV/bin/mutmut" ]]; then
            "$MUTATION_VENV/bin/mutmut" results > .quality/mutmut-results.txt || true
          elif [[ -f mutants/mutmut-cicd-stats.json ]]; then
            echo "Mutmut completed successfully; machine-readable diagnostics are in mutants/mutmut-cicd-stats.json." > .quality/mutmut-results.txt
          elif [[ -f .quality/mutation-no-targets.json ]]; then
            echo "No mutmut diagnostics: exact PR scope contains no mutation targets." > .quality/mutmut-results.txt
          else
            echo "::error::Mutation diagnostics unavailable: no mutmut executable or supported mutation evidence exists."
            exit 1
          fi

      - name: Locate mutation evidence
        id: evidence
        if: always() && steps.policy.outputs.required == 'true'
        shell: bash
        env:
          SOURCE: ${{ steps.runner.outputs.source }}
          PROJECT_DIRECTORY: ${{ steps.runner.outputs.working-directory }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ROOT="pr"
          if [[ "$SOURCE" == workflow-ci-python ]]; then
            ROOT="pr/${PROJECT_DIRECTORY:-.}"
          fi
          uv run --no-project --python 3.12 python .workflow-ci/.ci/mutation_capture.py \
            --root "$ROOT" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --output "${RUNNER_TEMP}/mutation-captured.json"
          echo "path=${RUNNER_TEMP}/mutation-captured.json" >> "$GITHUB_OUTPUT"

      - name: Expose raw mutation evidence
        id: inline-evidence
        if: always() && steps.policy.outputs.required == 'true' && steps.evidence.outputs.path != ''
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${{ steps.evidence.outputs.path }}"
          test -s "$EVIDENCE"
          FILE="mutation-evidence.json"
          EVIDENCE_B64="$(gzip -c "$EVIDENCE" | base64 -w0)"
          if [[ "${#EVIDENCE_B64}" -gt 700000 ]]; then
            echo "::error::Mutation evidence is too large for trusted job outputs."
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "evidence-b64=$EVIDENCE_B64" >> "$GITHUB_OUTPUT"

      - name: Upload untrusted mutation evidence
        if: always() && steps.policy.outputs.required == 'true' && steps.evidence.outputs.path != ''
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: |
            ${{ steps.evidence.outputs.path }}
            pr/.quality/mutmut-results.txt
            pr/mutants/quality_report.py
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

      - name: Mutation testing not required
        if: steps.policy.outputs.required != 'true'
        run: >-
          echo "No high-risk label or supported production source change requires mutation testing."

  mutation-verify:
    name: Mutation policy gate
    if: always() && github.event_name == 'pull_request' && inputs.mutation-shards <= 1
    needs: [mutation-run]
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    runs-on: ${{ inputs.trusted-runner || vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 10
    outputs:
      artifact-name: ${{ steps.trusted-output.outputs.artifact-name }}
      report-file: ${{ steps.trusted-output.outputs.report-file }}
      report-b64: ${{ steps.trusted-output.outputs.report-b64 }}
    steps:
      - name: Fetch central workflow implementation without submodule traversal
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/.workflow-ci"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init -q
          URL="${GITHUB_SERVER_URL}/${WORKFLOW_REPOSITORY}.git"
          git -C "$DEST" fetch --no-tags "$URL" "$WORKFLOW_SHA"
          git -C "$DEST" checkout -q --detach "$WORKFLOW_SHA"

      - name: Fetch trusted base policy without submodule traversal
        env:
          MUTATION_FETCH_REPOSITORY: ${{ github.repository }}
          MUTATION_FETCH_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/.policy"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init -q

          ASKPASS="${RUNNER_TEMP:-/tmp}/mutation-git-askpass-policy.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$MUTATION_FETCH_TOKEN" ;;
            *) printf '\n' ;;
          esac
          SH
          chmod 700 "$ASKPASS"

          URL="${GITHUB_SERVER_URL}/${MUTATION_FETCH_REPOSITORY}.git"
          fetched=false
          for attempt in 1 2 3; do
            if GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
              git -C "$DEST" fetch --no-tags "$URL" "$MUTATION_FETCH_SHA"; then
              fetched=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Trusted base fetch attempt $attempt/3 failed; retrying."
              sleep "$attempt"
            fi
          done
          if [[ "$fetched" != "true" ]]; then
            echo "::error::Mutation checkout failure: unable to fetch trusted base $MUTATION_FETCH_SHA after 3 attempts."
            exit 1
          fi
          if ! git -C "$DEST" checkout --detach "$MUTATION_FETCH_SHA"; then
            echo "::error::Mutation checkout failure: unable to materialize trusted base $MUTATION_FETCH_SHA."
            exit 1
          fi
          echo "Trusted mutation policy loaded from $MUTATION_FETCH_SHA without traversing submodules."

      - name: Install uv for verification helpers
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          prune-cache: false

      - name: Re-classify pull request independently
        id: policy
        env:
          POLICY_PROVIDER: github
          POLICY_API_URL: ${{ github.api_url }}
          POLICY_REPOSITORY: ${{ github.repository }}
          POLICY_TOKEN: ${{ github.token }}
          POLICY_EVENT_PATH: ${{ github.event_path }}
          MUTATION_EXECUTION_MODE: ${{ vars.MUTATION_EXECUTION_MODE || 'automatic' }}
        run: uv run --no-project --python 3.12 python .workflow-ci/.github/scripts/mutation_policy.py classify

      - name: Require successful mutation execution
        if: steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.mutation-run.result }}" != "success" ]]; then
            echo "::error::Mandatory mutation execution did not complete successfully."
            exit 1
          fi

      - name: Fetch pull request code without submodule traversal
        if: steps.policy.outputs.required == 'true'
        env:
          MUTATION_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MUTATION_BASE_REPOSITORY: ${{ github.repository }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/pr"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init -q

          ASKPASS="${RUNNER_TEMP:-/tmp}/mutation-git-askpass-pr.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$MUTATION_FETCH_TOKEN" ;;
            *) printf '\n' ;;
          esac
          SH
          chmod 700 "$ASKPASS"

          fetch_commit() {
            local repository="$1"
            local sha="$2"
            local label="$3"
            local url="${GITHUB_SERVER_URL}/${repository}.git"
            local attempt
            for attempt in 1 2 3; do
              if GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
                git -C "$DEST" fetch --no-tags "$url" "$sha"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "::warning::Mutation fetch for $label attempt $attempt/3 failed; retrying."
                sleep "$attempt"
              fi
            done
            echo "::error::Mutation checkout failure: unable to fetch $label commit $sha from $repository after 3 attempts."
            exit 1
          }

          fetch_commit "$MUTATION_HEAD_REPOSITORY" "$MUTATION_HEAD_SHA" "head"
          git -C "$DEST" update-ref refs/mutation/head "$MUTATION_HEAD_SHA"
          fetch_commit "$MUTATION_BASE_REPOSITORY" "$MUTATION_BASE_SHA" "base"
          git -C "$DEST" update-ref refs/mutation/base "$MUTATION_BASE_SHA"

          if ! git -C "$DEST" checkout --detach refs/mutation/head; then
            echo "::error::Mutation checkout failure: unable to materialize PR head $MUTATION_HEAD_SHA."
            exit 1
          fi

          GITLINKS=()
          while IFS= read -r -d '' entry; do
            metadata="${entry%%$'\t'*}"
            gitlink_path="${entry#*$'\t'}"
            if [[ "$metadata" == 160000\ * ]]; then
              GITLINKS+=("$gitlink_path")
            fi
          done < <(git -C "$DEST" ls-files --stage -z)
          if [[ "${#GITLINKS[@]}" -gt 0 ]]; then
            DECLARED_PATHS=""
            if [[ -f "$DEST/.gitmodules" ]]; then
              DECLARED_PATHS="$(
                git -C "$DEST" config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null \
                  | sed 's/^[^ ]* //' || true
              )"
            fi
            for gitlink in "${GITLINKS[@]}"; do
              if ! grep -Fxq -- "$gitlink" <<<"$DECLARED_PATHS"; then
                echo "::warning::Mutation checkout diagnostic: gitlink '$gitlink' has no matching .gitmodules entry; continuing because mutation checkout never traverses submodules."
              fi
            done
          fi

          echo "Mutation checkout ready for exact scope $MUTATION_BASE_SHA...$MUTATION_HEAD_SHA."

      - name: Materialize mutation evidence from job outputs
        if: steps.policy.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mutation-evidence
          OUTPUTS_FILE="${RUNNER_TEMP:-/tmp}/mutation-outputs-${GITHUB_RUN_ID}.json"
          trap 'rm -f "$OUTPUTS_FILE"' EXIT
          # JSON escapes embedded newlines: an untrusted output cannot terminate
          # this quoted heredoc and become shell code. Large data stays off env.
          cat > "$OUTPUTS_FILE" <<'JSON_MUTATION_OUTPUTS'
          ${{ toJSON(needs.mutation-run.outputs) }}
          JSON_MUTATION_OUTPUTS
          uv run --no-project --python 3.12 python .workflow-ci/.ci/mutation_capture.py decode \
            --input "$OUTPUTS_FILE" --output .mutation-evidence/mutation-evidence.json

      - name: Validate mutation evidence for changed Python functions
        id: validate
        if: steps.policy.outputs.required == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_DIRECTORY: ${{ inputs.working-directory || '.' }}
          DEPTH: ${{ steps.policy.outputs.depth }}
        run: |
          set -euo pipefail
          POLICY_ROOT="${WORKFLOW_CI_ROOT:-$GITHUB_WORKSPACE/.workflow-ci}"
          REPORT="$(find .mutation-evidence -type f -name '*.json' -print -quit)"
          test -n "$REPORT"
          uv run --no-project --python 3.12 python "$POLICY_ROOT/.ci/mutation_evidence.py" \
            --repo "$GITHUB_WORKSPACE/pr" --trusted "$GITHUB_WORKSPACE/.policy" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --directory "${PROJECT_DIRECTORY:-.}" --depth "${DEPTH:-medium}" \
            --evidence "$REPORT" --output .mutation-evidence/scoped-mutation.json

      - name: Upload scoped mutation evidence
        if: always() && steps.policy.outputs.required == 'true' && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: scoped-mutation-evidence-${{ github.run_id }}
          path: ${{ steps.validate.outputs.path }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Expose trusted mutation evidence
        id: trusted-output
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.policy.outputs.required }}" == "true" && "${{ steps.validate.outcome }}" == "success" ]]; then
            REPORT="${{ steps.validate.outputs.path }}"
            test -s "$REPORT"
            REPORT_B64="$(base64 -w0 "$REPORT")"
            if [[ "${#REPORT_B64}" -gt 700000 ]]; then
              echo "::error::Trusted mutation report is too large for workflow outputs."
              exit 1
            fi
            echo "artifact-name=scoped-mutation-evidence-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "report-file=$(basename "$REPORT")" >> "$GITHUB_OUTPUT"
            echo "report-b64=$REPORT_B64" >> "$GITHUB_OUTPUT"
          else
            echo "artifact-name=" >> "$GITHUB_OUTPUT"
            echo "report-file=" >> "$GITHUB_OUTPUT"
            echo "report-b64=" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm mutation testing is not required
        if: steps.policy.outputs.required != 'true'
        run: >-
          echo "Mutation testing is not required by the protected repository policy."
