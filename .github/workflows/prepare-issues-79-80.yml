name: Validate fixes for issues 79 and 80
on:
  push:
    branches: [maintenance/prepare-issues-79-80]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ${{ vars.RUNNER || 'arc-runner-workflow-ci' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 896a421f6d4d49800008c61bd58c0e23f476b325
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
      - name: Materialize reviewed patch and migrated contracts
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import subprocess
          import yaml
          previous = subprocess.check_output(['git', 'show', 'e94307d53b5234ddabcb79fdd0dee3df3d9de728:.github/workflows/prepare-issues-79-80.yml'], text=True)
          subprocess.run(['bash', '-e', '-c', yaml.safe_load(previous)['jobs']['prepare']['steps'][2]['run']], check=True)
          PY
      - name: Format and lint new tests
        run: |
          uvx --from ruff==0.16.8 ruff format tests/test_mutation_report_fail_closed.py tests/test_secret_scan.py
          uvx --from ruff==0.16.8 ruff check tests/test_mutation_report_fail_closed.py tests/test_secret_scan.py
          bash -n .github/actions/python-quality-security/trufflehog.sh
      - name: Full regression suite
        run: uv run --no-project --with pytest --with pyyaml python -m pytest -q tests
      - name: Real TruffleHog Docker smoke on ARC shared workspace
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/.github/actions/python-quality-security/trufflehog.sh"
          WORK=$(mktemp -d "$GITHUB_WORKSPACE/.trufflehog-smoke.XXXXXX")
          trap 'rm -rf "$WORK"' EXIT
          git -C "$WORK" init -q
          git -C "$WORK" config user.name Test
          git -C "$WORK" config user.email test@example.invalid
          echo 'public fixture' > "$WORK/sample.txt"
          git -C "$WORK" add .
          git -C "$WORK" commit -qm fixture
          SHA=$(git -C "$WORK" rev-parse HEAD)
          if ! GITHUB_WORKSPACE="$WORK" GITHUB_SHA="$SHA" GITHUB_EVENT_NAME=workflow_dispatch bash "$SCRIPT"; then
            echo 'Diagnosing the public synthetic fixture only (no repository secrets).'
            docker run --rm -v "$WORK:/repo:ro" -w /repo ghcr.io/trufflesecurity/trufflehog:latest git file:///repo/ --branch "$SHA" --fail --fail-on-scan-errors --no-update --only-verified --json
            exit 1
          fi
      - name: Publish validated Git tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import subprocess
          import yaml
          previous = subprocess.check_output(['git', 'show', 'e94307d53b5234ddabcb79fdd0dee3df3d9de728:.github/workflows/prepare-issues-79-80.yml'], text=True)
          subprocess.run(['bash', '-e', '-c', yaml.safe_load(previous)['jobs']['prepare']['steps'][6]['run']], check=True)
          PY
