name: release

# Reusable release workflow.
# Drop-in replacement for release-please:
#   - reads conventional commits since the last tag
#   - bumps the version (feat → minor, fix → patch, BREAKING → major)
#   - rewrites CHANGELOG.md
#   - optionally patches a list of version files in place
#   - commits, tags, pushes, and creates the GitHub Release
#
# Single-step flow: merge to main → release. No intermediate PR.
#
# Calling repo must grant `permissions: contents: write` on the job.

on:
  workflow_call:
    inputs:
      version-files:
        description: |
          Multiline list of files to bump, format `path:regex`.
          The regex MUST contain one capture group around the current version string.
          Example:
            pyproject.toml:^version = "(.+)"$
            Chart.yaml:^version: (.+)$
        required: false
        type: string
        default: ""
      tag-prefix:
        description: Tag prefix. Default "v". Use "" for unprefixed tags or "chart-v" for Helm.
        required: false
        type: string
        default: "v"
      cliff-config:
        description: Path to a cliff.toml inside the calling repo. Falls back to workflow-ci defaults.
        required: false
        type: string
        default: ""
      dry-run:
        description: If true, compute everything but skip commit/tag/push/release.
        required: false
        type: boolean
        default: false
      workflow-ci-ref:
        description: Ref of workflow-ci to use for the composite action and defaults.
        required: false
        type: string
        default: "v1.7.0"
      runs-on:
        description: |
          Runner label for the release job. Defaults to a GitHub-hosted runner.
          Set a self-hosted label (e.g. an ARC scale set) so the release of a private
          repository does not depend on GitHub-hosted minutes: when the account's
          billing fails, GitHub refuses a hosted job before its first step and no
          release is cut, while CI on self-hosted runners stays green.
          The runner needs git, python3 and gh, and must run the actions used here
          (actions/checkout, orhun/git-cliff-action).
        required: false
        type: string
        default: "ubuntu-latest"
      trigger-cd-workflow:
        description: |
          Optional. When set to a workflow filename (e.g. `cd-production-orchestrator.yml`),
          this reusable workflow will fire `gh workflow run <file> -f tag=<new-tag>` after
          the tag is pushed. Required because GITHUB_TOKEN-pushed tags do not trigger
          downstream workflows (GitHub anti-loop). The target workflow MUST declare a
          `workflow_dispatch:` trigger with an `inputs.tag` (string, required=true).
        required: false
        type: string
        default: ""
      post-bump-command:
        description: |
          Commande shell exécutée APRÈS le patch des version-files et AVANT le commit
          de release. Sert aux fichiers dérivés qu'un `path:regex` ne sait pas cibler.

          Cas d'usage principal : `uv.lock`. uv y enregistre la version du projet dans
          une strophe `[[package]]`, identifiée par la ligne `name = "..."` qui précède
          la ligne `version = "..."`. Une regex ligne à ligne ne peut donc pas viser la
          bonne occurrence — le lock repartait périmé à chaque release, et le moindre
          `uv run` local le réécrivait en salissant l'arbre de travail.

          La commande doit être auto-suffisante (le runner n'a ni uv ni outil de build
          préinstallé). Ce qu'elle modifie est repris par le `git add -A` du commit de
          release. Un échec fait échouer le job : mieux vaut pas de release qu'une
          release incohérente.
        required: false
        type: string
        default: ""
    outputs:
      released:
        description: '"true" when a release was actually cut.'
        value: ${{ jobs.release.outputs.released }}
      version:
        description: Released version tag (e.g. v1.4.0). Empty when released=false.
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}

    # Deux merges rapprochés sur main lançaient deux releases en parallèle. La
    # première perdait la course au push :
    #
    #     error: failed to push some refs to '...'
    #
    # …et le run finissait rouge, alors que la seconde publiait bien une
    # version contenant les deux merges. Un `release` rouge sur main envoie
    # alors chercher une régression dans la PR qu'on vient de merger, là où il
    # n'y a rien. Observé 3 fois sur 3 le 2026-09-06 sur code-search, et déjà
    # le 2026-08-24.
    #
    # Le groupe porte le dépôt appelant : deux dépôts différents ne se bloquent
    # pas l'un l'autre.
    #
    # cancel-in-progress reste FAUX : annuler une release en cours la
    # laisserait à moitié faite — commit local, tag posé, rien de poussé. Les
    # runs s'attendent. Si plusieurs s'empilent, GitHub ne garde que le plus
    # récent en attente et annule les intermédiaires ; c'est le comportement
    # voulu, ce dernier run couvre de toute façon tous les commits depuis le
    # dernier tag.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    outputs:
      released: ${{ steps.result.outputs.released }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          # La BRANCHE, pas le SHA de l'événement. Par défaut actions/checkout
          # sort le commit qui a déclenché le run ; sérialiser les runs ne
          # suffirait alors pas, car le second sortirait quand même un état
          # antérieur au commit de release du premier et son `git push` serait
          # toujours en non-fast-forward. En sortant la pointe de la branche —
          # résolue à l'instant du checkout, donc après l'attente imposée par
          # `concurrency` — le run travaille sur ce que main contient vraiment.
          #
          # github.ref reste correct pour un workflow_dispatch lancé depuis une
          # autre branche : c'est celle-là qui est sortie, pas main.
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow-ci (for composite action + default cliff.toml)
        uses: actions/checkout@v4
        with:
          repository: didlawowo/workflow-ci
          ref: ${{ inputs.workflow-ci-ref }}
          path: .workflow-ci

      - name: Exclude workflow-ci checkout from release commits
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '.workflow-ci/' >> .git/info/exclude

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect recoverable release state
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" =~ ^chore\(release\):[[:space:]]+(.+)[[:space:]]+\[skip[[:space:]]ci\]$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "::notice::Recoverable release commit detected at HEAD: $version"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute bump + write CHANGELOG
        id: bump
        if: steps.recovery.outputs.pending != 'true'
        uses: ./.workflow-ci/.github/actions/git-cliff-bump
        with:
          config: ${{ inputs.cliff-config }}
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Nothing to release
        if: steps.recovery.outputs.pending != 'true' && steps.bump.outputs.released != 'true'
        run: |
          echo "No conventional commits since last tag → no release. This is normal."

      - name: Patch version files
        if: steps.recovery.outputs.pending != 'true' && steps.bump.outputs.released == 'true' && inputs.version-files != ''
        env:
          VERSION_FILES: ${{ inputs.version-files }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          # Strip prefix for in-file version strings (files usually want 1.4.0, not v1.4.0)
          BARE="${NEW_VERSION#${TAG_PREFIX}}"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line%%:*}"
            regex="${line#*:}"
            if [ ! -f "$path" ]; then
              echo "::warning::version-file '$path' not found, skipping"
              continue
            fi
            echo "Patching $path with regex $regex → $BARE"
            python3 - "$path" "$regex" "$BARE" <<'PY'
          import re, sys, pathlib
          path, regex, new = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path(path)
          src = p.read_text()
          pat = re.compile(regex, re.MULTILINE)
          m = pat.search(src)
          if not m:
              sys.exit(f"regex did not match in {path}")
          start, end = m.span(1)
          out = src[:start] + new + src[end:]
          p.write_text(out)
          PY
          done <<< "$VERSION_FILES"

      # Volontairement APRÈS le patch des version-files : la commande a besoin de
      # lire la nouvelle version dans les fichiers déjà patchés (ex. `uv lock` lit
      # `pyproject.toml`). Et volontairement AVANT le commit, pour que `git add -A`
      # embarque ce qu'elle produit dans le commit de release plutôt que de laisser
      # une dérive derrière.
      - name: Post-bump command
        if: steps.recovery.outputs.pending != 'true' && steps.bump.outputs.released == 'true' && inputs.post-bump-command != ''
        env:
          # Passage par l'environnement et non par interpolation directe dans `run:` :
          # une expression ${{ }} injectée dans le corps du script serait exécutée par
          # le shell avant même d'être une commande.
          POST_BUMP_COMMAND: ${{ inputs.post-bump-command }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          echo "Running post-bump command:"
          echo "$POST_BUMP_COMMAND"
          bash -euo pipefail -c "$POST_BUMP_COMMAND"

      - name: Prepare release commit
        if: steps.recovery.outputs.pending != 'true' && steps.bump.outputs.released == 'true' && inputs.dry-run != true
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add -A
          # Never let the helper checkout become part of the caller repository.
          # This is a second guard in addition to .git/info/exclude.
          git reset -- .workflow-ci 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::no changes staged (CHANGELOG/version-files unchanged) — releasing current HEAD"
          else
            git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
          fi

      - name: Resolve release result
        id: result
        if: always()
        env:
          RECOVERY_PENDING: ${{ steps.recovery.outputs.pending }}
          RECOVERY_VERSION: ${{ steps.recovery.outputs.version }}
          BUMP_RELEASED: ${{ steps.bump.outputs.released }}
          BUMP_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RECOVERY_PENDING" == "true" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$RECOVERY_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$BUMP_RELEASED" == "true" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$BUMP_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish or recover release
        id: publish
        if: steps.result.outputs.released == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.result.outputs.version }}
          RECOVERY_PENDING: ${{ steps.recovery.outputs.pending }}
        run: |
          set -euo pipefail
          dispatch=false

          if [[ "$RECOVERY_PENDING" != "true" ]]; then
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::error::push refused — ${GITHUB_REF_NAME} moved since checkout; no tag/release mutation was attempted."
              exit 1
            fi
          fi

          head_sha="$(git rev-parse HEAD)"
          local_tag_sha="$(git rev-list -n 1 "$NEW_VERSION" 2>/dev/null || true)"
          if [[ -n "$local_tag_sha" && "$local_tag_sha" != "$head_sha" ]]; then
            echo "::error::local tag $NEW_VERSION points to $local_tag_sha, expected $head_sha"
            exit 1
          fi
          if [[ -z "$local_tag_sha" ]]; then
            git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          fi

          remote_refs="$(git ls-remote origin "refs/tags/$NEW_VERSION" "refs/tags/$NEW_VERSION^{}" || true)"
          if [[ -z "$remote_refs" ]]; then
            git push origin "$NEW_VERSION"
            dispatch=true
          else
            remote_commit="$(printf '%s\n' "$remote_refs" | awk '/\^\{\}$/ {print $1; found=1} END {if (!found) {}}')"
            if [[ -z "$remote_commit" ]]; then
              remote_commit="$(printf '%s\n' "$remote_refs" | awk 'NR==1 {print $1}')"
            fi
            if [[ "$remote_commit" != "$head_sha" ]]; then
              echo "::error::remote tag $NEW_VERSION points to $remote_commit, expected $head_sha"
              exit 1
            fi
            echo "::notice::remote tag $NEW_VERSION already exists at the expected commit"
          fi

          if gh release view "$NEW_VERSION" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $NEW_VERSION already exists"
          else
            if [[ -s /tmp/release-notes.md ]]; then
              gh release create "$NEW_VERSION" --title "$NEW_VERSION" --notes-file /tmp/release-notes.md --verify-tag
            else
              gh release create "$NEW_VERSION" --title "$NEW_VERSION" --generate-notes --verify-tag
            fi
            dispatch=true
          fi

          echo "dispatch=$dispatch" >> "$GITHUB_OUTPUT"

      # GitHub anti-loop: a tag/commit pushed by GITHUB_TOKEN does not trigger
      # downstream workflows (no `push: tags: v*` event fires). To make the CD
      # orchestrator run on release, we dispatch it explicitly. The caller
      # must opt-in by passing `trigger-cd-workflow`, and the target workflow
      # must declare `workflow_dispatch:` with `inputs.tag` (string).
      - name: Trigger CD workflow on the new tag
        if: |
          steps.publish.outputs.dispatch == 'true'
          && inputs.trigger-cd-workflow != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.result.outputs.version }}
          CD_WORKFLOW: ${{ inputs.trigger-cd-workflow }}
        run: |
          set -euo pipefail
          echo "::notice::Triggering CD workflow '${CD_WORKFLOW}' with tag=${NEW_VERSION}"
          gh workflow run "${CD_WORKFLOW}" \
            -R "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "tag=${NEW_VERSION}"

      - name: Dry-run summary
        if: steps.recovery.outputs.pending != 'true' && steps.bump.outputs.released == 'true' && inputs.dry-run == true
        env:
          NEW_VERSION: ${{ steps.result.outputs.version }}
        run: |
          echo "::notice::DRY RUN — would have released ${NEW_VERSION}"
          echo "----- CHANGELOG.md (first 80 lines) -----"
          head -n 80 CHANGELOG.md || true
          echo "----- release notes -----"
          cat /tmp/release-notes.md || true
