name: Release workflow-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/quality-report-selftest.yml

  release:
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      validated-sha: ${{ github.sha }}
      workflow-ci-ref: ${{ github.sha }}
      runs-on: arc-runner-workflow-ci
    secrets: inherit
