name: Trusted policy integrity

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label used for the base-anchored policy check"
        required: true
        type: string

jobs:
  policy-integrity:
    name: "Trusted policy integrity"
    # pull_request_target ignores contributor approval: a fork PR must not start a
    # job on an internal runner. Other events still reach the context check below.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require protected pull request context
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request_target" || {
            echo "::error::Trusted policy integrity must be called from pull_request_target."
            exit 1
          }
          test -n "${{ github.event.pull_request.base.sha }}"
          test -n "${{ github.event.pull_request.head.sha }}"

      # The action refuses to copy anything but the implementation the runner
      # loaded for the exact commit of this workflow: no network access, and
      # the identity is verified before the checkout helper is used.
      - name: Load trusted workflow-ci policy without network access
        id: central
        uses: $/.github/actions/central-implementation
        with:
          workflow-repository: ${{ job.workflow_repository }}
          workflow-sha: ${{ job.workflow_sha }}
          path: .workflow-ci-policy

      - name: Checkout protected base
        shell: bash
        env:
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_REF: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_BASE_REF: ""
          CHECKOUT_HEAD_REF: ""
        run: |
          set -euo pipefail
          HELPER="$GITHUB_WORKSPACE/.workflow-ci-policy/.github/actions/checkout-source/checkout.sh"
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/.policy-base" bash "$HELPER"

      - name: Checkout untrusted candidate without executing it
        shell: bash
        env:
          CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_BASE_REF: ""
          CHECKOUT_HEAD_REF: ""
        run: |
          set -euo pipefail
          HELPER="$GITHUB_WORKSPACE/.workflow-ci-policy/.github/actions/checkout-source/checkout.sh"
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/.policy-candidate" bash "$HELPER"

      - name: Verify checkout identities
        shell: bash
        env:
          CENTRAL_SOURCE: ${{ steps.central.outputs.source }}
        run: |
          set -euo pipefail
          diff -rq "$CENTRAL_SOURCE" .workflow-ci-policy
          test "$(git -C .policy-base rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git -C .policy-candidate rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Enforce protected policy integrity
        id: integrity
        continue-on-error: true
        shell: bash
        env:
          # Forge metadata of the base repository from the pull_request_target
          # payload: the candidate cannot change it. Only "true" relaxes anything.
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP:-/tmp}/trusted-policy-integrity.json"
          FORK=false
          if [[ "${REPOSITORY_IS_FORK:-}" == "true" ]]; then
            FORK=true
          fi
          python3 .workflow-ci-policy/.github/scripts/policy_integrity.py \
            --base .policy-base \
            --candidate .policy-candidate \
            --repository "${{ github.repository }}" \
            --repository-fork "$FORK" \
            --report "$REPORT"

      - name: Publish policy integrity summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP:-/tmp}/trusted-policy-integrity.json"
          {
            echo "## Trusted policy integrity"
            echo ""
            if [[ ! -s "$REPORT" ]]; then
              echo "- status: **error**"
              echo "- base anchored: **yes**"
              echo "- candidate code executed: **no**"
              exit 0
            fi
            python3 - "$REPORT" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"- status: **{value.get('status', 'error')}**")
          print("- base anchored: **yes**")
          print("- candidate code executed: **no**")
          allowed = value.get("allowed") or []
          violations = value.get("violations") or []
          if allowed:
              print("")
              print("### Allowed migration")
              for item in allowed:
                  print(f"- `{item['path']}`: {item['reason']}")
          if violations:
              print("")
              print("### Violations")
              for item in violations:
                  print(f"- `{item['path']}`: {item['reason']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce integrity verdict
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.integrity.outcome }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Trusted policy integrity failed."
            exit 1
          fi
