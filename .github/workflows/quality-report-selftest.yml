name: Quality reporter self-test

on:
  pull_request:
    paths:
      - ".ci/**"
      - ".github/workflows/mutation-campaign.yml"
      - ".github/workflows/policy-integrity.yml"
      - ".github/actions/mutation-campaign-checkout/**"
      - ".forgejo/workflows/**"
      - ".github/actions/docker-build-push/**"
      - ".github/workflows/quality-report-selftest.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-main.yml"
      - ".github/actions/quality-report/**"
      - ".github/actions/run-python-tests/**"
      - ".github/actions/python-quality-security/**"
      - ".github/workflows/quality-evidence.yml"
      - ".github/actions/run-go-tests/**"
      - ".github/actions/run-node-tests/**"
      - "quality_report.py"
      - "image_changes.py"
      - ".ci/image-change-mutation.sh"
      - ".github/actions/detect-image-changes/**"
      - ".github/scripts/mutation_policy.py"
      - ".github/workflows/mutation-policy.yml"
      - ".github/workflows/mutation-issue-policy.yml"
      - ".ci/mutation-go.sh"
      - ".github/workflows/release.yml"
      - ".github/scripts/sync_internal_refs.py"
      - ".workflow-ci-version"
      - "templates/**"
      - "tests/**"
      - "pyproject.toml"
      - ".ci/mutation.sh"
      - ".ci/mutation_scope.py"
  workflow_call:

jobs:
  # release.yml only runs for real on main. This job loads its bump action the
  # same way, on a pull request, and checks what the action leaves behind.
  release-bump:
    name: Release bump action loaded by the runner
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute bump + write CHANGELOG
        id: bump
        uses: $/.github/actions/git-cliff-bump
      - name: Only the changelog changes in the caller checkout
        shell: bash
        env:
          RELEASED: ${{ steps.bump.outputs.released }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          echo "released=$RELEASED version=$VERSION"
          case "$RELEASED" in
            true) [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
            false) [[ -z "$VERSION" ]] ;;
            *) echo "::error::Unexpected released output: '$RELEASED'"; exit 1 ;;
          esac
          changed="$(git status --porcelain --untracked-files=all)"
          echo "$changed"
          if [[ -n "$(printf '%s\n' "$changed" | grep -v -x ' M CHANGELOG.md' || true)" ]]; then
            echo "::error::The release action left more than CHANGELOG.md behind."
            exit 1
          fi

  test:
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Detect preinstalled uv
        id: uv-runtime
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
            echo "Using preinstalled uv: $(uv --version)"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv for quality report
        if: steps.uv-runtime.outputs.preinstalled != 'true'
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
          prune-cache: false
      - name: Unit tests with evidence
        run: |
          python -m pip install pytest pytest-cov pyyaml
          mkdir -p coverage-reports
          PYTHONPATH="$GITHUB_WORKSPACE" pytest tests -q \
            --junitxml=coverage-reports/pytest-report.xml \
            --cov=quality_report --cov=image_changes \
            --cov-report=xml:coverage-reports/coverage.xml
      - name: Build PR quality report
        if: always()
        uses: ./.github/actions/quality-report
        with:
          junit-glob: coverage-reports/pytest-report.xml
          coverage-glob: coverage-reports/coverage.xml
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
          comment: ${{ github.event_name == 'pull_request' }}

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Detect preinstalled uv
        id: uv-runtime
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
            echo "Using preinstalled uv: $(uv --version)"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.uv-runtime.outputs.preinstalled != 'true'
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
          prune-cache: false
      - name: Mutation testing
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .ci/mutation.sh

  image-change-mutation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest pyyaml 'mutmut>=3.8.1,<4'
      - name: Mutate image change detection
        run: bash .ci/image-change-mutation.sh
