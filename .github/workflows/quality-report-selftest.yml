name: Quality reporter self-test

on:
  pull_request:
    paths:
      - ".github/actions/docker-build-push/**"
      - ".github/workflows/quality-report-selftest.yml"
      - ".github/actions/quality-report/**"
      - ".github/actions/run-python-tests/**"
      - ".github/actions/python-quality-security/**"
      - ".github/workflows/quality-evidence.yml"
      - ".github/actions/run-go-tests/**"
      - ".github/actions/run-node-tests/**"
      - "quality_report.py"
      - ".github/scripts/mutation_policy.py"
      - ".github/workflows/mutation-policy.yml"
      - ".github/workflows/mutation-issue-policy.yml"
      - ".ci/mutation-go.sh"
      - ".github/workflows/release.yml"
      - ".github/scripts/sync_internal_refs.py"
      - ".workflow-ci-version"
      - "templates/**"
      - "tests/**"
      - "pyproject.toml"
      - ".ci/mutation.sh"
      - ".ci/mutation_scope.py"
  push:
    branches: [main]
    paths:
      - ".github/actions/docker-build-push/**"
      - ".github/workflows/quality-report-selftest.yml"
      - ".github/actions/quality-report/**"
      - ".github/actions/run-python-tests/**"
      - ".github/actions/python-quality-security/**"
      - ".github/workflows/quality-evidence.yml"
      - ".github/actions/run-go-tests/**"
      - ".github/actions/run-node-tests/**"
      - "quality_report.py"
      - ".github/scripts/mutation_policy.py"
      - ".github/workflows/mutation-policy.yml"
      - ".github/workflows/mutation-issue-policy.yml"
      - ".ci/mutation-go.sh"
      - ".github/workflows/release.yml"
      - ".github/scripts/sync_internal_refs.py"
      - ".workflow-ci-version"
      - "templates/**"
      - "tests/**"
      - "pyproject.toml"
      - ".ci/mutation.sh"
      - ".ci/mutation_scope.py"

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv for quality report
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Unit tests with evidence
        run: |
          python -m pip install pytest pytest-cov
          mkdir -p coverage-reports
          PYTHONPATH="$GITHUB_WORKSPACE" pytest tests -q \
            --junitxml=coverage-reports/pytest-report.xml \
            --cov=quality_report \
            --cov-report=xml:coverage-reports/coverage.xml
      - name: Build PR quality report
        if: always()
        uses: ./.github/actions/quality-report
        with:
          junit-glob: coverage-reports/pytest-report.xml
          coverage-glob: coverage-reports/coverage.xml
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
          comment: ${{ github.event_name == 'pull_request' }}

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Mutation testing
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .ci/mutation.sh
