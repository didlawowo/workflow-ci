name: Quality reporter self-test

on:
  pull_request:
    paths:
      - ".forgejo/workflows/**"
      - ".github/actions/docker-build-push/**"
      - ".github/workflows/quality-report-selftest.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-main.yml"
      - ".github/actions/quality-report/**"
      - ".github/actions/run-python-tests/**"
      - ".github/actions/python-quality-security/**"
      - ".github/workflows/quality-evidence.yml"
      - ".github/actions/run-go-tests/**"
      - ".github/actions/run-node-tests/**"
      - "quality_report.py"
      - "image_changes.py"
      - ".ci/image-change-mutation.sh"
      - ".github/actions/detect-image-changes/**"
      - ".github/scripts/mutation_policy.py"
      - ".github/workflows/mutation-policy.yml"
      - ".github/workflows/mutation-issue-policy.yml"
      - ".ci/mutation-go.sh"
      - ".github/workflows/release.yml"
      - ".github/scripts/sync_internal_refs.py"
      - ".workflow-ci-version"
      - "templates/**"
      - "tests/**"
      - "pyproject.toml"
      - ".ci/mutation.sh"
      - ".ci/mutation_scope.py"
  workflow_call:

jobs:
  test:
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate runner cache
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" == phoenix-* ]]; then
            export WORKFLOW_CACHE_PROFILE=local
            export WORKFLOW_LOCAL_ROOT="$RUNNER_TEMP"
          fi
          # Preflight only: do not leak the selected cache profile into unit tests
          # that deliberately exercise NFS/local cache behavior in subprocesses.
          GITHUB_ENV=/dev/null
          export GITHUB_ENV
          source ".ci/nfs-cache.sh"
          require_nfs_cache UV_CACHE_DIR

      - name: Install uv for quality report
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          prune-cache: false
      - name: Unit tests with evidence
        run: |
          python -m pip install pytest pytest-cov pyyaml
          mkdir -p coverage-reports
          PYTHONPATH="$GITHUB_WORKSPACE" pytest tests -q \
            --junitxml=coverage-reports/pytest-report.xml \
            --cov=quality_report --cov=image_changes \
            --cov-report=xml:coverage-reports/coverage.xml
      - name: Build PR quality report
        if: always()
        uses: ./.github/actions/quality-report
        env:
          WORKFLOW_CACHE_PROFILE: ${{ startsWith(runner.name, 'phoenix-') && 'local' || 'nfs' }}
          WORKFLOW_LOCAL_ROOT: ${{ runner.temp }}
        with:
          junit-glob: coverage-reports/pytest-report.xml
          coverage-glob: coverage-reports/coverage.xml
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
          comment: ${{ github.event_name == 'pull_request' }}

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select runner cache profile
        shell: bash
        env:
          RUNNER_NAME: ${{ runner.name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$RUNNER_NAME" == phoenix-* ]]; then
            echo "WORKFLOW_CACHE_PROFILE=local" >> "$GITHUB_ENV"
            echo "WORKFLOW_LOCAL_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
      - name: Validate runner cache
        run: |
          source ".ci/nfs-cache.sh"
          require_nfs_cache UV_CACHE_DIR

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          prune-cache: false
      - name: Mutation testing
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .ci/mutation.sh

  image-change-mutation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || format('arc-runner-{0}', github.event.repository.name) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest pyyaml 'mutmut>=3,<4'
      - name: Mutate image change detection
        run: bash .ci/image-change-mutation.sh
