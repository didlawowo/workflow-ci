name: Python tests with PostgreSQL

on:
  workflow_call:
    inputs:
      runner:
        description: Label of an internal Forgejo runner
        required: true
        type: string
      working-directory:
        type: string
        default: .
      python-version:
        type: string
        default: '3.13'
      requirements-file:
        type: string
        default: requirements-dev.txt

jobs:
  tests:
    name: Test API
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate runner NFS cache
        shell: bash
        run: |
          # Compatibility entrypoint for runner-provided storage; NFS remains the default.
          set -euo pipefail

          workflow_local_environment() {
            local root="${WORKFLOW_LOCAL_ROOT:-}" job="${WORKFLOW_CACHE_JOB_ROOT:-}"
            [[ "$root" == /* && "$root" != / && -d "$root" && -O "$root" ]] || return 1
            [[ "$(realpath "$root")" == "$root" ]] || return 1
            case "$(findmnt -n -T "$root" -o FSTYPE)" in
              ext4|xfs|btrfs|overlay|tmpfs) ;;
              *) return 1 ;;
            esac
            if [[ -z "$job" ]]; then
              job="$(mktemp -d "$root/job.XXXXXX")"
            fi
            [[ "$job" == "$root"/job.* && -d "$job" && -O "$job" ]] || return 1
            [[ "$(realpath "$job")" == "$job" && "$(dirname "$job")" == "$root" ]] || return 1
            export WORKFLOW_CACHE_JOB_ROOT="$job"
            local variable suffix directory
            for variable in UV_CACHE_DIR GOCACHE GOMODCACHE NPM_CONFIG_CACHE UV_PROJECT_ENVIRONMENT TMPDIR UV_PYTHON_INSTALL_DIR; do
              case "$variable" in
                UV_CACHE_DIR) suffix=uv ;;
                GOCACHE) suffix=go-build ;;
                GOMODCACHE) suffix=go-mod ;;
                NPM_CONFIG_CACHE) suffix=npm ;;
                UV_PROJECT_ENVIRONMENT) suffix=python-env ;;
                TMPDIR) suffix=tmp ;;
                UV_PYTHON_INSTALL_DIR) suffix=python ;;
              esac
              directory="$job/$suffix"
              [[ ! -L "$directory" ]] || return 1
              mkdir -p "$directory"
              [[ -O "$directory" && "$(realpath "$directory")" == "$directory" ]] || return 1
              chmod 700 "$directory"
              export "$variable=$directory"
            done
            export UV_LINK_MODE=hardlink
            # Persist the complete environment across composite/workflow steps, including
            # uv subcommands. No project .venv or /tmp fallback is used in this profile.
            if [[ -n "${GITHUB_ENV:-}" ]]; then
              for variable in WORKFLOW_CACHE_JOB_ROOT UV_CACHE_DIR GOCACHE GOMODCACHE NPM_CONFIG_CACHE UV_PROJECT_ENVIRONMENT TMPDIR UV_PYTHON_INSTALL_DIR UV_LINK_MODE; do
                printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
              done
            fi
          }

          require_runner_cache() {
            local variable="$1" profile="${WORKFLOW_CACHE_PROFILE:-nfs}"
            case "$variable" in UV_CACHE_DIR|GOCACHE|GOMODCACHE|NPM_CONFIG_CACHE) ;; *) return 1 ;; esac
            case "$profile" in
              nfs) ;;
              local)
                if ! workflow_local_environment; then
                  echo '::error::Invalid local runner storage; no NFS or temporary-directory fallback.' >&2
                  return 1
                fi
                ;;
              *) echo "::error::Unknown WORKFLOW_CACHE_PROFILE: $profile" >&2; return 1 ;;
            esac
            local cache="${!variable:-}"
            if [[ "$cache" != /* ]]; then
              echo "::error::$variable must name an absolute runner-provided directory." >&2
              return 1
            fi
            # shellcheck disable=SC2016
            if ! timeout 6 bash -euo pipefail -c '
              cache="$1"; profile="$2"
              [[ -d "$cache" ]]
              filesystem="$(findmnt -n -T "$cache" -o FSTYPE)"
              if [[ "$profile" == nfs ]]; then
                [[ "$filesystem" == nfs || "$filesystem" == nfs4 ]]
              else
                case "$filesystem" in ext4|xfs|btrfs|overlay|tmpfs) ;; *) exit 1 ;; esac
              fi
              probe="$(mktemp "$cache/.workflow-ci-write-test.XXXXXX")"
              trap "rm -f \"$probe\"" EXIT
              printf "%s\n" workflow-ci > "$probe"
              cat "$probe" >/dev/null
            ' _ "$cache" "$profile"; then
              echo "::error::$variable is unavailable, unwritable or on the wrong filesystem; no fallback." >&2
              return 1
            fi
            export "${variable?}"
          }

          # Existing trusted policy callers retain this name and their source provenance.
          require_nfs_cache() { require_runner_cache "$@"; }
          require_nfs_cache UV_CACHE_DIR
      - name: Install uv
        run: curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          uv venv -p "$PYTHON_VERSION" .venv
          uv pip install -r "$REQUIREMENTS_FILE"

      - name: Run tests with coverage
        working-directory: ${{ inputs.working-directory }}
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          DB_HOST: ''
          TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ci_test
        run: .venv/bin/pytest -q -p no:cacheprovider --cov=. --cov-report=term
