name: Python tests with PostgreSQL

on:
  workflow_call:
    inputs:
      runner:
        description: Label of an internal Forgejo runner
        required: true
        type: string
      working-directory:
        type: string
        default: .
      python-version:
        type: string
        default: '3.13'
      requirements-file:
        type: string
        default: requirements-dev.txt

jobs:
  tests:
    name: Test API
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the uv version
        id: uv-version
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          # Same rule as .github/actions/setup-uv/resolve-version.sh: the
          # project's own required-version wins, otherwise the shared pin.
          if { [ -f uv.toml ] && grep -Eq '^[[:space:]]*required-version[[:space:]]*=' uv.toml; } ||
            { [ -f pyproject.toml ] && awk '/^[[:space:]]*\[/ { u = ($0 ~ /^[[:space:]]*\[tool\.uv\][[:space:]]*(#.*)?$/) } u && /^[[:space:]]*required-version[[:space:]]*=/ { f = 1 } END { exit !f }' pyproject.toml; }; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.13.7" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ steps.uv-version.outputs.version }}
          working-directory: ${{ inputs.working-directory }}
          enable-cache: false
          prune-cache: false
          github-token: ""

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          uv venv -p "$PYTHON_VERSION" .venv
          uv pip install -r "$REQUIREMENTS_FILE"

      - name: Run tests with coverage
        working-directory: ${{ inputs.working-directory }}
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          DB_HOST: ''
          TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ci_test
        run: .venv/bin/pytest -q -p no:cacheprovider --cov=. --cov-report=term
