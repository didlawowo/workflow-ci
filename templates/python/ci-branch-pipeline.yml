# =============================================================================
# CI - Branch Pipeline (Python)
# =============================================================================
# Runs on: pull requests to main (+ manual dispatch)
# Uses composite actions from: didlawowo/workflow-ci
#
# To adapt for your project:
# 1. Change RUNNER to your runner (or ubuntu-latest)
# 2. Adjust PYTHON_VERSION, COVERAGE_THRESHOLD
# 3. Adjust IMAGE_NAME to your Docker Hub image
# 4. Set secrets: DOCKER_USERNAME, DOCKER_PASSWORD, CODECOV_TOKEN
#
# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI PAS DE TRIGGER `push` (leçon apprise en prod)
# ─────────────────────────────────────────────────────────────────────────────
# Ce template déclenchait sur `push` (toutes branches sauf main) ET sur
# `pull_request`. Résultat : DEUX pipelines complets en parallèle pour le même
# commit, dès qu'une PR est ouverte — temps et coût runner doublés.
#
# Pire, sans bloc `concurrency` rien n'annulait les runs précédents : chaque
# push empilait de nouveaux runs. Et quand une annulation finissait par
# survenir, les jobs coupés remontaient en `failure` — un scan Trivy tué à
# 1m24 alors qu'il passe en 6m50, faisant croire à une CVE inexistante et
# bloquant une PR pour rien. Cas réel, diagnostiqué sur photo-analyser.
#
# Le run de PR couvre déjà chaque commit poussé sur la branche. Pour tester une
# branche AVANT d'ouvrir la PR : `workflow_dispatch`, ou ouvrir la PR en draft.
# =============================================================================

name: "CI - Branch Pipeline"

on:
  pull_request:
    branches: [main]
    # 'labeled' : nécessaire si un job est conditionné à un label (ex: build
    # d'image preview gardé par `contains(pull_request.labels.*.name, 'preview')`).
    # Sans ça, poser le label après le run initial ne relance rien.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# CONCURRENCE — n'exécuter que le run le plus récent
# ─────────────────────────────────────────────────────────────────────────────
# `ref_name` et NON `ref` : sur un push `head_ref` est vide et `github.ref`
# vaut `refs/heads/<branche>`, alors que sur une pull_request `head_ref` vaut
# `<branche>`. Utiliser `github.ref` produit donc deux clés différentes selon
# l'événement, et les runs ne s'annulent jamais entre eux — c'est ce qui
# laissait deux pipelines vivre en parallèle. `ref_name` vaut `<branche>` dans
# les deux cas, donc le run le plus récent annule bien le précédent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# PROJECT CONFIGURATION - Edit these values for your project
# ─────────────────────────────────────────────────────────────────────────────
env:
  RUNNER: "ubuntu-latest"
  PYTHON_VERSION: "3.12"
  COVERAGE_THRESHOLD: "30"
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/my-app  # <-- change this
  BANDIT_SKIP_RULES: "B104,B311"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🧪 TESTS & COVERAGE
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: "Tests & Coverage"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      coverage-percentage: ${{ steps.test.outputs.coverage-percentage }}
      tests-passed: ${{ steps.test.outputs.tests-passed }}
      test-count: ${{ steps.test.outputs.test-count }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        id: test
        uses: didlawowo/workflow-ci/.github/actions/run-python-tests@main
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          coverage-threshold: ${{ env.COVERAGE_THRESHOLD }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 🔍 QUALITY & SECURITY
  # ═══════════════════════════════════════════════════════════════════════════
  quality-security:
    name: "Quality & Security"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    outputs:
      quality-passed: ${{ steps.checks.outputs.quality-passed }}
      security-issues: ${{ steps.checks.outputs.security-issues }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run quality & security checks
        id: checks
        uses: didlawowo/workflow-ci/.github/actions/python-quality-security@main
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          bandit-skip-rules: ${{ env.BANDIT_SKIP_RULES }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 🐳 DOCKER BUILD
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build:
    name: "Docker Build & Scan"
    needs: [tests, quality-security]
    if: always() && needs.tests.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          echo "branch-tag=${BRANCH}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: didlawowo/workflow-ci/.github/actions/docker-build-push@main
        with:
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ steps.tag.outputs.branch-tag }}
          # Testait `event_name == 'push'`, trigger désormais supprimé : la
          # valeur serait restée définitivement fausse, donc trompeuse. Sur PR
          # on build sans publier — ce qui valide le Dockerfile et alimente le
          # scan — et on publie une image de branche seulement sur demande.
          # Les images de release sont produites par le workflow CD sur le tag.
          push: ${{ github.event_name == 'workflow_dispatch' }}
          registry-username: ${{ secrets.DOCKER_USERNAME }}
          registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 📊 PIPELINE SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: "Pipeline Summary"
    if: always()
    needs: [tests, quality-security, docker-build]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Create summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## CI Branch Pipeline Summary

          | Stage | Status |
          |-------|--------|
          | **Tests** | ${{ needs.tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | **Coverage** | ${{ needs.tests.outputs.coverage-percentage || 'N/A' }}% (threshold: ${{ env.COVERAGE_THRESHOLD }}%) |
          | **Quality** | ${{ needs.quality-security.result == 'success' && '✅ Passed' || '❌ Issues' }} |
          | **Docker** | ${{ needs.docker-build.result == 'success' && '✅ Built' || needs.docker-build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |

          **Branch**: \`${{ github.ref_name }}\` | **Commit**: \`${{ github.sha }}\`
          EOF
