# =============================================================================
# CI - Branch Pipeline (Node.js)
# =============================================================================
# To adapt: Set repository variable RUNNER if needed; change NODE_VERSION, NODE_WORKING_DIR, IMAGE_NAME, PACKAGE_MANAGER
# Set secrets: DOCKER_USERNAME, DOCKER_PASSWORD, CODECOV_TOKEN
# =============================================================================

name: "CI - Branch Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 'labeled' : nécessaire si un job est conditionné à un label (ex: build
    # d'image preview gardé par `contains(pull_request.labels.*.name, 'preview')`).
    # Sans ça, poser le label après le run initial ne relance rien.
    types: [opened, synchronize, reopened, labeled]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NODE_WORKING_DIR: "."  # project directory containing package.json
  PACKAGE_MANAGER: "npm"  # npm, pnpm, yarn
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/my-app  # <-- change this
  USE_PLAYWRIGHT: "false"  # set to "true" for e2e tests

jobs:
  tests:
    name: "Tests"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      tests-passed: ${{ steps.test.outputs.tests-passed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        id: test
        uses: didlawowo/workflow-ci/.github/actions/run-node-tests@v1.8.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager: ${{ env.PACKAGE_MANAGER }}
          working-directory: ${{ env.NODE_WORKING_DIR }}
          playwright: ${{ env.USE_PLAYWRIGHT }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  quality-security:
    name: "Quality & Security"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      quality-passed: ${{ steps.checks.outputs.quality-passed }}
      security-issues: ${{ steps.checks.outputs.security-issues }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run quality & security checks
        id: checks
        uses: didlawowo/workflow-ci/.github/actions/node-quality-security@v1.8.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager: ${{ env.PACKAGE_MANAGER }}
          working-directory: ${{ env.NODE_WORKING_DIR }}

      - name: Enforce quality and security gate
        shell: bash
        run: |
          set -euo pipefail
          QUALITY="${{ steps.checks.outputs.quality-passed }}"
          SECURITY="${{ steps.checks.outputs.security-issues }}"
          if [[ "$QUALITY" != "true" ]]; then
            echo "::error::Quality checks reported failure."
            exit 1
          fi
          if [[ -z "$SECURITY" || "$SECURITY" -ne 0 ]]; then
            echo "::error::Security checks reported ${SECURITY:-unknown} issue(s)."
            exit 1
          fi

  docker-build:
    name: "Docker Build & Scan"
    needs: [tests, quality-security]
    # PR = fast feedback. Expensive image build/scan only runs after merge to main or manually.
    if: always() && github.event_name != 'pull_request' && needs.tests.result == 'success' && needs.quality-security.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          echo "branch-tag=${BRANCH}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: didlawowo/workflow-ci/.github/actions/docker-build-push@v1.8.0
        with:
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ steps.tag.outputs.branch-tag }}
          push: ${{ github.event_name != 'pull_request' }}
          registry-username: ${{ secrets.DOCKER_USERNAME }}
          registry-password: ${{ secrets.DOCKER_PASSWORD }}

  summary:
    name: "Pipeline Summary"
    if: always()
    needs: [tests, quality-security, docker-build]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Create summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## CI Branch Pipeline Summary

          | Stage | Status |
          |-------|--------|
          | **Tests** | ${{ needs.tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |
          | **Quality** | ${{ needs.quality-security.result == 'success' && '✅ Passed' || '❌ Issues' }} |
          | **Docker** | ${{ needs.docker-build.result == 'success' && '✅ Built' || needs.docker-build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |

          **Branch**: \`${{ github.ref_name }}\` | **Commit**: \`${{ github.sha }}\`
          EOF
